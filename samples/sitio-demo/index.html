<script>
// ═══════════════════════════════════════════════════════════
// Delivery por zonas (puro). Lo usan el Mostrador, el menú publicado y la web: una sola cuenta.
// Este archivo se inyecta tal cual en la web publicada (sin imports): no usar nada fuera de él.
//   tienda = { lat, lng, zones: [{ id, name, type:'circle'|'polygon', radiusKm, points:[[lat,lng],…], baseCost }],
//              freeShippingMin, deliveryMinOrder }
// ═══════════════════════════════════════════════════════════

const DEFAULT_STORE_POINT = { lat: -34.6037, lng: -58.3816 };

function haversineKm(lat1, lon1, lat2, lon2) {
  const R = 6371, rad = Math.PI / 180;
  const dLat = (lat2 - lat1) * rad, dLon = (lon2 - lon1) * rad;
  const a = Math.sin(dLat / 2) ** 2 + Math.cos(lat1 * rad) * Math.cos(lat2 * rad) * Math.sin(dLon / 2) ** 2;
  return R * 2 * Math.atan2(Math.sqrt(a), Math.sqrt(1 - a));
}

/** Punto dentro de un polígono [[lat,lng],…] (ray casting). */
function pointInPolygon(lat, lng, polygon) {
  let inside = false;
  for (let i = 0, j = polygon.length - 1; i < polygon.length; j = i++) {
    const [yi, xi] = polygon[i], [yj, xj] = polygon[j];
    if (((yi > lat) !== (yj > lat)) && (lng < (xj - xi) * (lat - yi) / (yj - yi) + xi)) inside = !inside;
  }
  return inside;
}

/** Zona de una dirección: las circulares se prueban de menor a mayor radio; los polígonos por contención. */
function zoneFor(tienda, lat, lng) {
  const t = tienda || {};
  const sLat = t.lat != null ? t.lat : DEFAULT_STORE_POINT.lat, sLng = t.lng != null ? t.lng : DEFAULT_STORE_POINT.lng;
  const distKm = haversineKm(sLat, sLng, lat, lng);
  const zones = [...(t.zones || [])].sort((a, b) => (a.radiusKm || 999) - (b.radiusKm || 999));
  for (const z of zones) {
    if (z.type === 'polygon' && (z.points || []).length >= 3) { if (pointInPolygon(lat, lng, z.points)) return { zone: z, distKm }; }
    else if (distKm <= (z.radiusKm || 0)) return { zone: z, distKm };
  }
  return { zone: null, distKm, out: true };
}

/**
 * Envío de un pedido: costo de la zona, gratis desde `freeShippingMin` y mínimo de pedido para delivery.
 * → { ok, out, zone, distKm, cost, free, belowMin, minOrder }
 */
function shippingFor(tienda, lat, lng, subtotal) {
  const t = tienda || {};
  const z = zoneFor(t, lat, lng);
  if (!z.zone) return { ok: false, out: true, zone: null, distKm: z.distKm, cost: 0, free: false, belowMin: false, minOrder: t.deliveryMinOrder || 0 };
  const freeMin = t.freeShippingMin || 0;
  const free = freeMin > 0 && subtotal >= freeMin;
  const minOrder = t.deliveryMinOrder || 0;
  const belowMin = minOrder > 0 && subtotal < minOrder;
  return { ok: !belowMin, out: false, zone: z.zone, distKm: z.distKm, cost: free ? 0 : (z.zone.baseCost || 0), free, belowMin, minOrder };
}

// Pedido del menú publicado → mensaje de WhatsApp. Puro. Se inyecta tal cual en la web publicada (sin imports).
const PAY_LABELS = { efectivo: 'Efectivo', transferencia: 'Transferencia', mercadopago: 'Mercado Pago', tarjeta: 'Tarjeta' };

const money = (n, symbol = '$', locale = 'es-AR') => symbol + Number(n || 0).toLocaleString(locale, { maximumFractionDigits: 0 });

/** Solo dígitos, con el 54 9 de Argentina si viene un número local de 10 dígitos. */
function normalizePhone(raw, defaultCountry = '549') {
  let d = String(raw || '').replace(/\D+/g, '');
  if (!d) return '';
  d = d.replace(/^00/, '');
  if (d.length === 10) d = defaultCountry + d;
  if (d.startsWith('54') && !d.startsWith('549') && d.length === 12) d = '549' + d.slice(2);
  return d;
}

/**
 * order = { num, createdAt, source:'delivery'|'pickup', customerName, customerPhone, customerEmail, address, zoneName,
 *           paymentMethod, items:[{ name, qty, lineTotal }], subtotal, shipping, total, notes }
 */
function buildWaMessage(o, { symbol = '$', locale = 'es-AR' } = {}) {
  const num = '#' + String(o.num || 0).padStart(4, '0');
  const d = new Date(o.createdAt || Date.now());
  const when = d.toLocaleDateString(locale, { day: 'numeric', month: 'long' }) + ' ' + d.toLocaleTimeString(locale, { hour: '2-digit', minute: '2-digit' });
  const m = n => money(n, symbol, locale);
  // Sin emojis: wa.me los convierte en «�» al redirigir en algunos navegadores (probado con un redirect real).
  let msg = 'Hola! Quiero hacer un pedido.\n\n';
  msg += '*Pedido ' + num + '* · ' + when + '\n';
  msg += o.source === 'delivery' ? '*Delivery*\n' : '*Retiro en local*\n';
  msg += '\nCliente: *' + (o.customerName || 'Cliente') + '*\n';
  if (o.customerPhone) msg += 'Tel: ' + o.customerPhone + '\n';
  if (o.customerEmail) msg += 'Email: ' + o.customerEmail + '\n';
  if (o.source === 'delivery' && o.address) msg += 'Dirección: ' + o.address + (o.zoneName ? ' (' + o.zoneName + ')' : '') + '\n';
  msg += '\n*Detalle:*\n';
  (o.items || []).forEach(it => { msg += '  • ' + it.name + ' ×' + it.qty + ' — ' + m(it.lineTotal) + '\n'; });
  msg += '\nSubtotal: ' + m(o.subtotal) + '\n';
  if (o.source === 'delivery') msg += 'Envío: ' + (o.shipping ? m(o.shipping) : 'Gratis') + '\n';
  msg += '*Total: ' + m(o.total) + '*\n';
  msg += 'Pago: ' + (PAY_LABELS[o.paymentMethod] || o.paymentMethod || '') + '\n';
  if (o.notes) msg += 'Notas: ' + o.notes + '\n';
  return msg;
}

function waUrl(number, order, opts) {
  const n = normalizePhone(number);
  return 'https://wa.me/' + n + '?text=' + encodeURIComponent(buildWaMessage(order, opts));
}

  $('h-title').textContent=c.title||MENU.store.name||'Menú';$('h-sub').textContent=c.subtitle||'';
  $('foot').textContent=[MENU.store.name,MENU.store.address].filter(Boolean).join(' · ');
  if(c.enabled===false){$('grid').innerHTML='';$('cats').innerHTML='';$('msg').innerHTML='<div class="empty"><b>Menú no disponible por ahora</b><br>Volvé a intentar más tarde.</div>';return;}
  var cats=c.categories&&c.categories.length?c.categories:Array.from(new Set(MENU.products.map(function(p){return p.category}).filter(Boolean)));
  $('cats').innerHTML=['all'].concat(cats).map(function(k){return '<button class="cat '+(k===activeCat?'on':'')+'" data-cat="'+esc(k)+'">'+(k==='all'?'Todo':esc(k))+'</button>'}).join('');
  site();
  var list=MENU.products.filter(function(p){return activeCat==='all'||p.category===activeCat});
  $('grid').innerHTML=list.length?list.map(card).join(''):'<div class="empty">Todavía no hay productos para mostrar.</div>';
  bar();
}
function waHref(msg){var n=String((MENU.store&&MENU.store.whatsapp)||'').replace(/\D/g,'');return n?'https://wa.me/'+n+(msg?'?text='+encodeURIComponent(msg):''):'';}
function paras(t){return String(t||'').split(/\n{2,}/).map(function(x){return x.trim()}).filter(Boolean).map(function(x){return '<p>'+esc(x).replace(/\n/g,'<br>')+'</p>'}).join('');}
function site(){
  var S=MENU.site,c=MENU.config||{},on=!!(S&&S.enabled&&c.enabled!==false),top=$('s-top'),rest=$('s-rest');
  document.body.classList.toggle('has-site',on);
  if(!on){$('s-nav').innerHTML='';top.innerHTML='';rest.innerHTML='';return;}
  var name=MENU.store.name||c.title||'Menú',wa=waHref(),D=MENU.delivery||{},h='';
  var links=[['#menu','Menú']];
  if(S.aboutText)links.push(['#s-about','Nosotros']);
  if(S.reviews.length)links.push(['#s-reviews','Reseñas']);
  if(S.catering)links.push(['#s-catering','Catering']);
  if(S.faq.length)links.push(['#s-faq','Preguntas']);
  $('s-nav').innerHTML='<nav class="snav" id="snav"><b>'+esc(name)+'</b>'+links.map(function(l){return '<a href="'+l[0]+'">'+l[1]+'</a>'}).join('')+(wa?'<a class="wa" href="'+esc(wa)+'" target="_blank" rel="noopener">WhatsApp</a>':'')+'<button class="pedido" onclick="openCart()">Pedido ('+count()+')</button></nav>';
  h+='<section class="hero"><h1>'+esc(S.heroTitle||c.title||name)+'</h1>'+((S.heroSubtitle||c.subtitle)?'<p>'+esc(S.heroSubtitle||c.subtitle)+'</p>':'')+'<a class="go" href="#menu">'+esc(S.ctaLabel)+' →</a>'+
    (S.highlights.length?'<div class="hl">'+S.highlights.map(function(x){return '<div>'+(x.icon?'<i>'+esc(x.icon)+'</i>':'')+'<b>'+esc(x.title)+'</b>'+(x.text?'<span>'+esc(x.text)+'</span>':'')+'</div>'}).join('')+'</div>':'')+'</section>';
  var favs=MENU.products.filter(function(p){return p.star}).slice(0,6);
  if(favs.length)h+='<section class="sec"><h2>'+esc(S.favoritesTitle)+'</h2><div class="grid">'+favs.map(card).join('')+'</div></section>';
  h+='<section class="sec" style="padding-bottom:0"><h2>Nuestro menú</h2></section>';
  top.innerHTML=h;
  var r='';
  r+='<section class="sec alt" id="s-how"><div class="in"><h2>¿Cómo funciona?</h2><p class="lead">En 3 pasos tenés tu pedido.</p><div class="steps"><div class="step"><em>1</em><b>Elegí</b><div class="desc">Armá tu pedido desde el menú'+(wa?' o escribinos por WhatsApp':'')+'.</div></div><div class="step"><em>2</em><b>Confirmamos</b><div class="desc">Te contactamos para confirmar el pedido y coordinar.</div></div><div class="step"><em>3</em><b>Disfrutalo</b><div class="desc">Lo preparamos al momento y te lo llevamos o lo retirás en el local.</div></div></div></div></section>';
  if(S.aboutText)r+='<section class="sec about" id="s-about"><h2>'+esc(S.aboutTitle||'Nuestra historia')+'</h2>'+paras(S.aboutText)+'</section>';
  if(S.reviews.length)r+='<section class="sec alt" id="s-reviews"><div class="in"><h2>Lo que dicen nuestros clientes</h2><p class="lead"></p><div class="revs">'+S.reviews.map(function(x){return '<div class="rev"><div class="st">★★★★★</div>“'+esc(x.text)+'”'+((x.author||x.source)?'<small>'+esc([x.author,x.source].filter(Boolean).join(' · '))+'</small>':'')+'</div>'}).join('')+'</div></div></section>';
  var zones=(D.zones||[]).map(function(z){return z.name}).filter(Boolean);
  var info='';
  if(S.hours||zones.length||D.freeShippingMin||D.deliveryMinOrder)info+='<div><h3>🛵 Delivery</h3>'+(S.hours?'<div>'+esc(S.hours).replace(/\n/g,'<br>')+'</div>':'')+(D.deliveryMinOrder?'<div>Pedido mínimo: <b>'+fmt(D.deliveryMinOrder)+'</b></div>':'')+(D.freeShippingMin?'<div>Envío gratis desde <b>'+fmt(D.freeShippingMin)+'</b></div>':'')+(MENU.store.address?'<div>Retiro: '+esc(MENU.store.address)+'</div>':'')+'</div>';
  if(S.catering)info+='<div id="s-catering"><h3>🍽 '+esc(S.catering.title)+'</h3>'+(S.catering.text?'<div>'+esc(S.catering.text).replace(/\n/g,'<br>')+'</div>':'')+(S.catering.zone?'<div>📍 '+esc(S.catering.zone)+'</div>':'')+(S.catering.notice?'<div>⏰ '+esc(S.catering.notice)+'</div>':'')+(wa?'<div style="margin-top:10px"><a class="add" style="display:inline-block;text-decoration:none" target="_blank" rel="noopener" href="'+esc(waHref('Hola, quiero consultar por catering'))+'">Consultar por WhatsApp</a></div>':'')+'</div>';
  if(info)r+='<section class="sec"><div class="info">'+info+'</div></section>';
  if(S.faq.length)r+='<section class="sec faq" id="s-faq"><h2>Preguntas frecuentes</h2>'+S.faq.map(function(f){return '<details><summary>'+esc(f.q)+'</summary><p>'+esc(f.a)+'</p></details>'}).join('')+'</section>';
  r+='<div class="sfoot"><b>'+esc(name)+'</b><br>'+(MENU.store.address?esc(MENU.store.address)+'<br>':'')+(wa?'<a href="'+esc(wa)+'" target="_blank" rel="noopener">WhatsApp</a>':'')+(S.instagram?(wa?' · ':'')+'<a href="https://instagram.com/'+esc(S.instagram)+'" target="_blank" rel="noopener">@'+esc(S.instagram)+'</a>':'')+'<br><small style="opacity:.6">Hecho con Sahten</small></div>';
  rest.innerHTML=r;$('foot').textContent='';
  var nv=$('snav');if(nv)document.documentElement.style.setProperty('--navh',nv.offsetHeight+'px');
}
function card(p){
  var n=cart[p.id]||0, showP=MENU.config.showPrices!==false;
  var img=p.image&&MENU.config.showImages!==false?'<img loading="lazy" src="'+esc(p.image)+'" alt="" onerror="this.parentNode.textContent=this.getAttribute(\'data-i\')" data-i="'+esc((p.name||'?').charAt(0).toUpperCase())+'">':esc((p.name||'?').charAt(0).toUpperCase());
  return '<div class="card"><div class="ph">'+img+'</div><div class="body">'+(p.category?'<div class="cat-l">'+esc(p.category)+'</div>':'')+'<div class="name">'+esc(p.name)+'</div>'+(p.description?'<div class="desc">'+esc(p.description)+'</div>':'')+(showP?'<div class="price">'+fmt(p.price)+'</div>':'')+
   (n?'<div class="qty"><button data-dec="'+esc(p.id)+'" aria-label="Quitar">−</button><b>'+n+'</b><button data-inc="'+esc(p.id)+'" aria-label="Agregar">+</button></div>':'<button class="add" data-inc="'+esc(p.id)+'">Agregar</button>')+'</div></div>';
}
function lines(){return MENU.products.filter(function(p){return cart[p.id]}).map(function(p){return {id:p.id,name:p.name,qty:cart[p.id],unitPrice:p.price,lineTotal:p.price*cart[p.id]}});}
function subtotal(){return lines().reduce(function(s,l){return s+l.lineTotal},0);}
function count(){return lines().reduce(function(s,l){return s+l.qty},0);}
function bar(){var n=count();$('bar').classList.toggle('on',n>0);$('bar-n').textContent=n+(n===1?' producto':' productos');$('bar-t').textContent=fmt(subtotal());}
function change(id,d){cart[id]=Math.max(0,(cart[id]||0)+d);if(!cart[id])delete cart[id];if(geo)ship=shippingFor(MENU.delivery,geo.lat,geo.lng,subtotal());render();if($('ov').classList.contains('on'))sheet();}

// ── carrito / checkout ──
function openCart(){step='cart';sheet();$('ov').classList.add('on');}
function closeSheet(){$('ov').classList.remove('on');}
function payMethods(){var m=(MENU.payments&&MENU.payments.methods)||{efectivo:true};return Object.keys(m).filter(function(k){return m[k]});}
function total(){return subtotal()+(type==='delivery'&&ship&&ship.ok?ship.cost:0);}
function shipNote(){
  if(type!=='delivery')return '';
  if(!geo)return '<div class="note">Escribí tu dirección y elegí una de las sugerencias para calcular el envío.</div>';
  if(ship.out)return '<div class="note err">Tu dirección está fuera de la zona de entrega ('+ship.distKm.toFixed(1)+' km). Podés retirar en el local.</div>';
  if(ship.belowMin)return '<div class="note err">El pedido mínimo para delivery es '+fmt(ship.minOrder)+'.</div>';
  return '<div class="note ok">Envío '+(ship.free?'<b>gratis</b>':'<b>'+fmt(ship.cost)+'</b>')+' · '+esc(ship.zone.name)+'</div>';
}
function sheet(){
  var s=$('sheet'),ls=lines();
  if(step==='done'){s.innerHTML=done();return;}
  if(!ls.length){s.innerHTML='<h2>Tu pedido</h2><div class="empty">El carrito está vacío.</div><button class="cta ghost" data-close>Seguir viendo el menú</button>';return;}
  pay=pay||payMethods()[0]||'efectivo';
  var labels=PAY_LABELS;
  var canSend=!sending&&form.name.trim()&&form.phone.trim()&&(type==='pickup'||(geo&&ship&&ship.ok));
  s.innerHTML='<h2>Tu pedido</h2>'+ls.map(function(l){return '<div class="row"><span>'+esc(l.name)+' ×'+l.qty+'</span><span>'+fmt(l.lineTotal)+'</span></div>'}).join('')+
   '<div class="row"><span>Subtotal</span><span>'+fmt(subtotal())+'</span></div>'+(type==='delivery'&&ship&&ship.ok?'<div class="row"><span>Envío</span><span>'+(ship.cost?fmt(ship.cost):'Gratis')+'</span></div>':'')+'<div class="row t"><span>Total</span><span>'+fmt(total())+'</span></div>'+
   '<div class="seg"><button data-type="delivery" class="'+(type==='delivery'?'on':'')+'">🛵 Delivery</button><button data-type="pickup" class="'+(type==='pickup'?'on':'')+'">🏠 Retiro en local</button></div>'+
   (MENU.config.deliveryNote&&type==='delivery'?'<div class="note">'+esc(MENU.config.deliveryNote)+'</div>':'')+
   '<label>Nombre</label><input id="f-name" autocomplete="name" value="'+esc(form.name)+'"><label>Teléfono</label><input id="f-phone" type="tel" autocomplete="tel" value="'+esc(form.phone)+'">'+
   (type==='delivery'?'<label>Dirección de entrega</label><input id="f-addr" autocomplete="street-address" placeholder="Calle y número, localidad" value="'+esc(form.address)+'"><div id="sugs"></div>'+shipNote():'<div class="note">Retiro: '+esc(MENU.store.address||'en el local')+'</div>')+
   '<label>Forma de pago</label><select id="f-pay">'+payMethods().map(function(k){return '<option value="'+k+'"'+(k===pay?' selected':'')+'>'+(labels[k]||k)+'</option>'}).join('')+'</select>'+
   '<label>Notas (opcional)</label><textarea id="f-notes" rows="2">'+esc(form.notes)+'</textarea>'+
   '<div id="err"></div><button class="cta" id="send"'+(canSend?'':' disabled')+'>'+(sb()?'Enviar pedido':'Pedir por WhatsApp')+' · '+fmt(total())+'</button><button class="cta ghost" data-close>Seguir viendo el menú</button>';
  var bind=function(id,key){var el=$(id);if(el)el.addEventListener('input',function(){form[key]=el.value;refreshSend();});};
  bind('f-name','name');bind('f-phone','phone');bind('f-notes','notes');
  if($('f-pay'))$('f-pay').addEventListener('change',function(){pay=this.value;});
  if($('f-addr'))$('f-addr').addEventListener('input',function(){form.address=this.value;geo=null;ship=null;suggest(this.value);refreshSend();});
  renderSugs();
}
function refreshSend(){var b=$('send');if(!b)return;b.disabled=sending||!(form.name.trim()&&form.phone.trim()&&(type==='pickup'||(geo&&ship&&ship.ok)));}
function suggest(v){clearTimeout(sugTimer);sugs=[];renderSugs();if(!v||v.length<5)return;sugTimer=setTimeout(function(){
  var near=MENU.delivery&&MENU.delivery.lat!=null?'&viewbox='+[MENU.delivery.lng-0.4,MENU.delivery.lat+0.4,MENU.delivery.lng+0.4,MENU.delivery.lat-0.4].join(',')+'&bounded=0':'';
  fetch('https://nominatim.openstreetmap.org/search?format=json&limit=5&accept-language=es&addressdetails=1&q='+encodeURIComponent(v)+near).then(function(r){return r.json()}).then(function(rows){
    sugs=(rows||[]).map(function(d){return {label:d.display_name.split(',').slice(0,3).join(','),lat:+d.lat,lng:+d.lon};});renderSugs();}).catch(function(){sugs=[];var e=$('err');if(e)e.innerHTML='<div class="note err">No pudimos buscar la dirección (sin conexión).</div>';});},500);}
function renderSugs(){var el=$('sugs');if(!el)return;el.innerHTML=sugs.length?'<div class="sug">'+sugs.map(function(s,i){return '<div data-sug="'+i+'">'+esc(s.label)+'</div>'}).join('')+'</div>':'';}
function pickSug(i){var s=sugs[i];if(!s)return;form.address=s.label;geo={lat:s.lat,lng:s.lng};sugs=[];ship=shippingFor(MENU.delivery,s.lat,s.lng,subtotal());sheet();}

function buildOrder(){
  var ls=lines(),sub=subtotal(),sh=type==='delivery'&&ship&&ship.ok?ship.cost:0;
  return {id:'web_'+Date.now().toString(36)+Math.random().toString(36).slice(2,6),num:Math.floor(Math.random()*9000)+1000,createdAt:new Date().toISOString(),source:type,status:'pendiente',
    customerName:form.name.trim(),customerPhone:form.phone.trim(),customerEmail:form.email.trim(),address:type==='delivery'?form.address:'Retiro en local',zoneName:type==='delivery'&&ship&&ship.zone?ship.zone.name:'',
    lat:geo?geo.lat:null,lng:geo?geo.lng:null,paymentMethod:pay,items:ls,subtotal:sub,discount:0,shipping:sh,total:sub+sh,notes:form.notes.trim()};
}
function waLink(o){return waUrl(MENU.store.whatsapp,o,cur());}
function send(){
  if(sending)return; var o=buildOrder(); lastOrder=o; sending=true; refreshSend();
  if(!sb()){ sending=false; var w=window.open(waLink(o),'_blank'); finish(o,false); return; }
  var s=sb();
  fetch(s.url+'/rest/v1/orders',{method:'POST',headers:sbHeaders({Prefer:'return=minimal'}),body:JSON.stringify({store_id:s.storeId,payload:o})})
   .then(function(r){if(!r.ok)throw new Error('HTTP '+r.status);sending=false;finish(o,true);})
   .catch(function(){sending=false;step='cart';sheet();var e=$('err');if(e)e.innerHTML='<div class="note err"><b>No pudimos enviar tu pedido.</b> Revisá tu conexión y reintentá'+(MENU.store.whatsapp?', o pedilo por WhatsApp.':'.')+(MENU.store.whatsapp?'<br><a href="'+esc(waLink(o))+'" target="_blank" rel="noopener">Pedir por WhatsApp</a>':'')+'</div>';});
}
function finish(o,sent){cart={};step='done';render();sheet();$('ov').classList.add('on');}
function done(){
  var o=lastOrder,bank=(MENU.payments&&MENU.payments.bank)||{},sent=!!sb();
  var bankHtml=o.paymentMethod==='transferencia'&&(bank.alias||bank.cbu||bank.bankName)?'<div class="note"><b>Datos para la transferencia</b><br>'+['bankName','accountHolder','cbu','alias'].filter(function(k){return bank[k]}).map(function(k){return esc(bank[k])}).join('<br>')+'</div>':'';
  return '<h2>¡Gracias, '+esc(o.customerName)+'!</h2><div class="note ok">'+(sent?'Recibimos tu pedido <b>#'+String(o.num).padStart(4,'0')+'</b>. Te vamos a avisar por teléfono.':'Se abrió WhatsApp con tu pedido <b>#'+String(o.num).padStart(4,'0')+'</b>. Enviá el mensaje para confirmarlo.')+'</div>'+bankHtml+
   '<div class="row t"><span>Total</span><span>'+fmt(o.total)+'</span></div>'+(MENU.store.whatsapp?'<a class="cta wa" style="display:block;text-align:center;text-decoration:none" target="_blank" rel="noopener" href="'+esc(waLink(o))+'">'+(sent?'Avisar por WhatsApp':'Abrir WhatsApp de nuevo')+'</a>':'')+'<button class="cta ghost" data-close>Volver al menú</button>';
}

document.addEventListener('click',function(e){
  var t=e.target.closest('[data-cat],[data-inc],[data-dec],[data-type],[data-sug],[data-close],#send');if(!t)return;
  if(t.dataset.cat!==undefined){activeCat=t.dataset.cat;render();}
  else if(t.dataset.inc!==undefined)change(t.dataset.inc,1);
  else if(t.dataset.dec!==undefined)change(t.dataset.dec,-1);
  else if(t.dataset.type!==undefined){type=t.dataset.type;if(type==='delivery'&&geo)ship=shippingFor(MENU.delivery,geo.lat,geo.lng,subtotal());sheet();}
  else if(t.dataset.sug!==undefined)pickSug(+t.dataset.sug);
  else if(t.hasAttribute('data-close'))closeSheet();
  else if(t.id==='send')send();
});
window.openCart=openCart;window.__menu=function(){return MENU;};
load().then(function(){applyTheme();render();}).catch(function(e){$('msg').innerHTML='<div class="empty"><b>No pudimos cargar el menú.</b><br>'+esc(e.message)+'<br><small>Si abriste el archivo directo desde tu computadora, probá desde el sitio publicado.</small></div>';});
})();
</script>
</body>
</html>
