name: SAHTEN.online | Checkout de promociones verificado
on:
  pull_request:
    types: [opened, synchronize, reopened]
    paths:
      - "scripts/deploy/sahten-safe-promo-checkout.mjs"
      - "scripts/deploy/catalog-integrity.mjs"
      - "scripts/deploy/indexnow.mjs"
      - "scripts/deploy/editorial-home.mjs"
      - "src/online/editorial-state.js"
      - "media/sahten-editorial/**"
      - ".github/workflows/sahten-promo-checkout.yml"
  push:
    branches: [main]
    paths:
      - "scripts/deploy/sahten-safe-promo-checkout.mjs"
      - "scripts/deploy/catalog-integrity.mjs"
      - "scripts/deploy/indexnow.mjs"
      - "scripts/deploy/editorial-home.mjs"
      - "src/online/editorial-state.js"
      - "media/sahten-editorial/**"
      - ".github/workflows/sahten-promo-checkout.yml"
  workflow_dispatch:
    inputs:
      deploy:
        description: "Publicar el checkout verificado (sólo main)"
        type: boolean
        required: true
        default: false

permissions:
  contents: read

concurrency:
  group: sahten-online-production
  cancel-in-progress: false

jobs:
  package:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
      - run: npm ci
      - run: npm run check:versions
      - run: npm test
      - run: npm run build
      - name: Preservar portada, fotos y preparar checkout con promociones
        run: node scripts/deploy/sahten-safe-promo-checkout.mjs
      - name: Revisar integridad del paquete antes de publicación
        run: |
          node --input-type=module <<'NODE'
          import fs from 'node:fs';
          import assert from 'node:assert/strict';
          const r=JSON.parse(fs.readFileSync('sahten-promo-export/_deployment-report.json','utf8'));
          assert.equal(r.sourceDeploymentId,'e3d16cbf-08b9-4480-a654-02a0241bd647');
          assert.ok(r.products>0);
          assert.equal(r.catalogPreserved,true);
          assert.equal(r.commercialFingerprint,r.sourceCatalogFingerprint);
          assert.equal(r.reviewedUpsellClient,true);
          const menu=JSON.parse(fs.readFileSync('sahten-promo-export/menu.json','utf8'));
          const {catalogFingerprint}=await import('./scripts/deploy/catalog-integrity.mjs');
          assert.equal(catalogFingerprint(menu),r.commercialFingerprint);
          assert.equal(r.approvedEditorialDesign,true);
          assert.equal(r.homepageCatalogGuarded,true);
          assert.equal(r.defaultCashBenefit,10);
          assert.equal(r.preserved.length,14);
          assert.equal(r.descriptions,r.products);
          for(const p of ['index.html','pedir/index.html','menu.json','img/site_familia.jpg','img/site_historia.jpg'])
            assert.ok(fs.statSync('sahten-promo-export/'+p).size>0);
          const html=fs.readFileSync('sahten-promo-export/pedir/index.html','utf8');
          assert.ok(html.includes('function couponSection()'));
          assert.ok(html.includes('function fatayUpgradePanel()'));
          assert.ok(html.includes("if(rule===null)rule={type:'always'}"),'Campañas sin calendario deben cotizar');
          const {INDEXNOW_KEY}=await import('./scripts/deploy/indexnow.mjs');
          assert.equal(fs.readFileSync('sahten-promo-export/'+INDEXNOW_KEY+'.txt','utf8'),INDEXNOW_KEY);
          const home=fs.readFileSync('sahten-promo-export/index.html','utf8');
          assert.ok(home.includes('data-editorial="sahten-c-3"'));
          assert.ok(home.includes('Nos encontramos'));
          assert.ok(!home.includes('noindex'));
          assert.ok(html.includes('data-upsell-consult'));
          assert.ok(html.includes('upsell-offer'));
          console.log('Safe checkout verified: '+r.products+' products, live commercial state preserved');
          NODE
      - uses: actions/upload-artifact@v4
        with:
          name: sahten-online-guarded-promo-checkout
          path: sahten-promo-export/
          retention-days: 7

  deploy:
    needs: package
    if: >-
      (github.event_name == 'push' && github.ref == 'refs/heads/main') ||
      (github.event_name == 'workflow_dispatch' && inputs.deploy == true && github.ref == 'refs/heads/main')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: sahten-online-guarded-promo-checkout
          path: sahten-promo-export
      - name: Exigir misma producción de origen y token oficial
        shell: bash
        env:
          CF_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CF_ACCOUNT: ${{ secrets.CLOUDFLARE_ACCOUNT_ID || vars.CLOUDFLARE_ACCOUNT_ID || '897988dca067b1fdc6daf228fce49ab7' }}
        run: |
          set -euo pipefail
          if [[ -z "$CF_TOKEN" || -z "$CF_ACCOUNT" ]]; then
            echo "::error::Cloudflare no está autorizado. Producción sin cambios."
            exit 1
          fi
          data=$(curl --fail --silent --show-error -H "Authorization: Bearer $CF_TOKEN" "https://api.cloudflare.com/client/v4/accounts/$CF_ACCOUNT/pages/projects/sahten-menu")
          current=$(echo "$data" | jq -er '.result.canonical_deployment.id')
          expected=$(node -p "require('./sahten-promo-export/_deployment-report.json').sourceDeploymentId")
          if [[ "$current" != "$expected" ]]; then
            echo "::error::Cambió el deploy actual, se requiere reconciliar versión antes de publicar."
            exit 1
          fi
      - name: Rechazar un catálogo que cambió después de generar el paquete
        run: |
          node --input-type=module <<'NODE'
          import fs from 'node:fs';
          import {createHash} from 'node:crypto';
          const menu=JSON.parse(fs.readFileSync('sahten-promo-export/menu.json'));
          const report=JSON.parse(fs.readFileSync('sahten-promo-export/_deployment-report.json'));
          const sb=menu.supabase;
          const url=sb.url.replace(/\/$/,'')+'/rest/v1/stores?select=id,menus(json)&id=eq.'+encodeURIComponent(sb.storeId);
          const res=await fetch(url,{headers:{apikey:sb.anonKey,Authorization:'Bearer '+sb.anonKey},signal:AbortSignal.timeout(20000)});
          if(!res.ok)throw new Error('No se pudo verificar el catálogo vigente');
          const rows=await res.json(),row=rows[0];
          const live=(Array.isArray(row?.menus)?row.menus[0]:row?.menus)?.json;
          if(row?.id!==sb.storeId||!live)throw new Error('No coincide la tienda');
          const canonical=v=>Array.isArray(v)?v.map(canonical):v&&typeof v==='object'?Object.fromEntries(Object.keys(v).sort().map(k=>[k,canonical(v[k])])):v;
          const commercial=Object.fromEntries(['products','config','payments','promotions','delivery','cartRecommendations'].map(k=>[k,live[k]??null]));
          const digest=createHash('sha256').update(JSON.stringify(canonical(commercial))).digest('hex');
          if(digest!==report.commercialFingerprint)throw new Error('El catálogo cambió: generar un paquete actualizado antes de publicar');
          console.log('Estado comercial vigente confirmado sin modificarlo');
          NODE
      - name: Desplegar sólo el checkout y JSON actualizados, preservando otros recursos
        id: deploy_pages
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID || vars.CLOUDFLARE_ACCOUNT_ID || '897988dca067b1fdc6daf228fce49ab7' }}
          command: pages deploy sahten-promo-export --project-name sahten-menu --branch main
      - name: "Verificar producción: descuentos, productos y checkout"
        run: |
          set -euo pipefail
          for i in {1..8}; do
            if curl --fail --silent --show-error -H 'Cache-Control: no-cache' "https://sahten.online/menu.json?verify=$GITHUB_RUN_ID-$i" | node -e "
            let s='';process.stdin.on('data',x=>s+=x).on('end',()=>{
             const d=JSON.parse(s);
             const fs=require('node:fs'),crypto=require('node:crypto');
             const report=JSON.parse(fs.readFileSync('sahten-promo-export/_deployment-report.json'));
             const canonical=v=>Array.isArray(v)?v.map(canonical):v&&typeof v==='object'?Object.fromEntries(Object.keys(v).sort().map(k=>[k,canonical(v[k])])):v;
             const commercial=Object.fromEntries(['products','config','payments','promotions','delivery','cartRecommendations'].map(k=>[k,d[k]??null]));
             const digest=crypto.createHash('sha256').update(JSON.stringify(canonical(commercial))).digest('hex');
             if(digest!==report.commercialFingerprint)process.exit(1);
            })" && curl --fail --silent --show-error "https://sahten.online/pedir/?verify=$GITHUB_RUN_ID-$i" | node -e "let s='';process.stdin.on('data',c=>s+=c).on('end',()=>{if(!s.includes('data-upsell-consult')||!s.includes('upsell-offer')||!s.includes('function couponSection()'))process.exit(1)})" && curl --fail --silent --show-error "https://sahten.online/?verify=$GITHUB_RUN_ID-$i" | node -e "let s='';process.stdin.on('data',c=>s+=c).on('end',()=>{if(!s.includes('data-editorial=\"sahten-c-3\"'))process.exit(1)})"; then
              echo "Producción confirmada: catálogo comercial íntegro y cliente de complementos actualizado, sin activar ofertas."
              exit 0
            fi
            sleep 5
          done
          echo "::error::No se pudo confirmar el checkout publicado."
          exit 1
      - name: Avisar a IndexNow después de verificar producción
        continue-on-error: true
        run: node scripts/deploy/indexnow.mjs
      - name: Rollback de emergencia al deploy confirmado si falla verificación posterior
        if: ${{ failure() && steps.deploy_pages.outcome == 'success' }}
        env:
          CF_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CF_ACCOUNT: ${{ secrets.CLOUDFLARE_ACCOUNT_ID || vars.CLOUDFLARE_ACCOUNT_ID || '897988dca067b1fdc6daf228fce49ab7' }}
        run: |
          source=$(node -p "require('./sahten-promo-export/_deployment-report.json').sourceDeploymentId")
          curl --fail --silent --show-error -X POST \
            -H "Authorization: Bearer $CF_TOKEN" \
            -H 'Content-Type: application/json' \
            -d '{}' \
            "https://api.cloudflare.com/client/v4/accounts/$CF_ACCOUNT/pages/projects/sahten-menu/deployments/$source/rollback"
