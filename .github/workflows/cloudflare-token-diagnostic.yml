name: Diagnóstico privado Cloudflare Pages (sin despliegue)
on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/cloudflare-token-diagnostic.yml"
  workflow_dispatch: {}
permissions:
  contents: read
jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    env:
      CF_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
    steps:
      - name: Verificar acceso a Cloudflare sin imprimir ni utilizar el token para modificar datos
        shell: bash
        run: |
          set -euo pipefail
          if [[ -z "$CF_TOKEN" ]]; then
            echo "::error::No existe CLOUDFLARE_API_TOKEN en repository secrets."
            exit 1
          fi
          if [[ "$CF_TOKEN" == "Bearer "* ]]; then
            echo "::error::El valor del secreto incluye 'Bearer ' — guardar solo el token, sin prefijo."
            exit 1
          fi
          if [[ "$CF_TOKEN" == *$'\n'* || "$CF_TOKEN" == *$'\r'* ]]; then
            echo "::error::El valor del secreto incluye salto de línea: copiar únicamente el token."
            exit 1
          fi
          status=$(curl -sS --max-time 12 -w '%{http_code}' -o /tmp/cf-response.json \
            -H "Authorization: Bearer $CF_TOKEN" \
            "https://api.cloudflare.com/client/v4/accounts/897988dca067b1fdc6daf228fce49ab7/pages/projects/sahten-menu")
          echo "Cloudflare Pages GET: HTTP $status"
          jq -c '{success: .success, errors: [.errors[]? | {code, message}]}' /tmp/cf-response.json || true
          if [[ "$status" != "200" ]]; then
            echo "::error::No se puede desplegar hasta corregir el token. Producción intacta."
            exit 1
          fi
          echo "Acceso Pages confirmado: token apto para validación de despliegue."
