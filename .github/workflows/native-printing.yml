name: Native printing
on:
  pull_request:
    paths:
      - 'src-tauri/**'
      - 'src/desktop/receipt-printing.js'
      - 'src/ui/receipt-settings.js'
      - 'public/receipt-print.html'
      - '.github/workflows/native-printing.yml'
  workflow_dispatch: {}
permissions:
  contents: read
jobs:
  native:
    strategy:
      fail-fast: false
      matrix:
        os: [macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: npm }
      - uses: dtolnay/rust-toolchain@stable
      - uses: swatinem/rust-cache@v2
        with: { workspaces: './src-tauri -> target' }
      - run: npm ci
      - run: npm run build
      # Validation only: no real printer, job, release or credentials.
      - run: cargo test --locked --manifest-path src-tauri/Cargo.toml --lib
