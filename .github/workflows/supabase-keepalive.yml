# Diagnóstico manual. Sahten tiene tráfico operativo: no necesita consultas
# artificiales diarias. Se retira el cron que fallaba por configuración vacía.
name: Supabase connectivity diagnostic

on:
  workflow_dispatch: {}

permissions:
  contents: read

jobs:
  ping:
    runs-on: ubuntu-latest
    timeout-minutes: 2
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Comprobar API sin consultar datos operativos
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_ANON_KEY: ${{ secrets.SUPABASE_ANON_KEY }}
        run: node scripts/check-supabase-connectivity.mjs
