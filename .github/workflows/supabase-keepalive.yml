# Mantiene activo el plan gratis de Supabase: lo pausa tras 7 días sin uso.
# Una consulta diaria de solo lectura alcanza. Usa SOLO la anon key (pública), nunca la service_role.
# Configurar en el repositorio: Settings › Secrets and variables › Actions
#   SUPABASE_URL       https://abcd1234.supabase.co
#   SUPABASE_ANON_KEY  la anon key del proyecto
name: Supabase keep-alive

on:
  schedule:
    - cron: '17 12 * * *'   # todos los días a las 12:17 UTC
  workflow_dispatch: {}

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Consulta de lectura a la API
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_ANON_KEY: ${{ secrets.SUPABASE_ANON_KEY }}
        run: |
          if [ -z "$SUPABASE_URL" ] || [ -z "$SUPABASE_ANON_KEY" ]; then echo "Faltan los secretos SUPABASE_URL / SUPABASE_ANON_KEY"; exit 1; fi
          code=$(curl -s -o /tmp/out.json -w '%{http_code}' \
            "$SUPABASE_URL/rest/v1/stores?select=id&limit=1" \
            -H "apikey: $SUPABASE_ANON_KEY" -H "Authorization: Bearer $SUPABASE_ANON_KEY")
          echo "HTTP $code"; cat /tmp/out.json; echo
          [ "$code" = "200" ]
