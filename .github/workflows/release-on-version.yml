# Creación de releases firmados cuando se integra una nueva versión en main.
# QA visual real validada: importe local calculado desde pedidos históricos.
# Se ejecuta una sola vez al incorporar este workflow; el tag lo toma de package.json.
name: Publicar instaladores Sahten
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/release-on-version.yml'
      - 'package.json'
      - 'src-tauri/tauri.conf.json'
  workflow_dispatch: {}
permissions:
  contents: read
jobs:
  prepare:
    runs-on: ubuntu-latest
    permissions: { contents: read }
    outputs:
      tag: ${{ steps.version.outputs.tag }}
      should_release: ${{ steps.version.outputs.should_release }}
    steps:
      - uses: actions/checkout@v4
      - id: version
        env: { GH_TOKEN: '${{ secrets.GITHUB_TOKEN }}' }
        run: |
          version=$(node -p "require('./package.json').version")
          tag="v$version"
          echo "tag=$tag" >> "$GITHUB_OUTPUT"
          if gh release view "$tag" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            echo "should_release=false" >> "$GITHUB_OUTPUT"
            echo "La versión ya existe: $tag. No se vuelve a publicar."
          else
            echo "should_release=true" >> "$GITHUB_OUTPUT"
            echo "Preparando release $tag"
          fi
  tests:
    needs: prepare
    if: needs.prepare.outputs.should_release == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: npm }
      - run: npm ci
      - run: npm run check:versions
      - run: npm test
      - run: npm run build
      - run: SAHTEN_ONLINE=false npm run build
  release:
    needs: [prepare, tests]
    if: needs.prepare.outputs.should_release == 'true'
    permissions: { contents: write }
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: macos-latest
            args: --target universal-apple-darwin
          - platform: windows-latest
            args: ''
    runs-on: ${{ matrix.platform }}
    env:
      HAS_APPLE: ${{ secrets.APPLE_CERTIFICATE != '' }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: npm }
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.platform == 'macos-latest' && 'aarch64-apple-darwin,x86_64-apple-darwin' || '' }}
      - uses: swatinem/rust-cache@v2
        with: { workspaces: './src-tauri -> target' }
      - id: notes
        name: Notas del release
        shell: bash
        run: |
          { echo 'body<<EOF_NOTES'; node scripts/release-notes.mjs "${{ needs.prepare.outputs.tag }}"; echo 'EOF_NOTES'; } >> "$GITHUB_OUTPUT"
      - run: npm ci
      - name: Instaladores sin firma de Apple
        if: env.HAS_APPLE != 'true'
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        with:
          tagName: ${{ needs.prepare.outputs.tag }}
          releaseName: 'Sahten ${{ needs.prepare.outputs.tag }}'
          releaseBody: ${{ steps.notes.outputs.body }}
          releaseDraft: true
          prerelease: false
          includeUpdaterJson: true
          args: ${{ matrix.args }}
      - name: Instaladores firmados y notarizados
        if: env.HAS_APPLE == 'true'
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
          APPLE_CERTIFICATE: ${{ secrets.APPLE_CERTIFICATE }}
          APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
          APPLE_SIGNING_IDENTITY: ${{ secrets.APPLE_SIGNING_IDENTITY }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_PASSWORD: ${{ secrets.APPLE_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        with:
          tagName: ${{ needs.prepare.outputs.tag }}
          releaseName: 'Sahten ${{ needs.prepare.outputs.tag }}'
          releaseBody: ${{ steps.notes.outputs.body }}
          releaseDraft: true
          prerelease: false
          includeUpdaterJson: true
          args: ${{ matrix.args }}
  publish:
    needs: [prepare, release]
    if: needs.prepare.outputs.should_release == 'true'
    runs-on: ubuntu-latest
    permissions: { contents: write }
    env:
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      TAG: ${{ needs.prepare.outputs.tag }}
    steps:
      - name: Verificar integridad y publicar
        run: |
          assets=$(gh release view "$TAG" --repo "$GITHUB_REPOSITORY" --json assets -q '.assets[].name')
          echo "$assets"
          for pat in '\.dmg$' '-setup\.exe$' '\.msi$' '^latest\.json$'; do
            echo "$assets" | grep -Eq -- "$pat" || { echo "No se publica: falta $pat"; exit 1; }
          done
          gh release edit "$TAG" --repo "$GITHUB_REPOSITORY" --draft=false --latest
