/*__PAYMENT_CSS__*/
:root{--primary:#235328;--accent:#F28C00;--ink:#1e2c1f;--muted:#536256;--bg:#faf8f5;--card:#fff;--border:#e2ddd5;--red:#c0392b;--r:14px}

header{background:var(--primary);color:#fff;padding:28px 16px 22px;text-align:center}
header h1{margin:0 0 4px;font-size:26px;letter-spacing:-.02em}header p{margin:0;opacity:.85;font-size:14px}
.cats{position:sticky;top:0;z-index:5;background:var(--bg);display:flex;gap:8px;overflow-x:auto;padding:10px 16px;border-bottom:1px solid var(--border)}

.cat{flex:none;border:1.5px solid var(--border);background:#fff;border-radius:99px;padding:7px 14px;font-size:13px;font-weight:600;cursor:pointer}
.cat.on{background:var(--primary);border-color:var(--primary);color:#fff}
main{max-width:980px;margin:0 auto;padding:16px 16px 110px}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(230px,1fr));gap:14px}
.card{background:var(--card);border:1px solid var(--border);border-radius:var(--r);overflow:hidden;display:flex;flex-direction:column}
.ph{aspect-ratio:4/3;background:#ede8df;display:flex;align-items:center;justify-content:center;font-size:38px;font-weight:800;color:#b9b2a5}.ph img{width:100%;height:100%;object-fit:cover;display:block}
.body{padding:12px 14px 14px;display:flex;flex-direction:column;gap:6px;flex:1}.cat-l{font-size:11px;font-weight:700;letter-spacing:.5px;text-transform:uppercase;color:var(--accent)}
.name{font-weight:700;font-size:15px}.price{font-weight:800;font-size:16px;color:var(--primary);margin-top:auto}
.add{text-align:center;text-decoration:none;display:block;border:0;background:var(--accent);color:#fff;border-radius:10px;padding:9px 12px;font-weight:700;cursor:pointer}
.qty{display:flex;align-items:center;justify-content:space-between;gap:8px}.qty button{width:34px;height:34px;border-radius:10px;border:1.5px solid var(--border);background:#fff;font-size:18px;cursor:pointer}

.bar.on{display:block}.bar button{width:100%;max-width:980px;margin:0 auto;display:flex;justify-content:space-between;border:0;background:var(--primary);color:#fff;border-radius:12px;padding:14px 18px;font-weight:700;font-size:15px;cursor:pointer}

.sheet{background:#fff;width:100%;max-width:560px;max-height:94vh;overflow:auto;border-radius:18px 18px 0 0;padding:18px 18px 24px}
@media(min-width:700px){.ov{align-items:center}.sheet{border-radius:18px}}
.sheet h2{margin:0 0 12px;font-size:19px}.row{display:flex;justify-content:space-between;gap:10px;padding:7px 0;font-size:14px}.row.t{font-weight:800;font-size:17px;border-top:2px solid var(--primary);margin-top:6px;padding-top:10px}
.seg{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin:12px 0}.seg button{padding:10px;border-radius:10px;border:1.5px solid var(--border);background:#fff;font-weight:700;cursor:pointer}.seg button small{display:block;font-weight:500;font-size:12px;line-height:1.3;margin-top:3px}.seg button.on{border-color:var(--primary);background:rgba(35,83,40,.08);color:var(--primary)}
label{display:block;font-size:12px;font-weight:700;color:var(--muted);margin:10px 0 4px}input,select,textarea{width:100%;border:1.5px solid var(--border);border-radius:10px;padding:10px 12px;background:#fff}

.desc{font-size:12.5px;color:var(--muted);line-height:1.4}
/* sitio (portada + secciones): solo si el dueño lo activa */
:root{--serif:'DM Serif Display',Georgia,serif}

.oback a{color:var(--primary);font-weight:700;font-size:14px;text-decoration:none;border:1.5px solid var(--border);background:#fff;border-radius:99px;padding:8px 14px}.oback a:hover{border-color:var(--primary)}

.ctiles{display:grid;grid-template-columns:repeat(auto-fill,minmax(190px,1fr));gap:12px;max-width:980px;margin:20px auto 0}
.ctile{display:flex;flex-direction:column;background:var(--card);border:1px solid var(--border);border-radius:var(--r);overflow:hidden;text-decoration:none;color:inherit;transition:transform .15s,box-shadow .15s}
.ctile:hover{transform:translateY(-2px);box-shadow:0 8px 22px rgba(0,0,0,.1)}
.ct-ph{aspect-ratio:3/2;background:#ede8df;display:flex;align-items:center;justify-content:center;font-size:34px;font-weight:800;color:#b9b2a5}.ct-ph img{width:100%;height:100%;object-fit:cover;display:block}
.ctile b{padding:10px 12px 0;font-size:15px}.ctile small{padding:2px 12px 12px;color:var(--muted);font-size:12.5px}
.pedir-cta{display:block;max-width:980px;margin:18px auto 0;text-align:center;text-decoration:none;background:var(--accent);color:#fff;font-weight:800;font-size:16px;border-radius:14px;padding:16px 18px}.pedir-cta:hover{filter:brightness(.95)}
@media(prefers-reduced-motion:reduce){.ctile{transition:none}.ctile:hover{transform:none}}
.snav{position:sticky;top:0;z-index:7;background:color-mix(in srgb,var(--primary) 94%,transparent);backdrop-filter:blur(10px);color:#fff;display:flex;align-items:center;gap:4px;padding:10px 18px;overflow-x:auto;white-space:nowrap;box-shadow:0 1px 0 rgba(255,255,255,.08)}
.snav b{font-family:var(--serif);font-weight:400;font-size:21px;margin-right:auto;letter-spacing:.2px}
.snav a{color:#fff;text-decoration:none;font-size:13.5px;font-weight:600;opacity:.88;padding:7px 11px;border-radius:99px;transition:background .15s}.snav a[aria-current="page"]{background:rgba(255,255,255,.18);opacity:1}.snav a:hover{background:rgba(255,255,255,.14);opacity:1}
.snav .pedido{background:var(--accent);font-weight:800;border:0;color:#fff;border-radius:99px;padding:8px 16px;cursor:pointer;font-size:13.5px;margin-left:6px}
.has-site .cats{top:calc(var(--navh,56px) - 1px)}
.eyebrow{display:block;font-size:12px;font-weight:800;letter-spacing:.14em;text-transform:uppercase;color:var(--primary);margin-bottom:8px}
.sec{max-width:1040px;margin:0 auto;padding:64px 18px}.sec>h2,.in>h2,.hd h2{font-family:var(--serif);font-weight:400;margin:0 0 10px;font-size:clamp(28px,5vw,42px);line-height:1.1;letter-spacing:-.01em}
.sec .lead,.in>.lead{color:var(--muted);margin:0 0 26px;font-size:16px;line-height:1.55;max-width:640px}
.sec.alt{max-width:none;background:#fff;border-block:1px solid var(--border)}.sec.alt>.in{max-width:1040px;margin:0 auto}

.hero{position:relative;overflow:hidden;background:radial-gradient(1200px 500px at 85% -10%,rgba(255,255,255,.12),transparent 60%),linear-gradient(135deg,var(--primary),#14301a);color:#fff;padding:92px 18px 70px;text-align:center}
.hero.img{background-size:cover;background-position:center}.hero.img::before{content:'';position:absolute;inset:0;background:linear-gradient(180deg,rgba(10,20,12,.55),rgba(10,20,12,.78))}
.hero>*{position:relative}.hero .tag{display:inline-block;font-size:12px;font-weight:800;letter-spacing:.16em;text-transform:uppercase;border:1px solid rgba(255,255,255,.35);border-radius:99px;padding:6px 14px;margin-bottom:20px;opacity:.9}
.hero h1{font-family:var(--serif);font-weight:400;margin:0 auto 16px;max-width:820px;font-size:clamp(38px,8vw,72px);line-height:1.02;letter-spacing:-.02em}.hero p{margin:0 auto 30px;max-width:620px;font-size:clamp(16px,2.4vw,19px);opacity:.92;line-height:1.55}
.brand-mark{display:block;width:min(340px,70vw);height:auto;margin:0 auto 22px;color:#FFF4D6}#h-mark .brand-mark{width:min(220px,60vw);margin-bottom:10px}
.hero .btns{display:flex;gap:10px;justify-content:center;flex-wrap:wrap}.btn1,.btn2{display:inline-block;text-decoration:none;font-weight:800;border-radius:99px;padding:14px 28px;font-size:15px;transition:transform .15s}
.btn1{background:var(--accent);color:#fff;box-shadow:0 8px 24px rgba(0,0,0,.25)}.btn2{border:1.5px solid rgba(255,255,255,.55);color:#fff}.btn1:hover,.btn2:hover{transform:translateY(-2px)}
.hl{display:grid;grid-template-columns:repeat(auto-fit,minmax(190px,1fr));gap:12px;max-width:960px;margin:48px auto 0;text-align:left}
.hl div{background:rgba(255,255,255,.1);border:1px solid rgba(255,255,255,.14);backdrop-filter:blur(6px);border-radius:16px;padding:16px}.hl i{font-style:normal;font-size:26px;display:block;margin-bottom:8px}.hl b{display:block;font-size:15px}.hl span{font-size:13px;opacity:.85;line-height:1.4;display:block;margin-top:2px}
.fav .grid{grid-template-columns:repeat(auto-fill,minmax(250px,1fr))}.more{display:inline-block;margin-top:20px;font-weight:800;color:var(--primary);text-decoration:none;border-bottom:2px solid var(--accent)}
.card{transition:transform .18s,box-shadow .18s;border-radius:16px}.card:hover{transform:translateY(-3px);box-shadow:0 14px 30px rgba(20,48,26,.12)}.add{border-radius:99px!important}.desc{font-size:12.5px;color:var(--muted);line-height:1.45}
.steps{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:16px;counter-reset:s}.step{background:var(--bg);border:1px solid var(--border);border-radius:18px;padding:22px}.step em{font-style:normal;display:inline-grid;place-items:center;width:36px;height:36px;border-radius:50%;background:var(--accent);color:#fff;font-weight:800;margin-bottom:12px}.step b{display:block;font-size:17px;margin-bottom:4px}
.two{display:grid;grid-template-columns:1.2fr 1fr;gap:34px;align-items:center}@media(max-width:760px){.two{grid-template-columns:1fr}}
.about p{line-height:1.7;font-size:16px;margin:0 0 14px}.pic{aspect-ratio:4/5;border-radius:22px;background:#ede8df center/cover;box-shadow:0 20px 50px rgba(20,48,26,.18)}
.badge{background:var(--primary);color:#fff;border-radius:20px;padding:26px;margin-top:20px}.badge small{opacity:.75;font-size:12px;letter-spacing:.1em;text-transform:uppercase;font-weight:700}.badge .w{font-family:var(--serif);font-size:44px;line-height:1.1;margin:6px 0}.badge .m{font-style:italic;opacity:.9}.badge .q{margin-top:10px;opacity:.85;font-size:14px;line-height:1.5}

.revs{display:grid;grid-template-columns:repeat(auto-fit,minmax(260px,1fr));gap:16px}.rev{background:var(--bg);border:1px solid var(--border);border-radius:18px;padding:22px;font-size:15px;line-height:1.55}.rev .st{color:var(--accent);letter-spacing:3px;font-size:14px;margin-bottom:6px}.rev small{display:block;color:var(--muted);margin-top:12px;font-weight:600}

/* Espacio de compra: acciones visibles y marca adaptable. */
:root{--on-accent:#1c1c1e;--on-primary:#fff;--visual-height:100dvh;--visual-top:0px}
.snav{overflow:visible;white-space:normal;gap:8px;padding:8px 12px}
.snav b{flex:1;min-width:0;max-width:280px;line-height:1.15;overflow-wrap:anywhere;display:-webkit-box;-webkit-box-orient:vertical;-webkit-line-clamp:2;overflow:hidden}
.snav-links{display:flex;flex:none;align-items:center}
.snav .pedido{flex:none;min-height:44px;white-space:nowrap;margin:0;color:var(--on-accent)}
.snav .wa{flex:none;white-space:nowrap}
.snav-menu{display:none}
.snav-menu summary{list-style:none;cursor:pointer;min-height:44px;display:flex;align-items:center;padding:8px 12px;border:1px solid currentColor;border-radius:10px;font-size:14px;font-weight:700}
.snav-menu summary::-webkit-details-marker{display:none}
.snav-menu>div{position:absolute;top:100%;right:12px;left:12px;max-width:360px;margin-left:auto;max-height:calc(100dvh - var(--navh,60px) - 24px);overflow:auto;background:var(--primary);border:1px solid rgba(255,255,255,.4);border-radius:12px;padding:8px;box-shadow:0 12px 30px rgba(0,0,0,.25)}
.snav-menu>div a{display:block;min-height:44px}
.add,.btn1,.pedir-cta,.step em,.band{color:var(--on-accent)}
.cat.on,.bar button,.cta:not(.ghost):not(.wa){color:var(--on-primary)}
.qty button{width:44px;height:44px}
.sug button{display:block;width:100%;min-height:44px;text-align:left;padding:10px 12px;border:0;border-bottom:1px solid var(--border);background:var(--card);font:inherit;cursor:pointer}
.sug button:hover{background:var(--bg)}
.cta.wa{color:#10261a}
input,select,textarea{font-size:16px;min-height:44px}
.modal-open{overflow:hidden}
.ov{top:var(--visual-top);bottom:auto;height:var(--visual-height);padding:8px}
.sheet{padding:0;max-height:calc(var(--visual-height) - 16px);display:flex;flex-direction:column;border-radius:16px}
.sheet:focus{outline:none}
.sheet-head{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:12px 16px;border-bottom:1px solid var(--border);flex:none}
.sheet-head h2{margin:0}
.sheet-close{min-width:44px;min-height:44px;border:1px solid var(--border);border-radius:8px;background:var(--bg);font-size:24px;cursor:pointer}
.sheet-body{min-height:0;overflow:auto;overscroll-behavior:contain;padding:0 16px 16px}
.sheet-footer{padding:8px 16px calc(12px + env(safe-area-inset-bottom,0px));border-top:1px solid var(--border);flex:none;max-height:min(55dvh,calc(var(--visual-height) - 96px));overflow:auto;background:var(--card)}
.sheet-footer:empty{display:none}
.sheet-footer .cta{margin-top:8px;min-height:48px}
.sheet-status{font-size:13px;line-height:1.4;color:var(--ink);margin-top:6px}
.sheet-footer .row.t{margin:0;padding-top:6px;border:0}
:root{--checkout-muted:#536256}
.checkout-steps{display:flex;gap:12px;list-style:none;padding:12px 0;margin:0 0 6px;border-bottom:1px solid var(--border);font-size:13px;color:var(--checkout-muted)}
.checkout-steps li{display:flex;align-items:center;gap:6px;flex:1}.checkout-steps b{display:grid;place-items:center;width:24px;height:24px;flex:none;border-radius:50%;background:var(--bg)}.checkout-steps [aria-current="step"]{font-weight:800;color:var(--primary)}.checkout-steps [aria-current="step"] b{background:var(--primary);color:var(--on-primary)}
.cart-items{list-style:none;padding:0;margin:0}.cart-item{padding:14px 0;border-bottom:1px solid var(--border);display:grid;grid-template-columns:minmax(0,1fr) auto;gap:10px;align-items:start}.cart-item-name{font-weight:700;overflow-wrap:anywhere;font-size:15px;line-height:1.4}.cart-item-unit{font-size:13px;color:var(--checkout-muted);margin-top:3px}.cart-item-price{font-weight:800;white-space:nowrap;text-align:right}.cart-item-actions{grid-column:1/-1;display:flex;justify-content:space-between;align-items:center;gap:12px}.cart-quantity{display:flex;align-items:center;gap:8px}.cart-quantity button{min-width:44px;min-height:44px;border:1px solid var(--border);border-radius:10px;background:var(--bg);font-size:22px;cursor:pointer}.cart-quantity button:disabled{opacity:.4;cursor:not-allowed}.cart-quantity output{min-width:24px;text-align:center;font-size:16px;font-weight:700}.cart-remove,.checkout-edit,.checkout-back{border:1px solid var(--border);border-radius:10px;background:var(--card);min-height:44px;padding:8px 12px;font-weight:700;cursor:pointer}.cart-remove{color:var(--red)}.cart-help{font-size:13px;line-height:1.5;color:var(--checkout-muted)}.checkout-summary{display:flex;justify-content:space-between;align-items:center;gap:12px;padding:8px 0}.checkout-summary strong{font-size:15px}.checkout-review{border-bottom:1px solid var(--border);padding:4px 0 10px}.checkout-review summary{min-height:44px;display:flex;align-items:center;gap:8px;cursor:pointer;font-size:14px;font-weight:600}.checkout-review summary::before{content:'▸'}.checkout-review[open] summary::before{content:'▾'}.checkout-back{width:100%;margin-top:8px}

@media(max-width:1200px){.snav-links{display:none}.snav-menu{display:block;flex:none}}
@media(max-width:620px){.snav a{display:block!important}.snav .wa{display:none!important}.snav b{font-size:16px}.snav .pedido{padding:8px 12px}.snav-menu summary{padding:8px}.sheet-footer .cta.ghost{display:none}}

.review-invite h3{font-size:22px;line-height:1.3;margin:0 0 8px}.review-invite p{font-size:16px;line-height:1.5;margin:0}.google-review-button{display:inline-flex;justify-content:center;align-items:center;gap:10px;min-height:48px;padding:12px 18px;border:1px solid #747775;border-radius:10px;background:#fff;color:#1f1f1f;text-decoration:none;font-size:16px;font-weight:700;line-height:1.4}.google-review-button img{flex:none}.google-review-button:hover{background:#f1f3f4}.google-review-button:focus-visible{outline:3px solid #1a73e8;outline-offset:3px}@media(max-width:640px){.review-invite{padding:20px;gap:18px}.google-review-button{width:100%}.review-invite h3{font-size:21px}}

<header><h1 id="h-title">Menú</h1><p id="h-sub"></p></header>

<script>
(function(){
'use strict';
var ORDER_PAGE=document.body.hasAttribute('data-storefront'), PREVIEW=document.body.hasAttribute('data-preview');
var deliveryServerOffset=0,addressGeneration=0,addressAbort=null,addressSuggest=createAddressSuggestions();
var deliveryRoute=null,deliveryAuthorization=null,deliveryQuoteId=null,deliveryGeneration=0,deliveryLoading=false,deliveryError='',deliverySubmission=null,deliveryUpdateNotice='';
var MENU=null, cart={}, type='delivery', geo=null, ship=null, pay='', form={name:'',phone:'',email:'',address:'',addressFloor:'',addressApartment:'',deliveryReference:'',cashTendered:'',notes:''}, step='cart', sending=false, lastOrder=null, sugTimer=null, sugs=[];
var $=function(id){return document.getElementById(id)};
var esc=function(s){return String(s==null?'':s).replace(/[&<>"']/g,function(m){return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#039;'}[m]})};
/* Caligrafía de la marca sola (vector incrustado al publicar; solo con kit de marca). Devuelve '' si no hay. */
var BRAND=null;try{BRAND=JSON.parse($('brand-inline').textContent.replace(/^\/\*.*?\*\//,''));}catch(e){}
function brandMark(label,placement){var s=MENU&&MENU.site,h=s&&s.hero,custom=s&&s.logo,mono=s&&s.logoUseTextColor;
  if(placement==='hero'&&h&&h.logo){custom=h.logo;mono=h.logoUseTextColor!==false;}
  if(/^data:image\/(?:png|jpeg|webp|svg\+xml);base64,[A-Za-z0-9+/]+={0,2}$/.test(custom||'')){return mono?'<span class="brand-mark brand-mask" role="img" aria-label="'+esc(label)+'" style="--logo:url('+custom+')"><img src="'+custom+'" alt="" aria-hidden="true"></span>':'<img class="brand-mark" alt="'+esc(label)+'" src="'+custom+'">';}
  return BRAND&&BRAND.d?'<svg class="brand-mark" viewBox="'+esc(BRAND.viewBox)+'" role="img" aria-label="'+esc(label)+'"><path d="'+esc(BRAND.d)+'" fill="currentColor"/></svg>':'';}

var cur=function(){return (MENU&&MENU.store&&MENU.store.currency)||{symbol:'$',locale:'es-AR'}};
var fmt=function(n){return cur().symbol+Number(n||0).toLocaleString(cur().locale,{maximumFractionDigits:2})};
var q=new URLSearchParams(location.search);

// ── carga: menú en vivo (Supabase, si hay) y respaldo en menu.json ──
function sb(){return MENU&&MENU.supabase;}
function sbHeaders(extra){var s=sb();return Object.assign({apikey:s.anonKey,Authorization:'Bearer '+s.anonKey,'Content-Type':'application/json'},extra||{});}
function fetchLimited(url,options,ms){var controller=new AbortController(),timer=setTimeout(function(){controller.abort();},ms||8000);return fetch(url,Object.assign({},options||{},{signal:controller.signal})).finally(function(){clearTimeout(timer);});}
function slugFromLocation(){
  var s=q.get('store'); if(s) return s;
  var h=location.hostname.split('.'); if(h.length>=3 && h[0]!=='www') return h[0];
  return '';
}
function load(){
  return fetch('menu.json',{cache:'no-cache'}).then(function(r){if(!r.ok)throw new Error('menu.json '+r.status);return r.json();})
   .catch(function(){var el=$('menu-fallback');var d=null;try{d=JSON.parse(el.textContent.replace(/^\/\*.*?\*\//,''));}catch(e){}if(!d)throw new Error('No pudimos cargar el menú.');return d;})
   .then(function(base){
     MENU=base; restoreCart();applyTheme();render();route(); var s=sb(); if(!s) return;
     var slug=slugFromLocation()||s.slug;
     var url=s.url+'/rest/v1/stores?select=id,menus(json)&'+(slug?'slug=eq.'+encodeURIComponent(slug):'id=eq.'+encodeURIComponent(s.storeId));
     return fetchLimited(url,{headers:sbHeaders()}).then(function(r){return r.ok?r.json():[];}).then(function(rows){
       var live=rows&&rows[0]&&rows[0].menus&&(Array.isArray(rows[0].menus)?rows[0].menus[0]:rows[0].menus);
       if(live&&live.json&&live.json.products){var keep=base.supabase;MENU=publishedMenuWithLiveCatalog(base,live.json);
       /* Las URL de Storage ya están subidas. Las rutas locales requieren el archivo publicado. */
       var had={};base.products.forEach(function(b){if(b.image)had[b.id+'|'+b.image]=1;});
       MENU.products.forEach(function(p){if(p.image&&!/^https:\/\//.test(p.image)&&!had[p.id+'|'+p.image])p.image=null;});MENU.supabase=keep;if(rows[0].id)MENU.supabase=Object.assign({},keep,{storeId:rows[0].id});}
     }).catch(function(){/* sin conexión: queda el menu.json */});
   });
}

// ── Checkout Pro por negocio; las credenciales privadas nunca llegan al navegador ──
var mpAvailable=false, mpPending=null, mpResult=null, mpTimer=null, mpPolls=0, mpBusy=false, mpPaymentId=null;
function mpEndpoint(path){return sb().url+'/functions/v1/sahten-payments/'+path;}
function mpSessionKey(){return 'sahten-mp:'+sb().storeId;}
function mpSavePending(p){sessionStorage.setItem(mpSessionKey(),JSON.stringify(p));mpPending=p;}
function mpConfig(){
  if(!sb())return Promise.resolve();
  return fetchLimited(mpEndpoint('config')+'?store_id='+encodeURIComponent(sb().storeId)+(q.get('mp_test')==='1'?'&test=1':''),{headers:sbHeaders()},5000)
    .then(function(r){return r.ok?r.json():{};}).then(function(c){mpAvailable=!!c.enabled;}).catch(function(){mpAvailable=false;});
}
function mpCall(path,data){return fetch(mpEndpoint(path),{method:'POST',headers:sbHeaders(),body:JSON.stringify(data)}).then(function(r){return r.json().then(function(d){if(!r.ok){var e=new Error(d.message||'No pudimos conectar con Mercado Pago.');e.code=d.code;throw e;}return d;});});}
function mpGo(url){var u=new URL(url);if(u.protocol!=='https:'||!/^(?:(?:www|sandbox)\.)?mercadopago\.com(?:\.ar)?$/.test(u.hostname))throw new Error('El enlace de pago no es válido.');location.assign(u.href);}
function mpStart(o){
  if(!mpAvailable){sending=false;refreshSend();$('err').textContent='Este negocio todavía no habilitó Mercado Pago.';return;}
  try{
    if(mpResult&&['paid','overpaid','refunded','partially_refunded','charged_back'].includes(mpResult.paymentStatus)){mpPending=null;mpResult=null;}
    var fingerprint=JSON.stringify(o.items.map(function(i){return [i.id,i.qty];}))+JSON.stringify([o.source,o.address,o.addressFloor,o.addressApartment,o.deliveryReference,o.lat,o.lng,o.total,o.customerName,o.customerPhone,o.notes]);
    if(!mpPending||mpPending.fingerprint!==fingerprint){var bytes=new Uint8Array(32);crypto.getRandomValues(bytes);mpSavePending({requestId:crypto.randomUUID(),proof:Array.from(bytes,function(b){return b.toString(16).padStart(2,'0');}).join(''),fingerprint:fingerprint,cart:cart,createdAt:Date.now()});}
  }catch(e){sending=false;refreshSend();$('err').textContent='Habilitá el almacenamiento de esta página para continuar con el pago.';return;}
  mpCall('checkout',{storeId:sb().storeId,requestId:mpPending.requestId,proof:mpPending.proof,order:o}).then(function(c){
    mpSavePending(Object.assign({},mpPending,{id:c.id}));
    if(!c.checkoutUrl){sending=false;mpResult=c;step='mp';sheet();showSheet();return;}
    mpGo(c.checkoutUrl);
  }).catch(function(e){sending=false;if(e.code==='service_paused'){MENU.delivery=Object.assign({},MENU.delivery,{enabled:false});render();sheet();}if(e.code==='checkout_expired'||e.code==='checkout_conflict')mpPending=null;refreshSend();$('err').textContent=e.message;});
}
function mpStatusText(){var s=mpResult&&mpResult.paymentStatus;if(s==='paid'&&mpResult.mode==='test')return 'Pago de prueba acreditado. No se creó una venta real.';return ({paid:'Pago acreditado. El negocio recibió tu pedido.',overpaid:'Se acreditó más de un pago. El negocio recibió un solo pedido; contactalo para revisar el cobro excedente.',in_mediation:'El pago está en revisión. Consultá al negocio por tu pedido.',pending:'Pago pendiente. El pedido se enviará al negocio cuando se acredite completo.',partial:'El pago está incompleto. Esperamos la acreditación del importe total.',rejected:'El pago no se acreditó. Podés volver a intentarlo en Mercado Pago.',refunded:'El pago fue reembolsado. Consultá al negocio por tu pedido.',partially_refunded:'El pago tiene un reembolso parcial. Consultá al negocio.',charged_back:'El pago tiene un contracargo. Consultá al negocio.'})[s]||'Estamos verificando el pago. Volver desde Mercado Pago no confirma por sí solo su acreditación.';}
function mpSheet(){
  var s=mpResult&&mpResult.paymentStatus;
  setSheetContent('<h3>Pago con Mercado Pago</h3><p role="status">'+esc(mpStatusText())+'</p>'+(mpResult?'<div class="row t"><span>Total</span><span>'+fmt(mpResult.total)+'</span></div>':'')+(!mpPending?'<p>Para consultar el resultado de esta compra, volvé desde el mismo navegador donde iniciaste el pago o contactá al negocio.</p>':''),
    (mpPending?'<button class="cta" data-mp-refresh>Verificar pago</button>':'')+((s==='rejected'||s==='pending')&&mpResult.checkoutUrl?'<button class="cta ghost" data-mp-retry>Volver a Mercado Pago</button>':'')+'<button class="cta ghost" data-close>Volver al menú</button>');
}
function mpRefresh(paymentId){
  if(!mpPending||!mpPending.id||mpBusy)return Promise.resolve();mpBusy=true;
  return mpCall('status',{id:mpPending.id,proof:mpPending.proof,paymentId:paymentId||mpPaymentId||undefined}).then(function(c){mpResult=c;if(['paid','overpaid'].includes(c.paymentStatus)){cart={};render();}if(step==='mp')sheet();
    clearTimeout(mpTimer);if(['pending','partial'].includes(c.paymentStatus)&&mpPolls++<12)mpTimer=setTimeout(function(){mpRefresh();},10000);
  }).catch(function(e){if(step==='mp'){$('sheet').querySelector('[role=status]').textContent=e.message||'Todavía no pudimos verificar el pago. Podés reintentar en unos segundos.';}}).finally(function(){mpBusy=false;});
}
function mpReturn(){
  if(!sb()||!q.get('mp_checkout'))return;
  try{var p=JSON.parse(sessionStorage.getItem(mpSessionKey())||'null');if(p&&p.id===q.get('mp_checkout')&&Date.now()-p.createdAt<86400000){mpPending=p;cart=p.cart||{};render();}}catch(e){}
  mpPaymentId=q.get('payment_id')||q.get('collection_id');step='mp';sheet();showSheet();mpRefresh(mpPaymentId);
}
document.addEventListener('click',function(e){if(e.target.closest('[data-mp-refresh]'))mpRefresh();if(e.target.closest('[data-mp-retry]')&&mpResult&&mpResult.checkoutUrl)mpGo(mpResult.checkoutUrl);});

// ── pantalla ──
var activeCat='all',catalogQuery='',disclosures={};
function catalogText(value){return String(value||'').normalize('NFD').replace(/[\u0300-\u036f]/g,'').toLocaleLowerCase().trim();}
function renderCatalog(){
  var query=catalogText(catalogQuery),words=query.split(/\s+/).filter(Boolean);
  var list=MENU.products.filter(function(p){var text=catalogText([p.name,p.category,p.description].join(' '));return !p.retired&&(activeCat==='all'||p.category===activeCat)&&words.every(function(word){return text.includes(word)});});
  $('grid').innerHTML=list.length?list.map(card).join(''):'<div class="empty">'+(catalogQuery?'No encontramos productos con esa búsqueda. Probá otro nombre o categoría.':'Todavía no hay productos para mostrar.')+'</div>';
  $('catalog-results').textContent=list.length+(list.length===1?' producto':' productos')+(activeCat!=='all'?' · '+activeCat:'')+(catalogQuery?' · Resultados de tu búsqueda':'');
}
function benefitNotice(){
  var policy=paymentBenefitPolicy(MENU.payments&&MENU.payments.benefit),methods=payMethods().filter(function(k){return k==='efectivo'||k==='transferencia'});
  if(!policy.enabled||!policy.channels.online||!policy.percent||!methods.length)return '';
  var names=methods.map(function(k){return k==='efectivo'?'efectivo':'transferencia'}).join(' o ');
  return '<div class="catalog-benefit"><strong>'+policy.percent+' % de descuento en productos</strong>Con '+names+'. El envío se calcula aparte. No acumulable con otros descuentos.</div>';
}
function renderOrderSummary(){
  var host=$('order-summary'),old=host.querySelector('.side-scroll'),scroll=old?old.scrollTop:0,ls=lines();
  host.innerHTML='<div><h2>Tu pedido</h2><span class="side-count">'+count()+(count()===1?' producto':' productos')+'</span></div><div class="side-scroll">'+(ls.length?cartItemsHtml(ls,'side'):'<p class="side-empty">Tu pedido empieza acá. Agregá productos de la carta para continuar.</p>')+'</div><div><div class="row t"><span>Productos</span><span>'+fmt(subtotal())+'</span></div><p class="cart-help">El envío y los descuentos se calculan en el siguiente paso.</p></div><button class="cta" id="side-next" data-start-checkout '+(!ls.length||unavailableItems()?'disabled':'')+'>Continuar con entrega y pago →</button>'+(unavailableItems()?'<p class="cart-help" role="status">Quitá los productos no disponibles para continuar.</p>':'');
  host.querySelector('.side-scroll').scrollTop=scroll;
}
function applyTheme(){var t=MENU.theme||{},r=document.documentElement;if(t.primary)r.style.setProperty('--primary',t.primary);if(t.accent)r.style.setProperty('--accent',t.accent);r.style.setProperty('--on-primary',contrastText(t.primary||'#235328'));r.style.setProperty('--on-accent',contrastText(t.accent||'#F28C00'));}
function render(){
  if(MENU)availabilityFingerprint=MENU.products.map(function(p){return p.id+':'+salesPaused(p)}).join('|');
  var c=MENU.config||{},seo=buildSeo(MENU);document.title=(ORDER_PAGE?'Pedir online | ':'')+seo.title;
  var fallback=$('search-content');if(fallback)fallback.hidden=true;
  var description=document.querySelector('meta[name="description"]');if(description)description.content=seo.description;
  var schema=$('restaurant-schema');if(schema)schema.textContent=JSON.stringify(seo.schema);
  $('h-title').textContent=c.title||MENU.store.name||'Menú';if((BRAND||(MENU.site&&MENU.site.logo))&&!$('h-mark')){var hm=document.createElement('div');hm.id='h-mark';hm.innerHTML=brandMark(MENU.store.name||'Menú');$('h-title').parentNode.insertBefore(hm,$('h-title'));}$('h-sub').textContent=c.subtitle||'';
  $('foot').textContent=[MENU.store.name,MENU.store.address].filter(Boolean).join(' · ');
  $('catalog-benefit').innerHTML=c.enabled===false?'':benefitNotice();
  if(c.enabled===false){$('grid').innerHTML='';$('cats').innerHTML='';$('catalog-results').textContent='';$('order-summary').innerHTML='';$('msg').innerHTML='<div class="empty"><b>Menú no disponible por ahora</b><br>Volvé a intentar más tarde.</div>';return;}
  $('msg').innerHTML=MENU.delivery?.enabled===false?'<div class="note" role="status"><strong>Delivery pausado por el local</strong><br>Podés pedir para retirar en el local.</div>':'';
  var cats=catList();
  $('cats').innerHTML=['all'].concat(cats).map(function(k){return '<button class="cat '+(k===activeCat?'on':'')+'" data-cat="'+esc(k)+'" aria-pressed="'+(k===activeCat)+'">'+(k==='all'?'Todo':esc(k))+'</button>'}).join('');
  site();
  renderCatalog();renderOrderSummary();
  bar();
}
function catList(){var c=MENU.config||{};return c.categories&&c.categories.length?c.categories:Array.from(new Set(MENU.products.map(function(p){return p.category}).filter(Boolean)));}
function separateStore(){return !!(MENU.site&&MENU.site.enabled&&MENU.site.orderPage&&!ORDER_PAGE&&!PREVIEW);}
function orderHref(category){return PREVIEW?'#pedido'+(category?'/'+encodeURIComponent(category):''):storefrontHref(MENU,document.baseURI,location.search,category);}
function waIcon(){return "<svg class=\"wa-icon\" width=\"22\" height=\"22\" fill=\"currentColor\" aria-hidden=\"true\" focusable=\"false\" xmlns=\"http://www.w3.org/2000/svg\" viewBox=\"0 0 448 512\"><!--! Font Awesome Free 6.7.2 by @fontawesome - https://fontawesome.com License - https://fontawesome.com/license/free (Icons: CC BY 4.0, Fonts: SIL OFL 1.1, Code: MIT License) Copyright 2024 Fonticons, Inc. --><path d=\"M380.9 97.1C339 55.1 283.2 32 223.9 32c-122.4 0-222 99.6-222 222 0 39.1 10.2 77.3 29.6 111L0 480l117.7-30.9c32.4 17.7 68.9 27 106.1 27h.1c122.3 0 224.1-99.6 224.1-222 0-59.3-25.2-115-67.1-157zm-157 341.6c-33.2 0-65.7-8.9-94-25.7l-6.7-4-69.8 18.3L72 359.2l-4.4-7c-18.5-29.4-28.2-63.3-28.2-98.2 0-101.7 82.8-184.5 184.6-184.5 49.3 0 95.6 19.2 130.4 54.1 34.8 34.9 56.2 81.2 56.1 130.5 0 101.8-84.9 184.6-186.6 184.6zm101.2-138.2c-5.5-2.8-32.8-16.2-37.9-18-5.1-1.9-8.8-2.8-12.5 2.8-3.7 5.6-14.3 18-17.6 21.8-3.2 3.7-6.5 4.2-12 1.4-32.6-16.3-54-29.1-75.5-66-5.7-9.8 5.7-9.1 16.3-30.3 1.8-3.7.9-6.9-.5-9.7-1.4-2.8-12.5-30.1-17.1-41.2-4.5-10.8-9.1-9.3-12.5-9.5-3.2-.2-6.9-.2-10.6-.2-3.7 0-9.7 1.4-14.8 6.9-5.1 5.6-19.4 19-19.4 46.3 0 27.3 19.9 53.7 22.6 57.4 2.8 3.7 39.1 59.7 94.8 83.8 35.2 15.2 49 16.5 66.6 13.9 10.7-1.6 32.8-13.4 37.4-26.4 4.6-13 4.6-24.1 3.2-26.4-1.3-2.5-5-3.9-10.5-6.6z\"/></svg>";}
function waHref(msg){var n=String((MENU.store&&MENU.store.whatsapp)||'').replace(/\D/g,'');return n?'https://wa.me/'+n+(msg?'?text='+encodeURIComponent(msg):''):'';}
function paras(t){return String(t||'').split(/\n{2,}/).map(function(x){return x.trim()}).filter(Boolean).map(function(x){return '<p>'+esc(x).replace(/\n/g,'<br>')+'</p>'}).join('');}
var NAVLBL={como:'Cómo funciona',historia:'Nosotros',resenas:'Reseñas',catering:'Catering',faq:'Preguntas',contacto:'Contacto'};

var navResizeObserver=null,footerVisibilityObserver=null;
function site(){
  if(footerVisibilityObserver){footerVisibilityObserver.disconnect();footerVisibilityObserver=null;}
  document.body.classList.remove('footer-in-view');
  if(navResizeObserver){navResizeObserver.disconnect();navResizeObserver=null;}
  var S=MENU.site,c=MENU.config||{},on=!!(S&&S.enabled&&c.enabled!==false),top=$('s-top'),rest=$('s-rest');
  document.body.classList.toggle('has-site',on);
  if(ORDER_PAGE){$('oback').querySelector('a').href=new URL('./',document.baseURI).href;}
  if(!on){document.body.classList.remove('has-order-footer');$('s-nav').innerHTML='';top.innerHTML='';rest.innerHTML='';var fab0=$('fab');if(fab0)fab0.remove();return;}
  var name=MENU.store.name||c.title||'Menú',wa=waHref(),order=S.order||['hero','favoritos','menu'],before='',after='',seen=false,links=[['#pedido','Menú']],hasContact=false,orderView=ORDER_PAGE||document.body.classList.contains('view-order'),orderFooter='';
  order.forEach(function(id){
    if(id==='menu'){seen=true;before+=MOD.menu(S);return;}
    var html=MOD[id]?MOD[id](S,S):'';if(!html)return;
    if(NAVLBL[id])links.push(['#'+({como:'s-how',historia:'s-about',resenas:'s-reviews',catering:'s-catering',faq:'s-faq',contacto:'s-contact'})[id],NAVLBL[id]]);
    if(id==='contacto'){hasContact=true;if(orderView){orderFooter=html;return;}}
    if(seen)after+=html;else before+=html;
  });
  links.sort(function(a,b){return order.indexOf(idOf(a[0]))-order.indexOf(idOf(b[0]));});
  var home=new URL('./',document.baseURI).href;
  var navLinks=(ORDER_PAGE?'<a href="'+esc(home)+'">Inicio</a>':'')+links.map(function(l){var menu=l[0]==='#pedido',href=menu?orderHref():(ORDER_PAGE?home+l[0]:l[0]);return '<a href="'+esc(href)+'"'+(ORDER_PAGE&&menu?' aria-current="page"':'')+'>'+l[1]+'</a>'}).join('');
  var waLink=wa?'<a class="wa" href="'+esc(wa)+'" target="_blank" rel="noopener">' +waIcon()+'WhatsApp</a>':'';
  $('s-nav').innerHTML='<nav class="snav" id="snav" aria-label="Secciones"><a class="nav-brand" href="'+esc(ORDER_PAGE?home:'#')+'" aria-label="'+esc(name)+' · Inicio">'+(brandMark(name)||'<b>'+esc(name)+'</b>')+'</a><div class="snav-links">'+navLinks+'</div><details class="snav-menu"><summary aria-label="Desplegar secciones del sitio">Secciones</summary><div>'+navLinks+(wa?'<a href="'+esc(wa)+'" target="_blank" rel="noopener">' +waIcon()+'WhatsApp</a>':'')+'</div></details>'+waLink+(separateStore()?'<a class="pedido" href="'+esc(orderHref())+'">Pedir online →</a>':'<button class="pedido" onclick="openCart()">Mi pedido ('+count()+')</button>')+'</nav>';

  document.body.classList.toggle('has-order-footer',orderView&&hasContact);
  top.innerHTML=ORDER_PAGE?'':before;rest.innerHTML=orderView?orderFooter:after;$('foot').textContent=hasContact?'':[MENU.store.name,MENU.store.address].filter(Boolean).join(' · ');
  var f=$('fab');if(wa&&!f){f=document.createElement('a');f.id='fab';f.className='fab';f.target='_blank';f.rel='noopener';f.setAttribute('aria-label','Escribinos por WhatsApp');f.innerHTML=waIcon();document.body.appendChild(f);}if(f)f.href=wa;
  var contact=$('s-contact');if(f&&contact&&window.IntersectionObserver){var observer=new IntersectionObserver(function(entries){if(footerVisibilityObserver===observer)document.body.classList.toggle('footer-in-view',entries.some(function(entry){return entry.isIntersecting;}));});footerVisibilityObserver=observer;observer.observe(contact);}
  var nv=$('snav');if(nv){var setH=function(){document.documentElement.style.setProperty('--navh',nv.offsetHeight+'px');};setH();if(window.ResizeObserver){navResizeObserver=new ResizeObserver(setH);navResizeObserver.observe(nv);}}
}

function card(p){
  var paused=salesPaused(p), n=cart[p.id]||0, showP=MENU.config.showPrices!==false;
  var img=p.image&&MENU.config.showImages!==false?'<img loading="lazy" decoding="async" width="600" height="400" src="'+esc(p.image)+'" alt="'+esc(p.name)+'" onerror="this.parentNode.textContent=this.getAttribute(\'data-i\')" data-i="'+esc((p.name||'?').charAt(0).toUpperCase())+'">':esc((p.name||'?').charAt(0).toUpperCase());
  return '<article aria-label="'+esc(p.name)+'" class="card '+(paused?'sales-paused':'')+'"><div class="ph">'+img+'</div><div class="body">'+(p.category?'<div class="cat-l">'+esc(p.category)+'</div>':'')+'<div class="name">'+esc(p.name)+'</div>'+(p.description?'<div class="desc">'+esc(p.description)+'</div>':'')+(showP?'<div class="price">'+fmt(p.price)+'</div>':'')+
   (paused?'<span class="sales-state">No disponible</span><button class="add" disabled>No disponible</button>':separateStore()?'<a class="add" href="'+esc(orderHref(p.category))+'">Ver en la tienda →</a>':n?'<div class="qty"><button data-dec="'+esc(p.id)+'" aria-label="Quitar una unidad de '+esc(p.name)+'">−</button><b>'+n+'</b><button data-inc="'+esc(p.id)+'" aria-label="Agregar una unidad de '+esc(p.name)+'">+</button></div>':'<button class="add" data-inc="'+esc(p.id)+'" aria-label="Agregar '+esc(p.name)+'">Agregar</button>')+'</div></article>';
}
function lines(){return MENU.products.filter(function(p){return cart[p.id]}).map(function(p){return {id:p.id,name:p.name,qty:cart[p.id],unitPrice:p.price,lineTotal:p.price*cart[p.id],priceRevision:p.priceRevision||null,unavailable:!!p.retired||salesPaused(p)}});}
function subtotal(){return lines().reduce(function(s,l){return s+l.lineTotal},0);}
function count(){return lines().reduce(function(s,l){return s+l.qty},0);}
// Solo cantidades por producto: conserva el pedido al visitar otras secciones del sitio.
function cartKey(){return 'sahten-cart:'+new URL('./',document.baseURI).pathname+':'+((sb()&&sb().storeId)||MENU.store.name||'menu');}
function saveCart(){if(PREVIEW)return;try{sessionStorage.setItem(cartKey(),JSON.stringify({at:Date.now(),items:cart}));}catch(e){/* almacenamiento no disponible */}}
function restoreCart(){if(PREVIEW)return;try{var saved=JSON.parse(sessionStorage.getItem(cartKey())||'null');if(!saved||Date.now()-saved.at>86400000||!Number.isFinite(saved.at))return;var next=Object.create(null);Object.keys(saved.items||{}).slice(0,500).forEach(function(id){var n=saved.items[id];if(id.length<=200&&Number.isInteger(n)&&n>0&&n<=999)next[id]=n;});cart=next;}catch(e){/* carrito vacío */}}

function bar(){saveCart();var n=count();document.body.classList.toggle('has-cart',n>0);$('bar').classList.toggle('on',n>0);$('bar-n').textContent=n+(n===1?' producto':' productos');$('bar-t').textContent=fmt(subtotal());}
function unavailableItems(){return Object.keys(cart).some(function(id){var p=MENU.products.find(function(p){return p.id===id});return cart[id]>0&&(!p||p.retired||salesPaused(p));});}
function change(id,d){if(sending)return;var p=MENU.products.find(function(p){return p.id===id});if(d>0&&(!p||p.retired||salesPaused(p)))return;var focused=document.activeElement,focusId=focused&&focused.id;cart[id]=Math.min(999,Math.max(0,(cart[id]||0)+d));if(!cart[id])delete cart[id];recalcDelivery();render();if($('ov').classList.contains('on'))sheet();else if(focusId){var next=$(focusId)||$('side-next');if(next)next.focus({preventScroll:true});}}

var sheetReturnFocus=null, sheetBackground=[];
function showSheet(){
  if(!$('ov').classList.contains('on')){
    sheetReturnFocus=document.activeElement;
    sheetBackground=Array.from(document.body.children).filter(function(el){return el.id!=='ov'&&el.tagName!=='SCRIPT'}).map(function(el){return [el,el.inert]});
    sheetBackground.forEach(function(x){x[0].inert=true});
  }
  document.querySelectorAll('.snav-menu[open]').forEach(function(el){el.removeAttribute('open')});
  $('ov').classList.add('on');document.body.classList.add('modal-open');$('sheet').focus({preventScroll:true});
}
function openCart(){step='cart';sheet();showSheet();}
function checkoutStep(next){if(sending||!['cart','details'].includes(next)||!lines().length)return;step=next;sheet();$('sheet').querySelector('.sheet-body').scrollTop=0;$('sheet').focus({preventScroll:true});}
function checkoutSteps(){return '<ol class="checkout-steps" aria-label="Pasos del pedido"><li'+(step==='cart'?' aria-current="step"':'')+'><b aria-hidden="true">1</b>Pedido</li><li'+(step==='details'?' aria-current="step"':'')+'><b aria-hidden="true">2</b>Entrega y pago</li></ol>';}
function cartItemsHtml(ls,prefix){prefix=prefix||'cart';return '<ul class="'+(prefix==='side'?'side-items':'cart-items')+'" aria-label="Productos de tu pedido">'+ls.map(function(l){return '<li class="cart-item"><div><div class="cart-item-name">'+esc(l.name)+(l.unavailable?' · No disponible':'')+'</div><div class="cart-item-unit">'+fmt(l.unitPrice)+' por unidad</div></div><div class="cart-item-price">'+fmt(l.lineTotal)+'</div><div class="cart-item-actions"><div class="cart-quantity"><button type="button" id="'+prefix+'-dec-'+esc(l.id)+'" data-dec="'+esc(l.id)+'" aria-label="Restar una unidad de '+esc(l.name)+'"'+(l.qty<=1?' disabled':'')+'>−</button><output aria-label="Cantidad de '+esc(l.name)+'" aria-live="polite">'+l.qty+'</output><button type="button" id="'+prefix+'-inc-'+esc(l.id)+'" data-inc="'+esc(l.id)+'" aria-label="Sumar una unidad de '+esc(l.name)+'"'+(l.qty>=999||l.unavailable?' disabled':'')+'>+</button></div><button type="button" class="cart-remove" id="'+prefix+'-remove-'+esc(l.id)+'" data-remove="'+esc(l.id)+'" aria-label="Quitar '+esc(l.name)+' del pedido">Quitar</button></div></li>';}).join('')+'</ul>';}
function closeSheet(){
  $('ov').classList.remove('on');document.body.classList.remove('modal-open');
  sheetBackground.forEach(function(x){x[0].inert=!!x[1]});sheetBackground=[];
  var back=sheetReturnFocus&&sheetReturnFocus.isConnected?sheetReturnFocus:document.querySelector('.bar.on button,.snav .pedido');
  if(back)back.focus({preventScroll:true});
}
function setSheetContent(body,footer){
  var s=$('sheet'),active=document.activeElement,id=active&&active.id,old=s.querySelector('.sheet-body'),scroll=old?old.scrollTop:0;
  s.dataset.step=step;
  s.innerHTML='<div class="sheet-head"><h2 id="sheet-title">'+(step==='cart'?'Revisá tu pedido':step==='details'?'Entrega y pago':'Tu pedido')+'</h2><button class="sheet-close" data-close aria-label="Cerrar pedido">×</button></div><div class="sheet-body">'+body+'</div><div class="sheet-footer">'+(footer||'')+'</div>';
  s.querySelector('.sheet-body').scrollTop=scroll;
  if(s.contains(active)||active===s||$('ov').classList.contains('on')){var next=id&&$(id);(next||s).focus({preventScroll:true});}
}
function selectedServiceStatus(){return serviceHoursStatus(MENU,type,Date.now()+deliveryServerOffset);}
function serviceChoiceLabel(source){var h=serviceHoursStatus(MENU,source,Date.now()+deliveryServerOffset);return source==='delivery'&&MENU.delivery?.enabled===false?'Pausado por el local':h.open?(source==='pickup'?'Retiro disponible':'Dentro del horario'):'Fuera de horario';}
function pickupNote(){var h=serviceHoursStatus(MENU,'pickup',Date.now()+deliveryServerOffset);return '<div class="note '+(h.open?'ok':'err')+'" id="pickup-hours" role="status">'+(h.open?'Retiro: '+esc(MENU.store.address||'en el local'):esc(serviceHoursMessage(h)))+'</div>';}
function refreshServiceNotice(){document.querySelectorAll('[data-service-label]').forEach(function(el){el.textContent=serviceChoiceLabel(el.dataset.serviceLabel)});var pickup=$('pickup-hours');if(pickup)pickup.outerHTML=pickupNote();var card=$('delivery-card');if(card)card.innerHTML=shipNote();}
function sendStatus(){
  if(unavailableItems())return 'Hay productos no disponibles en tu pedido. Volvé al pedido y quitalos para continuar.';
  if(!selectedServiceStatus().open)return serviceHoursMessage(selectedServiceStatus());
  if(sending)return pay==='mercadopago'?'Preparando el pago…':'Enviando pedido…';
  if(!payMethods().length)return 'La tienda todavía no habilitó un medio de pago.';
  if(!form.name.trim())return 'Completá tu nombre para enviar el pedido.';
  if(!form.phone.trim())return 'Completá tu teléfono para enviar el pedido.';
  if(!cashChangeQuote(total(),form.cashTendered,pay).valid)return 'Revisá con cuánto vas a pagar: debe alcanzar el total final.';
  if(type==='delivery'&&MENU.delivery?.enabled===false)return 'El delivery está pausado por el local. Podés elegir retiro.';
  if(type==='delivery'&&ship&&ship.status==='closed')return 'El delivery está fuera de horario. Podés seguir viendo el menú o elegir retiro.';
  if(type==='delivery'&&deliveryLoading)return 'Esperá la validación del recorrido.';
  if(type==='delivery'&&!(geo&&ship&&ship.ok&&!deliveryLoading))return 'Elegí una dirección dentro de la zona de entrega o seleccioná retiro.';

var availabilityRefreshing=false,availabilityFingerprint='';
function refreshSalesAvailability(){
 if(!MENU||!sb()||sending||document.visibilityState==='hidden'||availabilityRefreshing)return;
 availabilityRefreshing=true;var cfg=sb();
 fetchLimited(cfg.url+'/rest/v1/menus?select=json&store_id=eq.'+encodeURIComponent(cfg.storeId),{headers:sbHeaders()}).then(function(r){if(!r.ok)throw new Error('availability');return r.json();}).then(function(rows){
  var live=rows&&rows[0]&&rows[0].json;if(!live||!Array.isArray(live.products))return;
  var deliveryBefore=JSON.stringify([MENU.store.openingHours,MENU.delivery,MENU.store.address,MENU.store.lat,MENU.store.lng]),rulesBefore=MENU.delivery?.configurationRevision;
  if(live.delivery?.configurationRevision){MENU.delivery=JSON.parse(JSON.stringify(live.delivery));['address','lat','lng'].forEach(function(key){if(live.store&&Object.prototype.hasOwnProperty.call(live.store,key))MENU.store[key]=live.store[key];});}
  MENU.delivery=Object.assign({},MENU.delivery,{enabled:live.delivery?.enabled!==false});
  // Calendarios en vivo: independientes de la revisión de tarifas y del precio del carrito.
  if(live.store&&Object.prototype.hasOwnProperty.call(live.store,'openingHours'))MENU.store.openingHours=live.store.openingHours;
  var liveHours=live.delivery?.hours??live.delivery?.deliveryV2?.hours;if(liveHours)MENU.delivery.hours=liveHours;
  // Compatibilidad con servidores previos: actualizan solo los estados por ID de la misma revisión.
  var policy=MENU.delivery.deliveryV2,livePolicy=live.delivery?.deliveryV2;
  if(policy&&livePolicy&&policy.revision===livePolicy.revision){policy.zones=policy.zones.map(function(z){var remote=livePolicy.zones.find(function(r){return r.id===z.id});return remote?Object.assign({},z,{enabled:remote.enabled!==false,requiresAuthorization:remote.requiresAuthorization===true}):z;});}
  var deliveryChanged=deliveryBefore!==JSON.stringify([MENU.store.openingHours,MENU.delivery,MENU.store.address,MENU.store.lat,MENU.store.lng]),rulesChanged=!!MENU.delivery.configurationRevision&&rulesBefore!==MENU.delivery.configurationRevision;
  if(rulesChanged){deliveryGeneration++;deliveryRoute=null;deliveryAuthorization=null;deliveryQuoteId=null;deliveryLoading=false;deliveryError='';deliveryUpdateNotice='Condiciones de envío actualizadas. Revisá el importe antes de confirmar.';}
  var before=JSON.stringify(MENU.products.map(function(p){return [p.id,p.salesAvailability,p.retired]})),old=new Map(MENU.products.map(function(p){return [p.id,p]}));
  var next=live.products.map(function(p){var existing=old.get(p.id);return existing?Object.assign({},existing,{salesAvailability:p.salesAvailability||null,retired:false}):p;});
  MENU.products.forEach(function(p){if(cart[p.id]&&!next.some(function(n){return n.id===p.id}))next.push(Object.assign({},p,{retired:true,salesAvailability:{paused:true,resumeAt:null}}));});
  MENU.products=next;MENU.config.categories=live.config?.categories||MENU.config.categories;
  if(deliveryChanged||before!==JSON.stringify(next.map(function(p){return [p.id,p.salesAvailability,p.retired]}))){var focused=document.activeElement,focusId=focused?.id,start=focused?.selectionStart,end=focused?.selectionEnd;recalcDelivery();render();if($('ov').classList.contains('on'))sheet();var input=focusId&&$(focusId);if(input){input.focus({preventScroll:true});if(typeof start==='number'&&input.setSelectionRange)try{input.setSelectionRange(start,end);}catch{}}}
  if(rulesChanged&&type==='delivery'&&geo&&modernDelivery()&&$('ov').classList.contains('on'))refreshDeliveryRoute(true);
 }).catch(function(){/* conserva el catálogo al perder conexión; el servidor valida al confirmar */}).finally(function(){availabilityRefreshing=false;});
}
