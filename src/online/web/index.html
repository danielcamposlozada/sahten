<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>Menú</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700;800&family=DM+Serif+Display&display=swap" rel="stylesheet">
<style>
:root{--primary:#235328;--accent:#F28C00;--ink:#1e2c1f;--muted:#6f7f71;--bg:#faf8f5;--card:#fff;--border:#e2ddd5;--red:#c0392b;--r:14px}
*{box-sizing:border-box}body{margin:0;font-family:'DM Sans',system-ui,sans-serif;background:var(--bg);color:var(--ink);-webkit-text-size-adjust:100%}
button,input,select,textarea{font:inherit;color:inherit}
header{background:var(--primary);color:#fff;padding:28px 16px 22px;text-align:center}
header h1{margin:0 0 4px;font-size:26px;letter-spacing:-.02em}header p{margin:0;opacity:.85;font-size:14px}
.cats{position:sticky;top:0;z-index:5;background:var(--bg);display:flex;gap:8px;overflow-x:auto;padding:10px 16px;border-bottom:1px solid var(--border)}
.cat{flex:none;border:1.5px solid var(--border);background:#fff;border-radius:99px;padding:7px 14px;font-size:13px;font-weight:600;cursor:pointer}
.cat.on{background:var(--primary);border-color:var(--primary);color:#fff}
main{max-width:980px;margin:0 auto;padding:16px 16px 110px}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(230px,1fr));gap:14px}
.card{background:var(--card);border:1px solid var(--border);border-radius:var(--r);overflow:hidden;display:flex;flex-direction:column}
.ph{aspect-ratio:4/3;background:#ede8df;display:flex;align-items:center;justify-content:center;font-size:38px;font-weight:800;color:#b9b2a5}.ph img{width:100%;height:100%;object-fit:cover;display:block}
.body{padding:12px 14px 14px;display:flex;flex-direction:column;gap:6px;flex:1}.cat-l{font-size:11px;font-weight:700;letter-spacing:.5px;text-transform:uppercase;color:var(--accent)}
.name{font-weight:700;font-size:15px}.price{font-weight:800;font-size:16px;color:var(--primary);margin-top:auto}
.add{border:0;background:var(--accent);color:#fff;border-radius:10px;padding:9px 12px;font-weight:700;cursor:pointer}
.qty{display:flex;align-items:center;justify-content:space-between;gap:8px}.qty button{width:34px;height:34px;border-radius:10px;border:1.5px solid var(--border);background:#fff;font-size:18px;cursor:pointer}
.bar{position:fixed;left:0;right:0;bottom:0;background:#fff;border-top:1px solid var(--border);padding:10px 16px calc(10px + env(safe-area-inset-bottom));display:none;z-index:8}
.bar.on{display:block}.bar button{width:100%;max-width:980px;margin:0 auto;display:flex;justify-content:space-between;border:0;background:var(--primary);color:#fff;border-radius:12px;padding:14px 18px;font-weight:700;font-size:15px;cursor:pointer}
.ov{position:fixed;inset:0;background:rgba(15,25,17,.55);z-index:20;display:none;align-items:flex-end;justify-content:center}.ov.on{display:flex}
.sheet{background:#fff;width:100%;max-width:560px;max-height:94vh;overflow:auto;border-radius:18px 18px 0 0;padding:18px 18px 24px}
@media(min-width:700px){.ov{align-items:center}.sheet{border-radius:18px}}
.sheet h2{margin:0 0 12px;font-size:19px}.row{display:flex;justify-content:space-between;gap:10px;padding:7px 0;font-size:14px}.row.t{font-weight:800;font-size:17px;border-top:2px solid var(--primary);margin-top:6px;padding-top:10px}
.seg{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin:12px 0}.seg button{padding:10px;border-radius:10px;border:1.5px solid var(--border);background:#fff;font-weight:700;cursor:pointer}.seg button.on{border-color:var(--primary);background:rgba(35,83,40,.08);color:var(--primary)}
label{display:block;font-size:12px;font-weight:700;color:var(--muted);margin:10px 0 4px}input,select,textarea{width:100%;border:1.5px solid var(--border);border-radius:10px;padding:10px 12px;background:#fff}
.sug{border:1px solid var(--border);border-radius:10px;margin-top:4px;overflow:hidden}.sug div{padding:9px 12px;font-size:13px;cursor:pointer;border-bottom:1px solid var(--border)}.sug div:last-child{border:0}.sug div:hover{background:#f5f1ea}
.note{font-size:13px;padding:10px 12px;border-radius:10px;background:#f5f1ea;margin-top:10px}.note.err{background:#fdecea;color:var(--red)}.note.ok{background:#e8f4ea;color:var(--primary)}
.cta{width:100%;margin-top:14px;border:0;border-radius:12px;padding:14px;font-weight:800;font-size:15px;background:var(--primary);color:#fff;cursor:pointer}.cta.wa{background:#25D366}.cta.ghost{background:#fff;color:var(--ink);border:1.5px solid var(--border)}.cta[disabled]{opacity:.5;cursor:not-allowed}
.empty{text-align:center;color:var(--muted);padding:60px 16px}
footer{text-align:center;color:var(--muted);font-size:12px;padding:18px}
.desc{font-size:12.5px;color:var(--muted);line-height:1.4}
/* sitio (portada + secciones): solo si el dueño lo activa */
:root{--serif:'DM Serif Display',Georgia,serif}
html{scroll-behavior:smooth}@media(prefers-reduced-motion:reduce){html{scroll-behavior:auto}*{animation:none!important;transition:none!important}}
:focus-visible{outline:3px solid var(--accent);outline-offset:2px}
.has-site header{display:none}.has-site{--navh:58px}
.has-site [id]{scroll-margin-top:calc(var(--navh) + 64px)}
.snav{position:sticky;top:0;z-index:7;background:color-mix(in srgb,var(--primary) 94%,transparent);backdrop-filter:blur(10px);color:#fff;display:flex;align-items:center;gap:4px;padding:10px 18px;overflow-x:auto;white-space:nowrap;box-shadow:0 1px 0 rgba(255,255,255,.08)}
.snav b{font-family:var(--serif);font-weight:400;font-size:21px;margin-right:auto;letter-spacing:.2px}
.snav a{color:#fff;text-decoration:none;font-size:13.5px;font-weight:600;opacity:.88;padding:7px 11px;border-radius:99px;transition:background .15s}.snav a:hover{background:rgba(255,255,255,.14);opacity:1}
.snav .pedido{background:var(--accent);font-weight:800;border:0;color:#fff;border-radius:99px;padding:8px 16px;cursor:pointer;font-size:13.5px;margin-left:6px}
.has-site .cats{top:var(--navh)}
.eyebrow{display:block;font-size:12px;font-weight:800;letter-spacing:.14em;text-transform:uppercase;color:var(--accent);margin-bottom:8px}
.sec{max-width:1040px;margin:0 auto;padding:64px 18px}.sec>h2,.in>h2,.hd h2{font-family:var(--serif);font-weight:400;margin:0 0 10px;font-size:clamp(28px,5vw,42px);line-height:1.1;letter-spacing:-.01em}
.sec .lead,.in>.lead{color:var(--muted);margin:0 0 26px;font-size:16px;line-height:1.55;max-width:640px}
.sec.alt{max-width:none;background:#fff;border-block:1px solid var(--border)}.sec.alt>.in{max-width:1040px;margin:0 auto}
.sec.dark{max-width:none;background:linear-gradient(135deg,#14301a,var(--primary));color:#fff}.sec.dark>.in{max-width:1040px;margin:0 auto}.sec.dark .lead{color:rgba(255,255,255,.8)}
.hero{position:relative;overflow:hidden;background:radial-gradient(1200px 500px at 85% -10%,rgba(255,255,255,.12),transparent 60%),linear-gradient(135deg,var(--primary),#14301a);color:#fff;padding:92px 18px 70px;text-align:center}
.hero.img{background-size:cover;background-position:center}.hero.img::before{content:'';position:absolute;inset:0;background:linear-gradient(180deg,rgba(10,20,12,.55),rgba(10,20,12,.78))}
.hero>*{position:relative}.hero .tag{display:inline-block;font-size:12px;font-weight:800;letter-spacing:.16em;text-transform:uppercase;border:1px solid rgba(255,255,255,.35);border-radius:99px;padding:6px 14px;margin-bottom:20px;opacity:.9}
.hero h1{font-family:var(--serif);font-weight:400;margin:0 auto 16px;max-width:820px;font-size:clamp(38px,8vw,72px);line-height:1.02;letter-spacing:-.02em}.hero p{margin:0 auto 30px;max-width:620px;font-size:clamp(16px,2.4vw,19px);opacity:.92;line-height:1.55}
.hero .btns{display:flex;gap:10px;justify-content:center;flex-wrap:wrap}.btn1,.btn2{display:inline-block;text-decoration:none;font-weight:800;border-radius:99px;padding:14px 28px;font-size:15px;transition:transform .15s}
.btn1{background:var(--accent);color:#fff;box-shadow:0 8px 24px rgba(0,0,0,.25)}.btn2{border:1.5px solid rgba(255,255,255,.55);color:#fff}.btn1:hover,.btn2:hover{transform:translateY(-2px)}
.hl{display:grid;grid-template-columns:repeat(auto-fit,minmax(190px,1fr));gap:12px;max-width:960px;margin:48px auto 0;text-align:left}
.hl div{background:rgba(255,255,255,.1);border:1px solid rgba(255,255,255,.14);backdrop-filter:blur(6px);border-radius:16px;padding:16px}.hl i{font-style:normal;font-size:26px;display:block;margin-bottom:8px}.hl b{display:block;font-size:15px}.hl span{font-size:13px;opacity:.85;line-height:1.4;display:block;margin-top:2px}
.fav .grid{grid-template-columns:repeat(auto-fill,minmax(250px,1fr))}.more{display:inline-block;margin-top:20px;font-weight:800;color:var(--primary);text-decoration:none;border-bottom:2px solid var(--accent)}
.card{transition:transform .18s,box-shadow .18s;border-radius:16px}.card:hover{transform:translateY(-3px);box-shadow:0 14px 30px rgba(20,48,26,.12)}.add{border-radius:99px!important}.desc{font-size:12.5px;color:var(--muted);line-height:1.45}
.steps{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:16px;counter-reset:s}.step{background:var(--bg);border:1px solid var(--border);border-radius:18px;padding:22px}.step em{font-style:normal;display:inline-grid;place-items:center;width:36px;height:36px;border-radius:50%;background:var(--accent);color:#fff;font-weight:800;margin-bottom:12px}.step b{display:block;font-size:17px;margin-bottom:4px}
.two{display:grid;grid-template-columns:1.2fr 1fr;gap:34px;align-items:center}@media(max-width:760px){.two{grid-template-columns:1fr}}
.about p{line-height:1.7;font-size:16px;margin:0 0 14px}.pic{aspect-ratio:4/5;border-radius:22px;background:#ede8df center/cover;box-shadow:0 20px 50px rgba(20,48,26,.18)}
.badge{background:var(--primary);color:#fff;border-radius:20px;padding:26px;margin-top:20px}.badge small{opacity:.75;font-size:12px;letter-spacing:.1em;text-transform:uppercase;font-weight:700}.badge .w{font-family:var(--serif);font-size:44px;line-height:1.1;margin:6px 0}.badge .m{font-style:italic;opacity:.9}.badge .q{margin-top:10px;opacity:.85;font-size:14px;line-height:1.5}
.band{background:var(--accent);color:#fff;overflow:hidden;white-space:nowrap;padding:14px 0;font-weight:800;letter-spacing:.14em;text-transform:uppercase;font-size:14px}.band div{display:inline-block;animation:mq 28s linear infinite;padding-left:100%}@keyframes mq{to{transform:translateX(-100%)}}
.revs{display:grid;grid-template-columns:repeat(auto-fit,minmax(260px,1fr));gap:16px}.rev{background:var(--bg);border:1px solid var(--border);border-radius:18px;padding:22px;font-size:15px;line-height:1.55}.rev .st{color:var(--accent);letter-spacing:3px;font-size:14px;margin-bottom:6px}.rev small{display:block;color:var(--muted);margin-top:12px;font-weight:600}
.info{display:grid;grid-template-columns:repeat(auto-fit,minmax(260px,1fr));gap:16px}.info>div{background:#fff;border:1px solid var(--border);border-radius:18px;padding:22px;font-size:15px;line-height:1.6}.info h3{margin:0 0 10px;font-size:18px;font-family:var(--serif);font-weight:400}
.cat-info{background:rgba(255,255,255,.1);border:1px solid rgba(255,255,255,.16);border-radius:18px;padding:20px;display:grid;gap:12px}.cat-info div{font-size:14.5px}.cat-info b{display:block;font-size:12px;letter-spacing:.1em;text-transform:uppercase;opacity:.7;margin-bottom:2px}
.faq details{background:#fff;border:1px solid var(--border);border-radius:14px;margin-bottom:10px;padding:0 18px}.faq summary{cursor:pointer;font-weight:700;padding:16px 0;list-style:none;font-size:16px}.faq summary::-webkit-details-marker{display:none}.faq summary::after{content:'+';float:right;color:var(--accent);font-size:24px;line-height:1}.faq details[open] summary::after{content:'−'}.faq p{margin:0 0 16px;color:var(--muted);line-height:1.6;font-size:15px}
.sfoot{background:#10261a;color:#dfe9e0;padding:48px 18px 36px}.sfoot .cols{max-width:1040px;margin:0 auto;display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:26px;font-size:14px;line-height:1.7}.sfoot b{display:block;font-family:var(--serif);font-weight:400;font-size:22px;color:#fff;margin-bottom:6px}.sfoot h4{margin:0 0 6px;font-size:12px;letter-spacing:.12em;text-transform:uppercase;opacity:.6}.sfoot a{color:#fff}.sfoot .by{text-align:center;opacity:.5;font-size:12px;margin-top:30px}
.fab{position:fixed;right:16px;bottom:16px;z-index:6;width:56px;height:56px;border-radius:50%;background:#25D366;color:#fff;display:grid;place-items:center;box-shadow:0 8px 24px rgba(0,0,0,.28);text-decoration:none;font-size:26px}.bar.on~.fab,.has-bar .fab{bottom:84px}
@media(max-width:620px){.snav a:not(.pedido):not(.wa){display:none}.hero{padding:64px 16px 48px}.sec{padding:46px 16px}}
</style>
</head>
<body>
<header><h1 id="h-title">Menú</h1><p id="h-sub"></p></header>
<div id="s-nav"></div>
<div id="s-top"></div>
<div id="menuwrap">
<nav class="cats" id="cats"></nav>
<main id="menu"><div id="msg"></div><div class="grid" id="grid"></div></main>
</div>
<div id="s-rest"></div>
<footer id="foot"></footer>
<div class="bar" id="bar"><button onclick="openCart()"><span id="bar-n">0 productos</span><span id="bar-t">$0</span></button></div>
<div class="ov" id="ov" onclick="if(event.target===this)closeSheet()"><div class="sheet" id="sheet"></div></div>

<script id="menu-fallback" type="application/json">/*__MENU_JSON__*/null</script>
<script>
/*__SHARED__*/
</script>
<script>
(function(){
'use strict';
var MENU=null, cart={}, type='delivery', geo=null, ship=null, pay='', form={name:'',phone:'',email:'',address:'',notes:''}, step='cart', sending=false, lastOrder=null, sugTimer=null, sugs=[];
var $=function(id){return document.getElementById(id)};
var esc=function(s){return String(s==null?'':s).replace(/[&<>"']/g,function(m){return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#039;'}[m]})};
var cur=function(){return (MENU&&MENU.store&&MENU.store.currency)||{symbol:'$',locale:'es-AR'}};
var fmt=function(n){return cur().symbol+Number(n||0).toLocaleString(cur().locale,{maximumFractionDigits:0})};
var q=new URLSearchParams(location.search);

// ── carga: menú en vivo (Supabase, si hay) y respaldo en menu.json ──
function sb(){return MENU&&MENU.supabase;}
function sbHeaders(extra){var s=sb();return Object.assign({apikey:s.anonKey,Authorization:'Bearer '+s.anonKey,'Content-Type':'application/json'},extra||{});}
function slugFromLocation(){
  var s=q.get('store'); if(s) return s;
  var h=location.hostname.split('.'); if(h.length>=3 && h[0]!=='www') return h[0];
  return '';
}
function load(){
  return fetch('menu.json',{cache:'no-cache'}).then(function(r){if(!r.ok)throw new Error('menu.json '+r.status);return r.json();})
   .catch(function(){var el=$('menu-fallback');var d=null;try{d=JSON.parse(el.textContent.replace(/^\/\*.*?\*\//,''));}catch(e){}if(!d)throw new Error('No pudimos cargar el menú.');return d;})
   .then(function(base){
     MENU=base; var s=sb(); if(!s) return;
     var slug=slugFromLocation()||s.slug;
     var url=s.url+'/rest/v1/stores?select=id,menus(json)&'+(slug?'slug=eq.'+encodeURIComponent(slug):'id=eq.'+encodeURIComponent(s.storeId));
     return fetch(url,{headers:sbHeaders()}).then(function(r){return r.ok?r.json():[];}).then(function(rows){
       var live=rows&&rows[0]&&rows[0].menus&&(Array.isArray(rows[0].menus)?rows[0].menus[0]:rows[0].menus);
       if(live&&live.json&&live.json.products){var keep=base.supabase;MENU=live.json;
       /* las fotos son archivos de la carpeta publicada: una foto nueva sin volver a publicar no existe todavía */
       var had={};base.products.forEach(function(b){if(b.image)had[b.id+'|'+b.image]=1;});
       MENU.products.forEach(function(p){if(p.image&&!had[p.id+'|'+p.image])p.image=null;});MENU.supabase=keep;if(rows[0].id)MENU.supabase=Object.assign({},keep,{storeId:rows[0].id});}
     }).catch(function(){/* sin conexión: queda el menu.json */});
   });
}

// ── pantalla ──
var activeCat='all';
function applyTheme(){var t=MENU.theme||{};if(t.primary)document.documentElement.style.setProperty('--primary',t.primary);if(t.accent)document.documentElement.style.setProperty('--accent',t.accent);}
function render(){
  var c=MENU.config||{};document.title=(MENU.store.name||'Menú');
  $('h-title').textContent=c.title||MENU.store.name||'Menú';$('h-sub').textContent=c.subtitle||'';
  $('foot').textContent=[MENU.store.name,MENU.store.address].filter(Boolean).join(' · ');
  if(c.enabled===false){$('grid').innerHTML='';$('cats').innerHTML='';$('msg').innerHTML='<div class="empty"><b>Menú no disponible por ahora</b><br>Volvé a intentar más tarde.</div>';return;}
  var cats=c.categories&&c.categories.length?c.categories:Array.from(new Set(MENU.products.map(function(p){return p.category}).filter(Boolean)));
  $('cats').innerHTML=['all'].concat(cats).map(function(k){return '<button class="cat '+(k===activeCat?'on':'')+'" data-cat="'+esc(k)+'">'+(k==='all'?'Todo':esc(k))+'</button>'}).join('');
  site();
  var list=MENU.products.filter(function(p){return activeCat==='all'||p.category===activeCat});
  $('grid').innerHTML=list.length?list.map(card).join(''):'<div class="empty">Todavía no hay productos para mostrar.</div>';
  bar();
}
function waHref(msg){var n=String((MENU.store&&MENU.store.whatsapp)||'').replace(/\D/g,'');return n?'https://wa.me/'+n+(msg?'?text='+encodeURIComponent(msg):''):'';}
function paras(t){return String(t||'').split(/\n{2,}/).map(function(x){return x.trim()}).filter(Boolean).map(function(x){return '<p>'+esc(x).replace(/\n/g,'<br>')+'</p>'}).join('');}
var NAVLBL={como:'Cómo funciona',historia:'Nosotros',resenas:'Reseñas',catering:'Catering',faq:'Preguntas',contacto:'Contacto'};
var MOD={
  hero:function(S,m){var f=m.hero,c=MENU.config||{},name=MENU.store.name||c.title||'Menú',img=S.images&&S.images.hero;
    return '<section class="hero'+(img?' img':'')+'" id="s-hero"'+(img?' style="background-image:url(\''+esc(img)+'\')"':'')+'><span class="tag">'+esc(name)+'</span><h1>'+esc(f.title||c.title||name)+'</h1>'+((f.subtitle||c.subtitle)?'<p>'+esc(f.subtitle||c.subtitle)+'</p>':'')+
      '<div class="btns"><a class="btn1" href="#menu">'+esc(f.cta)+' →</a>'+(waHref()?'<a class="btn2" target="_blank" rel="noopener" href="'+esc(waHref())+'">WhatsApp</a>':'')+'</div>'+
      (f.highlights.length?'<div class="hl">'+f.highlights.map(function(x){return '<div>'+(x.icon?'<i>'+esc(x.icon)+'</i>':'')+'<b>'+esc(x.title)+'</b>'+(x.text?'<span>'+esc(x.text)+'</span>':'')+'</div>'}).join('')+'</div>':'')+'</section>';},
  favoritos:function(S,m){var favs=MENU.products.filter(function(p){return p.star}).slice(0,6);if(!favs.length)return '';
    return '<section class="sec fav" id="s-fav"><span class="eyebrow">Del menú</span><h2>'+esc(m.favoritos.title)+'</h2>'+(m.favoritos.text?'<p class="lead">'+esc(m.favoritos.text)+'</p>':'')+'<div class="grid">'+favs.map(card).join('')+'</div><a class="more" href="#menu">Explorar todo el menú →</a></section>';},
  menu:function(S){return '<section class="sec" style="padding-bottom:0" id="s-menuhd"><span class="eyebrow">Pedí online</span><h2 style="font-family:var(--serif);font-weight:400;font-size:clamp(28px,5vw,42px);margin:0;line-height:1.1">'+esc(S.menuTitle)+'</h2></section>';},
  como:function(S,m){var f=m.como;if(!f.steps.length)return '';return '<section class="sec alt" id="s-how"><div class="in"><span class="eyebrow">Paso a paso</span><h2>'+esc(f.title)+'</h2>'+(f.lead?'<p class="lead">'+esc(f.lead)+'</p>':'')+'<div class="steps">'+f.steps.map(function(x,i){return '<div class="step"><em>'+(i+1)+'</em><b>'+esc(x.title)+'</b><div class="desc">'+esc(x.text)+'</div></div>'}).join('')+'</div></div></section>';},
  historia:function(S,m){var f=m.historia,img=S.images&&S.images.historia;if(!f.text&&!f.title)return '';
    var badge=f.badgeWord?'<div class="badge"><small>'+esc(f.badgeMeaning?'¿Qué significa?':'Destacado')+'</small><div class="w">'+esc(f.badgeWord)+'</div>'+(f.badgeMeaning?'<div class="m">'+esc(f.badgeMeaning)+'</div>':'')+(f.badgeQuote?'<div class="q">'+esc(f.badgeQuote)+'</div>':'')+'</div>':'';
    return '<section class="sec about" id="s-about"><div class="'+(img?'two':'')+'"><div><span class="eyebrow">'+esc(f.eyebrow||'Nuestra historia')+'</span><h2 style="font-family:var(--serif);font-weight:400;font-size:clamp(28px,5vw,42px);line-height:1.1;margin:0 0 16px">'+esc(f.title||'Quiénes somos')+'</h2>'+paras(f.text)+badge+'</div>'+(img?'<div class="pic" role="img" aria-label="Foto de '+esc(MENU.store.name||'nuestro local')+'" style="background-image:url(\''+esc(img)+'\')"></div>':'')+'</div></section>';},
  banda:function(S,m){var t=m.banda.text;if(!t)return '';var run=(' '+t+' · ').repeat(8);return '<div class="band" aria-hidden="true"><div>'+esc(run)+'</div></div>';},
  resenas:function(S,m){var f=m.resenas;if(!f.items.length)return '';return '<section class="sec alt" id="s-reviews"><div class="in"><span class="eyebrow">Opiniones</span><h2>'+esc(f.title)+'</h2>'+(f.lead?'<p class="lead">'+esc(f.lead)+'</p>':'')+'<div class="revs">'+f.items.map(function(x){return '<div class="rev"><div class="st" aria-label="5 estrellas">★★★★★</div>“'+esc(x.text)+'”'+((x.author||x.source)?'<small>'+esc([x.author,x.source].filter(Boolean).join(' · '))+'</small>':'')+'</div>'}).join('')+'</div></div></section>';},
  catering:function(S,m){var f=m.catering,wa=waHref('Hola, quiero consultar por catering');if(!f.text&&!f.info.length)return '';
    return '<section class="sec dark" id="s-catering"><div class="in"><div class="two"><div><span class="eyebrow">'+esc(f.eyebrow||'Catering y eventos')+'</span><h2 style="font-family:var(--serif);font-weight:400;font-size:clamp(28px,5vw,42px);line-height:1.1;margin:0 0 14px">'+esc(f.title)+'</h2>'+paras(f.text).replace(/<p>/g,'<p style="line-height:1.65;margin:0 0 12px;opacity:.9">')+(wa?'<a class="btn1" style="margin-top:8px" target="_blank" rel="noopener" href="'+esc(wa)+'">'+esc(f.cta)+'</a>':'')+'</div>'+(f.info.length?'<div class="cat-info">'+f.info.map(function(i){return '<div><b>'+esc(i.label)+'</b>'+esc(i.value)+'</div>'}).join('')+'</div>':'')+'</div></div></section>';},
  delivery:function(S,m){var f=m.delivery,D=MENU.delivery||{},zones=(D.zones||[]).map(function(z){return z.name}).filter(Boolean);
    if(!(f.hours||zones.length||D.freeShippingMin||D.deliveryMinOrder||MENU.store.address))return '';
    var a='<div><h3>🛵 '+esc(f.title)+'</h3>'+(f.hours?'<div>'+esc(f.hours).replace(/\n/g,'<br>')+'</div>':'')+(D.deliveryMinOrder?'<div>Pedido mínimo: <b>'+fmt(D.deliveryMinOrder)+'</b></div>':'')+(D.freeShippingMin?'<div>Envío gratis desde <b>'+fmt(D.freeShippingMin)+'</b></div>':'')+(f.extra?'<div>'+esc(f.extra)+'</div>':'')+'</div>';
    var b=MENU.store.address?'<div><h3>🏠 Retiro en el local</h3><div>'+esc(MENU.store.address)+'</div></div>':'';
    return '<section class="sec" id="s-delivery"><div class="info">'+a+b+'</div></section>';},
  faq:function(S,m){var f=m.faq;if(!f.items.length)return '';return '<section class="sec faq" id="s-faq"><span class="eyebrow">Ayuda</span><h2>'+esc(f.title)+'</h2>'+f.items.map(function(x){return '<details><summary>'+esc(x.q)+'</summary><p>'+esc(x.a)+'</p></details>'}).join('')+'</section>';},
  contacto:function(S,m){var f=m.contacto,wa=waHref(),name=MENU.store.name||'',hrs=(S.delivery&&S.delivery.hours)||'';
    return '<footer class="sfoot" id="s-contact"><div class="cols"><div><b>'+esc(name)+'</b>'+(f.note?'<div>'+esc(f.note)+'</div>':'')+'</div>'+(MENU.store.address?'<div><h4>Dónde</h4>'+esc(MENU.store.address)+'</div>':'')+(hrs?'<div><h4>Horarios</h4>'+esc(hrs).replace(/\n/g,'<br>')+'</div>':'')+((wa||f.instagram)?'<div><h4>Escribinos</h4>'+(wa?'<a href="'+esc(wa)+'" target="_blank" rel="noopener">WhatsApp</a>':'')+(f.instagram?(wa?'<br>':'')+'<a href="https://instagram.com/'+esc(f.instagram)+'" target="_blank" rel="noopener">@'+esc(f.instagram)+'</a>':'')+'</div>':'')+'</div><div class="by">Hecho con Sahten</div></footer>';}
};
function site(){
  var S=MENU.site,c=MENU.config||{},on=!!(S&&S.enabled&&c.enabled!==false),top=$('s-top'),rest=$('s-rest');
  document.body.classList.toggle('has-site',on);
  if(!on){$('s-nav').innerHTML='';top.innerHTML='';rest.innerHTML='';var fab0=$('fab');if(fab0)fab0.remove();return;}
  var name=MENU.store.name||c.title||'Menú',wa=waHref(),order=S.order||['hero','favoritos','menu'],before='',after='',seen=false,links=[['#menu','Menú']],hasContact=false;
  order.forEach(function(id){
    if(id==='menu'){seen=true;before+=MOD.menu(S);return;}
    var html=MOD[id]?MOD[id](S,S):'';if(!html)return;
    if(NAVLBL[id])links.push(['#'+({como:'s-how',historia:'s-about',resenas:'s-reviews',catering:'s-catering',faq:'s-faq',contacto:'s-contact'})[id],NAVLBL[id]]);
    if(id==='contacto')hasContact=true;
    if(seen)after+=html;else before+=html;
  });
  links.sort(function(a,b){return order.indexOf(idOf(a[0]))-order.indexOf(idOf(b[0]));});
  $('s-nav').innerHTML='<nav class="snav" id="snav" aria-label="Secciones"><b>'+esc(name)+'</b>'+links.map(function(l){return '<a href="'+l[0]+'">'+l[1]+'</a>'}).join('')+(wa?'<a class="wa" href="'+esc(wa)+'" target="_blank" rel="noopener">WhatsApp</a>':'')+'<button class="pedido" onclick="openCart()">Pedido ('+count()+')</button></nav>';
  top.innerHTML=before;rest.innerHTML=after;$('foot').textContent=hasContact?'':[MENU.store.name,MENU.store.address].filter(Boolean).join(' · ');
  var f=$('fab');if(wa&&!f){f=document.createElement('a');f.id='fab';f.className='fab';f.target='_blank';f.rel='noopener';f.setAttribute('aria-label','Escribinos por WhatsApp');f.textContent='💬';document.body.appendChild(f);}if(f)f.href=wa;
  var nv=$('snav');if(nv)document.documentElement.style.setProperty('--navh',nv.offsetHeight+'px');
}
function idOf(h){return ({'#menu':'menu','#s-how':'como','#s-about':'historia','#s-reviews':'resenas','#s-catering':'catering','#s-faq':'faq','#s-contact':'contacto'})[h]||'';}
function card(p){
  var n=cart[p.id]||0, showP=MENU.config.showPrices!==false;
  var img=p.image&&MENU.config.showImages!==false?'<img loading="lazy" src="'+esc(p.image)+'" alt="" onerror="this.parentNode.textContent=this.getAttribute(\'data-i\')" data-i="'+esc((p.name||'?').charAt(0).toUpperCase())+'">':esc((p.name||'?').charAt(0).toUpperCase());
  return '<div class="card"><div class="ph">'+img+'</div><div class="body">'+(p.category?'<div class="cat-l">'+esc(p.category)+'</div>':'')+'<div class="name">'+esc(p.name)+'</div>'+(p.description?'<div class="desc">'+esc(p.description)+'</div>':'')+(showP?'<div class="price">'+fmt(p.price)+'</div>':'')+
   (n?'<div class="qty"><button data-dec="'+esc(p.id)+'" aria-label="Quitar">−</button><b>'+n+'</b><button data-inc="'+esc(p.id)+'" aria-label="Agregar">+</button></div>':'<button class="add" data-inc="'+esc(p.id)+'">Agregar</button>')+'</div></div>';
}
function lines(){return MENU.products.filter(function(p){return cart[p.id]}).map(function(p){return {id:p.id,name:p.name,qty:cart[p.id],unitPrice:p.price,lineTotal:p.price*cart[p.id]}});}
function subtotal(){return lines().reduce(function(s,l){return s+l.lineTotal},0);}
function count(){return lines().reduce(function(s,l){return s+l.qty},0);}
function bar(){var n=count();$('bar').classList.toggle('on',n>0);$('bar-n').textContent=n+(n===1?' producto':' productos');$('bar-t').textContent=fmt(subtotal());}
function change(id,d){cart[id]=Math.max(0,(cart[id]||0)+d);if(!cart[id])delete cart[id];if(geo)ship=shippingFor(MENU.delivery,geo.lat,geo.lng,subtotal());render();if($('ov').classList.contains('on'))sheet();}

// ── carrito / checkout ──
function openCart(){step='cart';sheet();$('ov').classList.add('on');}
function closeSheet(){$('ov').classList.remove('on');}
function payMethods(){var m=(MENU.payments&&MENU.payments.methods)||{efectivo:true};return Object.keys(m).filter(function(k){return m[k]});}
function total(){return subtotal()+(type==='delivery'&&ship&&ship.ok?ship.cost:0);}
function shipNote(){
  if(type!=='delivery')return '';
  if(!geo)return '<div class="note">Escribí tu dirección y elegí una de las sugerencias para calcular el envío.</div>';
  if(ship.out)return '<div class="note err">Tu dirección está fuera de la zona de entrega ('+ship.distKm.toFixed(1)+' km). Podés retirar en el local.</div>';
  if(ship.belowMin)return '<div class="note err">El pedido mínimo para delivery es '+fmt(ship.minOrder)+'.</div>';
  return '<div class="note ok">Envío '+(ship.free?'<b>gratis</b>':'<b>'+fmt(ship.cost)+'</b>')+' · '+esc(ship.zone.name)+'</div>';
}
function sheet(){
  var s=$('sheet'),ls=lines();
  if(step==='done'){s.innerHTML=done();return;}
  if(!ls.length){s.innerHTML='<h2>Tu pedido</h2><div class="empty">El carrito está vacío.</div><button class="cta ghost" data-close>Seguir viendo el menú</button>';return;}
  pay=pay||payMethods()[0]||'efectivo';
  var labels=PAY_LABELS;
  var canSend=!sending&&form.name.trim()&&form.phone.trim()&&(type==='pickup'||(geo&&ship&&ship.ok));
  s.innerHTML='<h2>Tu pedido</h2>'+ls.map(function(l){return '<div class="row"><span>'+esc(l.name)+' ×'+l.qty+'</span><span>'+fmt(l.lineTotal)+'</span></div>'}).join('')+
   '<div class="row"><span>Subtotal</span><span>'+fmt(subtotal())+'</span></div>'+(type==='delivery'&&ship&&ship.ok?'<div class="row"><span>Envío</span><span>'+(ship.cost?fmt(ship.cost):'Gratis')+'</span></div>':'')+'<div class="row t"><span>Total</span><span>'+fmt(total())+'</span></div>'+
   '<div class="seg"><button data-type="delivery" class="'+(type==='delivery'?'on':'')+'">🛵 Delivery</button><button data-type="pickup" class="'+(type==='pickup'?'on':'')+'">🏠 Retiro en local</button></div>'+
   (MENU.config.deliveryNote&&type==='delivery'?'<div class="note">'+esc(MENU.config.deliveryNote)+'</div>':'')+
   '<label>Nombre</label><input id="f-name" autocomplete="name" value="'+esc(form.name)+'"><label>Teléfono</label><input id="f-phone" type="tel" autocomplete="tel" value="'+esc(form.phone)+'">'+
   (type==='delivery'?'<label>Dirección de entrega</label><input id="f-addr" autocomplete="street-address" placeholder="Calle y número, localidad" value="'+esc(form.address)+'"><div id="sugs"></div>'+shipNote():'<div class="note">Retiro: '+esc(MENU.store.address||'en el local')+'</div>')+
   '<label>Forma de pago</label><select id="f-pay">'+payMethods().map(function(k){return '<option value="'+k+'"'+(k===pay?' selected':'')+'>'+(labels[k]||k)+'</option>'}).join('')+'</select>'+
   '<label>Notas (opcional)</label><textarea id="f-notes" rows="2">'+esc(form.notes)+'</textarea>'+
   '<div id="err"></div><button class="cta" id="send"'+(canSend?'':' disabled')+'>'+(sb()?'Enviar pedido':'Pedir por WhatsApp')+' · '+fmt(total())+'</button><button class="cta ghost" data-close>Seguir viendo el menú</button>';
  var bind=function(id,key){var el=$(id);if(el)el.addEventListener('input',function(){form[key]=el.value;refreshSend();});};
  bind('f-name','name');bind('f-phone','phone');bind('f-notes','notes');
  if($('f-pay'))$('f-pay').addEventListener('change',function(){pay=this.value;});
  if($('f-addr'))$('f-addr').addEventListener('input',function(){form.address=this.value;geo=null;ship=null;suggest(this.value);refreshSend();});
  renderSugs();
}
function refreshSend(){var b=$('send');if(!b)return;b.disabled=sending||!(form.name.trim()&&form.phone.trim()&&(type==='pickup'||(geo&&ship&&ship.ok)));}
function suggest(v){clearTimeout(sugTimer);sugs=[];renderSugs();if(!v||v.length<5)return;sugTimer=setTimeout(function(){
  var near=MENU.delivery&&MENU.delivery.lat!=null?'&viewbox='+[MENU.delivery.lng-0.4,MENU.delivery.lat+0.4,MENU.delivery.lng+0.4,MENU.delivery.lat-0.4].join(',')+'&bounded=0':'';
  fetch('https://nominatim.openstreetmap.org/search?format=json&limit=5&accept-language=es&addressdetails=1&q='+encodeURIComponent(v)+near).then(function(r){return r.json()}).then(function(rows){
    sugs=(rows||[]).map(function(d){return {label:d.display_name.split(',').slice(0,3).join(','),lat:+d.lat,lng:+d.lon};});renderSugs();}).catch(function(){sugs=[];var e=$('err');if(e)e.innerHTML='<div class="note err">No pudimos buscar la dirección (sin conexión).</div>';});},500);}
function renderSugs(){var el=$('sugs');if(!el)return;el.innerHTML=sugs.length?'<div class="sug">'+sugs.map(function(s,i){return '<div data-sug="'+i+'">'+esc(s.label)+'</div>'}).join('')+'</div>':'';}
function pickSug(i){var s=sugs[i];if(!s)return;form.address=s.label;geo={lat:s.lat,lng:s.lng};sugs=[];ship=shippingFor(MENU.delivery,s.lat,s.lng,subtotal());sheet();}

function buildOrder(){
  var ls=lines(),sub=subtotal(),sh=type==='delivery'&&ship&&ship.ok?ship.cost:0;
  return {id:'web_'+Date.now().toString(36)+Math.random().toString(36).slice(2,6),num:Math.floor(Math.random()*9000)+1000,createdAt:new Date().toISOString(),source:type,status:'pendiente',
    customerName:form.name.trim(),customerPhone:form.phone.trim(),customerEmail:form.email.trim(),address:type==='delivery'?form.address:'Retiro en local',zoneName:type==='delivery'&&ship&&ship.zone?ship.zone.name:'',
    lat:geo?geo.lat:null,lng:geo?geo.lng:null,paymentMethod:pay,items:ls,subtotal:sub,discount:0,shipping:sh,total:sub+sh,notes:form.notes.trim()};
}
function waLink(o){return waUrl(MENU.store.whatsapp,o,cur());}
function send(){
  if(sending)return; var o=buildOrder(); lastOrder=o; sending=true; refreshSend();
  if(!sb()){ sending=false; var w=window.open(waLink(o),'_blank'); finish(o,false); return; }
  var s=sb();
  fetch(s.url+'/rest/v1/orders',{method:'POST',headers:sbHeaders({Prefer:'return=minimal'}),body:JSON.stringify({store_id:s.storeId,payload:o})})
   .then(function(r){if(!r.ok)throw new Error('HTTP '+r.status);sending=false;finish(o,true);})
   .catch(function(){sending=false;step='cart';sheet();var e=$('err');if(e)e.innerHTML='<div class="note err"><b>No pudimos enviar tu pedido.</b> Revisá tu conexión y reintentá'+(MENU.store.whatsapp?', o pedilo por WhatsApp.':'.')+(MENU.store.whatsapp?'<br><a href="'+esc(waLink(o))+'" target="_blank" rel="noopener">Pedir por WhatsApp</a>':'')+'</div>';});
}
function finish(o,sent){cart={};step='done';render();sheet();$('ov').classList.add('on');}
function done(){
  var o=lastOrder,bank=(MENU.payments&&MENU.payments.bank)||{},sent=!!sb();
  var bankHtml=o.paymentMethod==='transferencia'&&(bank.alias||bank.cbu||bank.bankName)?'<div class="note"><b>Datos para la transferencia</b><br>'+['bankName','accountHolder','cbu','alias'].filter(function(k){return bank[k]}).map(function(k){return esc(bank[k])}).join('<br>')+'</div>':'';
  return '<h2>¡Gracias, '+esc(o.customerName)+'!</h2><div class="note ok">'+(sent?'Recibimos tu pedido <b>#'+String(o.num).padStart(4,'0')+'</b>. Te vamos a avisar por teléfono.':'Se abrió WhatsApp con tu pedido <b>#'+String(o.num).padStart(4,'0')+'</b>. Enviá el mensaje para confirmarlo.')+'</div>'+bankHtml+
   '<div class="row t"><span>Total</span><span>'+fmt(o.total)+'</span></div>'+(MENU.store.whatsapp?'<a class="cta wa" style="display:block;text-align:center;text-decoration:none" target="_blank" rel="noopener" href="'+esc(waLink(o))+'">'+(sent?'Avisar por WhatsApp':'Abrir WhatsApp de nuevo')+'</a>':'')+'<button class="cta ghost" data-close>Volver al menú</button>';
}

document.addEventListener('click',function(e){
  var t=e.target.closest('[data-cat],[data-inc],[data-dec],[data-type],[data-sug],[data-close],#send');if(!t)return;
  if(t.dataset.cat!==undefined){activeCat=t.dataset.cat;render();}
  else if(t.dataset.inc!==undefined)change(t.dataset.inc,1);
  else if(t.dataset.dec!==undefined)change(t.dataset.dec,-1);
  else if(t.dataset.type!==undefined){type=t.dataset.type;if(type==='delivery'&&geo)ship=shippingFor(MENU.delivery,geo.lat,geo.lng,subtotal());sheet();}
  else if(t.dataset.sug!==undefined)pickSug(+t.dataset.sug);
  else if(t.hasAttribute('data-close'))closeSheet();
  else if(t.id==='send')send();
});
window.openCart=openCart;window.__menu=function(){return MENU;};
load().then(function(){applyTheme();render();}).catch(function(e){$('msg').innerHTML='<div class="empty"><b>No pudimos cargar el menú.</b><br>'+esc(e.message)+'<br><small>Si abriste el archivo directo desde tu computadora, probá desde el sitio publicado.</small></div>';});
})();
</script>
</body>
