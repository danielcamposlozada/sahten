<link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700;800&family=DM+Serif+Display&display=swap" rel="stylesheet">
<style>
:root{--primary:#235328;--accent:#F28C00;--ink:#1e2c1f;--muted:#6f7f71;--bg:#faf8f5;--card:#fff;--border:#e2ddd5;--red:#c0392b;--r:14px}
*{box-sizing:border-box}body{margin:0;font-family:'DM Sans',system-ui,sans-serif;background:var(--bg);color:var(--ink);-webkit-text-size-adjust:100%}
button,input,select,textarea{font:inherit;color:inherit}
header{background:var(--primary);color:#fff;padding:28px 16px 22px;text-align:center}
header h1{margin:0 0 4px;font-size:26px;letter-spacing:-.02em}header p{margin:0;opacity:.85;font-size:14px}
.cats{position:sticky;top:0;z-index:5;background:var(--bg);display:flex;gap:8px;overflow-x:auto;padding:10px 16px;border-bottom:1px solid var(--border)}
@media(min-width:1000px){.cats{padding-left:calc((100% - 980px)/2 + 16px)}}
.cat{flex:none;border:1.5px solid var(--border);background:#fff;border-radius:99px;padding:7px 14px;font-size:13px;font-weight:600;cursor:pointer}
.cat.on{background:var(--primary);border-color:var(--primary);color:#fff}
main{max-width:980px;margin:0 auto;padding:16px 16px 110px}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(230px,1fr));gap:14px}
.card{background:var(--card);border:1px solid var(--border);border-radius:var(--r);overflow:hidden;display:flex;flex-direction:column}
.ph{aspect-ratio:4/3;background:#ede8df;display:flex;align-items:center;justify-content:center;font-size:38px;font-weight:800;color:#b9b2a5}.ph img{width:100%;height:100%;object-fit:cover;display:block}
.body{padding:12px 14px 14px;display:flex;flex-direction:column;gap:6px;flex:1}.cat-l{font-size:11px;font-weight:700;letter-spacing:.5px;text-transform:uppercase;color:var(--accent)}
.name{font-weight:700;font-size:15px}.price{font-weight:800;font-size:16px;color:var(--primary);margin-top:auto}
.add{text-align:center;text-decoration:none;display:block;border:0;background:var(--accent);color:#fff;border-radius:10px;padding:9px 12px;font-weight:700;cursor:pointer}
.qty{display:flex;align-items:center;justify-content:space-between;gap:8px}.qty button{width:34px;height:34px;border-radius:10px;border:1.5px solid var(--border);background:#fff;font-size:18px;cursor:pointer}
.bar{position:fixed;left:0;right:0;bottom:0;background:#fff;border-top:1px solid var(--border);padding:10px 16px calc(10px + env(safe-area-inset-bottom));display:none;z-index:8}
.bar.on{display:block}.bar button{width:100%;max-width:980px;margin:0 auto;display:flex;justify-content:space-between;border:0;background:var(--primary);color:#fff;border-radius:12px;padding:14px 18px;font-weight:700;font-size:15px;cursor:pointer}
.ov{position:fixed;inset:0;background:rgba(15,25,17,.55);z-index:20;display:none;align-items:flex-end;justify-content:center}.ov.on{display:flex}
.sheet{background:#fff;width:100%;max-width:560px;max-height:94vh;overflow:auto;border-radius:18px 18px 0 0;padding:18px 18px 24px}
@media(min-width:700px){.ov{align-items:center}.sheet{border-radius:18px}}
.sheet h2{margin:0 0 12px;font-size:19px}.row{display:flex;justify-content:space-between;gap:10px;padding:7px 0;font-size:14px}.row.t{font-weight:800;font-size:17px;border-top:2px solid var(--primary);margin-top:6px;padding-top:10px}
.seg{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin:12px 0}.seg button{padding:10px;border-radius:10px;border:1.5px solid var(--border);background:#fff;font-weight:700;cursor:pointer}.seg button.on{border-color:var(--primary);background:rgba(35,83,40,.08);color:var(--primary)}
label{display:block;font-size:12px;font-weight:700;color:var(--muted);margin:10px 0 4px}input,select,textarea{width:100%;border:1.5px solid var(--border);border-radius:10px;padding:10px 12px;background:#fff}
.sug{border:1px solid var(--border);border-radius:10px;margin-top:4px;overflow:hidden}.sug div{padding:9px 12px;font-size:13px;cursor:pointer;border-bottom:1px solid var(--border)}.sug div:last-child{border:0}.sug div:hover{background:#f5f1ea}
.note{font-size:13px;padding:10px 12px;border-radius:10px;background:#f5f1ea;margin-top:10px}.note.err{background:#fdecea;color:var(--red)}.note.ok{background:#e8f4ea;color:var(--primary)}
.cta{width:100%;margin-top:14px;border:0;border-radius:12px;padding:14px;font-weight:800;font-size:15px;background:var(--primary);color:#fff;cursor:pointer}.cta.wa{background:#25D366}.cta.ghost{background:#fff;color:var(--ink);border:1.5px solid var(--border)}.cta[disabled]{opacity:.5;cursor:not-allowed}
.empty{text-align:center;color:var(--muted);padding:60px 16px}
#foot:empty{display:none}
footer{text-align:center;color:var(--muted);font-size:12px;padding:18px}
.desc{font-size:12.5px;color:var(--muted);line-height:1.4}
/* sitio (portada + secciones): solo si el dueño lo activa */
:root{--serif:'DM Serif Display',Georgia,serif}
html{scroll-behavior:smooth}@media(prefers-reduced-motion:reduce){html{scroll-behavior:auto}*{animation:none!important;transition:none!important}}
:focus-visible{outline:3px solid var(--accent);outline-offset:2px}
.has-site header{display:none}
.has-site [id]{scroll-margin-top:calc(var(--navh,56px) + 64px)}
#s-nav{display:contents}
.has-site #menuwrap{display:none}.has-site.view-order #menuwrap{display:block}.has-site.view-order #s-top,.has-site.view-order #s-rest{display:none}
.oback{display:none;max-width:980px;margin:0 auto;padding:18px 16px 4px}
[data-storefront] .oback,.has-site.view-order .oback{display:flex;align-items:center;gap:14px;flex-wrap:wrap}
.oback a{color:var(--primary);font-weight:700;font-size:14px;text-decoration:none;border:1.5px solid var(--border);background:#fff;border-radius:99px;padding:8px 14px}.oback a:hover{border-color:var(--primary)}
.oback h2{margin:0;font-family:var(--serif);font-weight:400;font-size:clamp(24px,4vw,34px);line-height:1.1}.oback h2:focus{outline:none}
.ctiles{display:grid;grid-template-columns:repeat(auto-fill,minmax(190px,1fr));gap:12px;max-width:980px;margin:20px auto 0}
.ctile{display:flex;flex-direction:column;background:var(--card);border:1px solid var(--border);border-radius:var(--r);overflow:hidden;text-decoration:none;color:inherit;transition:transform .15s,box-shadow .15s}
.ctile:hover{transform:translateY(-2px);box-shadow:0 8px 22px rgba(0,0,0,.1)}
.ct-ph{aspect-ratio:3/2;background:#ede8df;display:flex;align-items:center;justify-content:center;font-size:34px;font-weight:800;color:#b9b2a5}.ct-ph img{width:100%;height:100%;object-fit:cover;display:block}
.ctile b{padding:10px 12px 0;font-size:15px}.ctile small{padding:2px 12px 12px;color:var(--muted);font-size:12.5px}
.pedir-cta{display:block;max-width:980px;margin:18px auto 0;text-align:center;text-decoration:none;background:var(--accent);color:#fff;font-weight:800;font-size:16px;border-radius:14px;padding:16px 18px}.pedir-cta:hover{filter:brightness(.95)}
@media(prefers-reduced-motion:reduce){.ctile{transition:none}.ctile:hover{transform:none}}
.snav{position:sticky;top:0;z-index:7;background:color-mix(in srgb,var(--primary) 94%,transparent);backdrop-filter:blur(10px);color:#fff;display:flex;align-items:center;gap:4px;padding:10px 18px;overflow-x:auto;white-space:nowrap;box-shadow:0 1px 0 rgba(255,255,255,.08)}
.snav b{font-family:var(--serif);font-weight:400;font-size:21px;margin-right:auto;letter-spacing:.2px}
.snav a{color:#fff;text-decoration:none;font-size:13.5px;font-weight:600;opacity:.88;padding:7px 11px;border-radius:99px;transition:background .15s}.snav a[aria-current="page"]{background:rgba(255,255,255,.18);opacity:1}.snav a:hover{background:rgba(255,255,255,.14);opacity:1}
.snav .pedido{background:var(--accent);font-weight:800;border:0;color:#fff;border-radius:99px;padding:8px 16px;cursor:pointer;font-size:13.5px;margin-left:6px}
.has-site .cats{top:calc(var(--navh,56px) - 1px)}
.eyebrow{display:block;font-size:12px;font-weight:800;letter-spacing:.14em;text-transform:uppercase;color:var(--accent);margin-bottom:8px}
.sec{max-width:1040px;margin:0 auto;padding:64px 18px}.sec>h2,.in>h2,.hd h2{font-family:var(--serif);font-weight:400;margin:0 0 10px;font-size:clamp(28px,5vw,42px);line-height:1.1;letter-spacing:-.01em}
.sec .lead,.in>.lead{color:var(--muted);margin:0 0 26px;font-size:16px;line-height:1.55;max-width:640px}
.sec.alt{max-width:none;background:#fff;border-block:1px solid var(--border)}.sec.alt>.in{max-width:1040px;margin:0 auto}
.sec.dark{max-width:none;background:linear-gradient(135deg,#14301a,var(--primary));color:#fff}.sec.dark>.in{max-width:1040px;margin:0 auto}.sec.dark .lead{color:rgba(255,255,255,.8)}
.hero{position:relative;overflow:hidden;background:radial-gradient(1200px 500px at 85% -10%,rgba(255,255,255,.12),transparent 60%),linear-gradient(135deg,var(--primary),#14301a);color:#fff;padding:92px 18px 70px;text-align:center}
.hero.img{background-size:cover;background-position:center}.hero.img::before{content:'';position:absolute;inset:0;background:linear-gradient(180deg,rgba(10,20,12,.55),rgba(10,20,12,.78))}
.hero>*{position:relative}.hero .tag{display:inline-block;font-size:12px;font-weight:800;letter-spacing:.16em;text-transform:uppercase;border:1px solid rgba(255,255,255,.35);border-radius:99px;padding:6px 14px;margin-bottom:20px;opacity:.9}
.hero h1{font-family:var(--serif);font-weight:400;margin:0 auto 16px;max-width:820px;font-size:clamp(38px,8vw,72px);line-height:1.02;letter-spacing:-.02em}.hero p{margin:0 auto 30px;max-width:620px;font-size:clamp(16px,2.4vw,19px);opacity:.92;line-height:1.55}
.brand-mark{display:block;width:min(340px,70vw);height:auto;margin:0 auto 22px;color:#FFF4D6}#h-mark .brand-mark{width:min(220px,60vw);margin-bottom:10px}
.hero .btns{display:flex;gap:10px;justify-content:center;flex-wrap:wrap}.btn1,.btn2{display:inline-block;text-decoration:none;font-weight:800;border-radius:99px;padding:14px 28px;font-size:15px;transition:transform .15s}
.btn1{background:var(--accent);color:#fff;box-shadow:0 8px 24px rgba(0,0,0,.25)}.btn2{border:1.5px solid rgba(255,255,255,.55);color:#fff}.btn1:hover,.btn2:hover{transform:translateY(-2px)}
.hl{display:grid;grid-template-columns:repeat(auto-fit,minmax(190px,1fr));gap:12px;max-width:960px;margin:48px auto 0;text-align:left}
.hl div{background:rgba(255,255,255,.1);border:1px solid rgba(255,255,255,.14);backdrop-filter:blur(6px);border-radius:16px;padding:16px}.hl i{font-style:normal;font-size:26px;display:block;margin-bottom:8px}.hl b{display:block;font-size:15px}.hl span{font-size:13px;opacity:.85;line-height:1.4;display:block;margin-top:2px}
.fav .grid{grid-template-columns:repeat(auto-fill,minmax(250px,1fr))}.more{display:inline-block;margin-top:20px;font-weight:800;color:var(--primary);text-decoration:none;border-bottom:2px solid var(--accent)}
.card{transition:transform .18s,box-shadow .18s;border-radius:16px}.card:hover{transform:translateY(-3px);box-shadow:0 14px 30px rgba(20,48,26,.12)}.add{border-radius:99px!important}.desc{font-size:12.5px;color:var(--muted);line-height:1.45}
.steps{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:16px;counter-reset:s}.step{background:var(--bg);border:1px solid var(--border);border-radius:18px;padding:22px}.step em{font-style:normal;display:inline-grid;place-items:center;width:36px;height:36px;border-radius:50%;background:var(--accent);color:#fff;font-weight:800;margin-bottom:12px}.step b{display:block;font-size:17px;margin-bottom:4px}
.two{display:grid;grid-template-columns:1.2fr 1fr;gap:34px;align-items:center}@media(max-width:760px){.two{grid-template-columns:1fr}}
.about p{line-height:1.7;font-size:16px;margin:0 0 14px}.pic{aspect-ratio:4/5;border-radius:22px;background:#ede8df center/cover;box-shadow:0 20px 50px rgba(20,48,26,.18)}
.badge{background:var(--primary);color:#fff;border-radius:20px;padding:26px;margin-top:20px}.badge small{opacity:.75;font-size:12px;letter-spacing:.1em;text-transform:uppercase;font-weight:700}.badge .w{font-family:var(--serif);font-size:44px;line-height:1.1;margin:6px 0}.badge .m{font-style:italic;opacity:.9}.badge .q{margin-top:10px;opacity:.85;font-size:14px;line-height:1.5}
.band{background:var(--accent);color:#fff;overflow:hidden;white-space:nowrap;padding:14px 0;font-weight:800;letter-spacing:.14em;text-transform:uppercase;font-size:14px}.band div{display:inline-block;animation:mq 28s linear infinite;padding-left:100%}@keyframes mq{to{transform:translateX(-100%)}}
.revs{display:grid;grid-template-columns:repeat(auto-fit,minmax(260px,1fr));gap:16px}.rev{background:var(--bg);border:1px solid var(--border);border-radius:18px;padding:22px;font-size:15px;line-height:1.55}.rev .st{color:var(--accent);letter-spacing:3px;font-size:14px;margin-bottom:6px}.rev small{display:block;color:var(--muted);margin-top:12px;font-weight:600}
.info{display:grid;grid-template-columns:repeat(auto-fit,minmax(260px,1fr));gap:16px}.info>div{background:#fff;border:1px solid var(--border);border-radius:18px;padding:22px;font-size:15px;line-height:1.6}.info h3{margin:0 0 10px;font-size:18px;font-family:var(--serif);font-weight:400}
.cat-info{background:rgba(255,255,255,.1);border:1px solid rgba(255,255,255,.16);border-radius:18px;padding:20px;display:grid;gap:12px}.cat-info div{font-size:14.5px}.cat-info b{display:block;font-size:12px;letter-spacing:.1em;text-transform:uppercase;opacity:.7;margin-bottom:2px}
.faq details{background:#fff;border:1px solid var(--border);border-radius:14px;margin-bottom:10px;padding:0 18px}.faq summary{cursor:pointer;font-weight:700;padding:16px 0;list-style:none;font-size:16px}.faq summary::-webkit-details-marker{display:none}.faq summary::after{content:'+';float:right;color:var(--accent);font-size:24px;line-height:1}.faq details[open] summary::after{content:'−'}.faq p{margin:0 0 16px;color:var(--muted);line-height:1.6;font-size:15px}
.sfoot{background:#10261a;color:#dfe9e0;padding:48px 18px 36px}.sfoot .cols{max-width:1040px;margin:0 auto;display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:26px;font-size:14px;line-height:1.7}.sfoot b{display:block;font-family:var(--serif);font-weight:400;font-size:22px;color:#fff;margin-bottom:6px}.sfoot h4{margin:0 0 6px;font-size:12px;letter-spacing:.12em;text-transform:uppercase;opacity:.6}.sfoot a{color:#fff}.sfoot .by{text-align:center;opacity:.5;font-size:12px;margin-top:30px}
.fab{position:fixed;right:16px;bottom:16px;z-index:6;width:56px;height:56px;border-radius:50%;background:#25D366;color:#fff;display:grid;place-items:center;box-shadow:0 8px 24px rgba(0,0,0,.28);text-decoration:none;font-size:26px}.bar.on~.fab,.has-bar .fab{bottom:84px}
@media(max-width:620px){.snav a:not(.pedido):not(.wa){display:none}.hero{padding:64px 16px 48px}.sec{padding:46px 16px}}

/* Espacio de compra: acciones visibles y marca adaptable. */
:root{--on-accent:#1c1c1e;--on-primary:#fff;--visual-height:100dvh;--visual-top:0px}
.snav{overflow:visible;white-space:normal;gap:8px;padding:8px 12px}
.snav b{flex:1;min-width:0;max-width:280px;line-height:1.15;overflow-wrap:anywhere;display:-webkit-box;-webkit-box-orient:vertical;-webkit-line-clamp:2;overflow:hidden}
.snav-links{display:flex;flex:none;align-items:center}
.snav .pedido{flex:none;min-height:44px;white-space:nowrap;margin:0;color:var(--on-accent)}
.snav .wa{flex:none;white-space:nowrap}
.snav-menu{display:none}
.snav-menu summary{list-style:none;cursor:pointer;min-height:44px;display:flex;align-items:center;padding:8px 12px;border:1px solid currentColor;border-radius:10px;font-size:14px;font-weight:700}
.snav-menu summary::-webkit-details-marker{display:none}
.snav-menu>div{position:absolute;top:100%;right:12px;left:12px;max-width:360px;margin-left:auto;max-height:calc(100dvh - var(--navh,60px) - 24px);overflow:auto;background:var(--primary);border:1px solid rgba(255,255,255,.4);border-radius:12px;padding:8px;box-shadow:0 12px 30px rgba(0,0,0,.25)}
.snav-menu>div a{display:block;min-height:44px}
.add,.btn1,.pedir-cta,.step em,.band{color:var(--on-accent)}
.cat.on,.bar button,.cta:not(.ghost):not(.wa){color:var(--on-primary)}
.qty button{width:44px;height:44px}
.sug button{display:block;width:100%;min-height:44px;text-align:left;padding:10px 12px;border:0;border-bottom:1px solid var(--border);background:var(--card);font:inherit;cursor:pointer}
.sug button:hover{background:var(--bg)}
.cta.wa{color:#10261a}
input,select,textarea{font-size:16px;min-height:44px}
.modal-open{overflow:hidden}
.ov{top:var(--visual-top);bottom:auto;height:var(--visual-height);padding:8px}
.sheet{padding:0;max-height:calc(var(--visual-height) - 16px);display:flex;flex-direction:column;border-radius:16px}
.sheet:focus{outline:none}
.sheet-head{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:12px 16px;border-bottom:1px solid var(--border);flex:none}
.sheet-head h2{margin:0}
.sheet-close{min-width:44px;min-height:44px;border:1px solid var(--border);border-radius:8px;background:var(--bg);font-size:24px;cursor:pointer}
.sheet-body{min-height:0;overflow:auto;overscroll-behavior:contain;padding:0 16px 16px}
.sheet-footer{padding:8px 16px calc(12px + env(safe-area-inset-bottom,0px));border-top:1px solid var(--border);flex:none;max-height:min(55dvh,calc(var(--visual-height) - 96px));overflow:auto;background:var(--card)}
.sheet-footer:empty{display:none}
.sheet-footer .cta{margin-top:8px;min-height:48px}
.sheet-status{font-size:13px;line-height:1.4;color:var(--ink);margin-top:6px}
.sheet-footer .row.t{margin:0;padding-top:6px;border:0}
@media(max-width:1200px){.snav-links{display:none}.snav-menu{display:block;flex:none}}
@media(max-width:620px){.snav a{display:block!important}.snav .wa{display:none!important}.snav b{font-size:16px}.snav .pedido{padding:8px 12px}.snav-menu summary{padding:8px}.sheet-footer .cta.ghost{display:none}}
.sr-only{position:absolute;width:1px;height:1px;padding:0;margin:-1px;overflow:hidden;clip:rect(0,0,0,0);white-space:nowrap;border:0}.review-invite{display:flex;align-items:center;justify-content:space-between;gap:24px;flex-wrap:wrap;background:var(--card,#fff);border:1px solid var(--line,#ddd);border-radius:18px;padding:24px;margin-top:28px;color:var(--ink,#1c1c1e)}
.review-invite h3{font-size:22px;line-height:1.3;margin:0 0 8px}.review-invite p{font-size:16px;line-height:1.5;margin:0}.google-review-button{display:inline-flex;justify-content:center;align-items:center;gap:10px;min-height:48px;padding:12px 18px;border:1px solid #747775;border-radius:10px;background:#fff;color:#1f1f1f;text-decoration:none;font-size:16px;font-weight:700;line-height:1.4}.google-review-button img{flex:none}.google-review-button:hover{background:#f1f3f4}.google-review-button:focus-visible{outline:3px solid #1a73e8;outline-offset:3px}@media(max-width:640px){.review-invite{padding:20px;gap:18px}.google-review-button{width:100%}.review-invite h3{font-size:21px}}

.brand-mask{display:inline-block;background:currentColor;mask-image:var(--logo);mask-size:contain;mask-repeat:no-repeat;mask-position:center;-webkit-mask-image:var(--logo);-webkit-mask-size:contain;-webkit-mask-repeat:no-repeat;-webkit-mask-position:center;height:auto!important}
.brand-mask>img{display:block;width:100%;height:auto;visibility:hidden}
.hero .brand-mark{color:inherit}
.snav .nav-brand{display:flex;align-items:center;margin-right:auto;flex:1;min-width:0;max-width:280px;padding:4px 8px;opacity:1;border-radius:6px}
.snav .nav-brand .brand-mark{display:block;width:116px;max-width:100%;height:48px!important;object-fit:contain;object-position:left center;margin:0;color:inherit;flex:none}
.snav .nav-brand b{margin:0}
@media(max-width:620px){.snav .nav-brand .brand-mark{width:86px;height:36px!important}.snav .nav-brand{padding:4px 0}}
.wa-icon{display:inline-block;vertical-align:middle;margin-right:7px;flex:none}.fab .wa-icon{width:30px;height:30px;margin:0}
/* Tienda independiente: la portada conserva su diseño y la compra ocupa su propia página. */
[data-storefront] header{padding:18px 16px}[data-storefront] #h-mark{display:none}
.name{font-size:16px}.desc{font-size:14px;line-height:1.5}.cat{min-height:44px}.add,.qty button{min-height:44px}
</style>
</head>
<body>

<div id="s-nav"></div>
<div id="s-top"></div>
<div id="menuwrap">
<div class="oback" id="oback"><a href="#">← Volver al inicio</a><h2 id="oback-h">Pedí online</h2></div>
<nav class="cats" id="cats"></nav>

<script>
(function(){
'use strict';
var ORDER_PAGE=document.body.hasAttribute('data-storefront'), PREVIEW=document.body.hasAttribute('data-preview');
var MENU=null, cart={}, type='delivery', geo=null, ship=null, pay='', form={name:'',phone:'',email:'',address:'',notes:''}, step='cart', sending=false, lastOrder=null, sugTimer=null, sugs=[];
var $=function(id){return document.getElementById(id)};
var esc=function(s){return String(s==null?'':s).replace(/[&<>"']/g,function(m){return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#039;'}[m]})};
/* Caligrafía de la marca sola (vector incrustado al publicar; solo con kit de marca). Devuelve '' si no hay. */
var BRAND=null;try{BRAND=JSON.parse($('brand-inline').textContent.replace(/^\/\*.*?\*\//,''));}catch(e){}
function brandMark(label,placement){var s=MENU&&MENU.site,h=s&&s.hero,custom=s&&s.logo,mono=s&&s.logoUseTextColor;
  if(placement==='hero'&&h&&h.logo){custom=h.logo;mono=h.logoUseTextColor!==false;}
  if(/^data:image\/(?:png|jpeg|webp|svg\+xml);base64,[A-Za-z0-9+/]+={0,2}$/.test(custom||'')){return mono?'<span class="brand-mark brand-mask" role="img" aria-label="'+esc(label)+'" style="--logo:url('+custom+')"><img src="'+custom+'" alt="" aria-hidden="true"></span>':'<img class="brand-mark" alt="'+esc(label)+'" src="'+custom+'">';}
  return BRAND&&BRAND.d?'<svg class="brand-mark" viewBox="'+esc(BRAND.viewBox)+'" role="img" aria-label="'+esc(label)+'"><path d="'+esc(BRAND.d)+'" fill="currentColor"/></svg>':'';}

var cur=function(){return (MENU&&MENU.store&&MENU.store.currency)||{symbol:'$',locale:'es-AR'}};
var fmt=function(n){return cur().symbol+Number(n||0).toLocaleString(cur().locale,{maximumFractionDigits:0})};
var q=new URLSearchParams(location.search);

// ── carga: menú en vivo (Supabase, si hay) y respaldo en menu.json ──
function sb(){return MENU&&MENU.supabase;}
function sbHeaders(extra){var s=sb();return Object.assign({apikey:s.anonKey,Authorization:'Bearer '+s.anonKey,'Content-Type':'application/json'},extra||{});}
function fetchLimited(url,options,ms){var controller=new AbortController(),timer=setTimeout(function(){controller.abort();},ms||8000);return fetch(url,Object.assign({},options||{},{signal:controller.signal})).finally(function(){clearTimeout(timer);});}
function slugFromLocation(){
  var s=q.get('store'); if(s) return s;
  var h=location.hostname.split('.'); if(h.length>=3 && h[0]!=='www') return h[0];
  return '';
}
function load(){
  return fetch('menu.json',{cache:'no-cache'}).then(function(r){if(!r.ok)throw new Error('menu.json '+r.status);return r.json();})
   .catch(function(){var el=$('menu-fallback');var d=null;try{d=JSON.parse(el.textContent.replace(/^\/\*.*?\*\//,''));}catch(e){}if(!d)throw new Error('No pudimos cargar el menú.');return d;})
   .then(function(base){
     MENU=base; applyTheme();render();route(); var s=sb(); if(!s) return;
     var slug=slugFromLocation()||s.slug;
     var url=s.url+'/rest/v1/stores?select=id,menus(json)&'+(slug?'slug=eq.'+encodeURIComponent(slug):'id=eq.'+encodeURIComponent(s.storeId));
     return fetchLimited(url,{headers:sbHeaders()}).then(function(r){return r.ok?r.json():[];}).then(function(rows){
       var live=rows&&rows[0]&&rows[0].menus&&(Array.isArray(rows[0].menus)?rows[0].menus[0]:rows[0].menus);
       if(live&&live.json&&live.json.products){var keep=base.supabase;MENU=publishedMenuWithLiveCatalog(base,live.json);
       /* Las URL de Storage ya están subidas. Las rutas locales requieren el archivo publicado. */
       var had={};base.products.forEach(function(b){if(b.image)had[b.id+'|'+b.image]=1;});
       MENU.products.forEach(function(p){if(p.image&&!/^https:\/\//.test(p.image)&&!had[p.id+'|'+p.image])p.image=null;});MENU.supabase=keep;if(rows[0].id)MENU.supabase=Object.assign({},keep,{storeId:rows[0].id});}
     }).catch(function(){/* sin conexión: queda el menu.json */});
   });
}

// ── Checkout Pro por negocio; las credenciales privadas nunca llegan al navegador ──
var mpAvailable=false, mpPending=null, mpResult=null, mpTimer=null, mpPolls=0, mpBusy=false, mpPaymentId=null;
function mpEndpoint(path){return sb().url+'/functions/v1/sahten-payments/'+path;}
function mpSessionKey(){return 'sahten-mp:'+sb().storeId;}
function mpSavePending(p){sessionStorage.setItem(mpSessionKey(),JSON.stringify(p));mpPending=p;}
function mpConfig(){
  if(!sb())return Promise.resolve();
  return fetchLimited(mpEndpoint('config')+'?store_id='+encodeURIComponent(sb().storeId)+(q.get('mp_test')==='1'?'&test=1':''),{headers:sbHeaders()},5000)
    .then(function(r){return r.ok?r.json():{};}).then(function(c){mpAvailable=!!c.enabled;}).catch(function(){mpAvailable=false;});
}
function mpCall(path,data){return fetch(mpEndpoint(path),{method:'POST',headers:sbHeaders(),body:JSON.stringify(data)}).then(function(r){return r.json().then(function(d){if(!r.ok){var e=new Error(d.message||'No pudimos conectar con Mercado Pago.');e.code=d.code;throw e;}return d;});});}
function mpGo(url){var u=new URL(url);if(u.protocol!=='https:'||!/^(?:(?:www|sandbox)\.)?mercadopago\.com(?:\.ar)?$/.test(u.hostname))throw new Error('El enlace de pago no es válido.');location.assign(u.href);}
function mpStart(o){
  if(!mpAvailable){sending=false;refreshSend();$('err').textContent='Este negocio todavía no habilitó Mercado Pago.';return;}
  try{
    if(mpResult&&['paid','overpaid','refunded','partially_refunded','charged_back'].includes(mpResult.paymentStatus)){mpPending=null;mpResult=null;}
    var fingerprint=JSON.stringify(o.items.map(function(i){return [i.id,i.qty];}))+JSON.stringify([o.source,o.address,o.lat,o.lng,o.total,o.customerName,o.customerPhone,o.notes]);
    if(!mpPending||mpPending.fingerprint!==fingerprint){var bytes=new Uint8Array(32);crypto.getRandomValues(bytes);mpSavePending({requestId:crypto.randomUUID(),proof:Array.from(bytes,function(b){return b.toString(16).padStart(2,'0');}).join(''),fingerprint:fingerprint,cart:cart,createdAt:Date.now()});}
  }catch(e){sending=false;refreshSend();$('err').textContent='Habilitá el almacenamiento de esta página para continuar con el pago.';return;}
  mpCall('checkout',{storeId:sb().storeId,requestId:mpPending.requestId,proof:mpPending.proof,order:o}).then(function(c){
    mpSavePending(Object.assign({},mpPending,{id:c.id}));
    if(!c.checkoutUrl){sending=false;mpResult=c;step='mp';sheet();showSheet();return;}
    mpGo(c.checkoutUrl);
  }).catch(function(e){sending=false;if(e.code==='checkout_expired'||e.code==='checkout_conflict')mpPending=null;refreshSend();$('err').textContent=e.message;});
}
function mpStatusText(){var s=mpResult&&mpResult.paymentStatus;if(s==='paid'&&mpResult.mode==='test')return 'Pago de prueba acreditado. No se creó una venta real.';return ({paid:'Pago acreditado. El negocio recibió tu pedido.',overpaid:'Se acreditó más de un pago. El negocio recibió un solo pedido; contactalo para revisar el cobro excedente.',in_mediation:'El pago está en revisión. Consultá al negocio por tu pedido.',pending:'Pago pendiente. El pedido se enviará al negocio cuando se acredite completo.',partial:'El pago está incompleto. Esperamos la acreditación del importe total.',rejected:'El pago no se acreditó. Podés volver a intentarlo en Mercado Pago.',refunded:'El pago fue reembolsado. Consultá al negocio por tu pedido.',partially_refunded:'El pago tiene un reembolso parcial. Consultá al negocio.',charged_back:'El pago tiene un contracargo. Consultá al negocio.'})[s]||'Estamos verificando el pago. Volver desde Mercado Pago no confirma por sí solo su acreditación.';}
function mpSheet(){
  var s=mpResult&&mpResult.paymentStatus;
  setSheetContent('<h3>Pago con Mercado Pago</h3><p role="status">'+esc(mpStatusText())+'</p>'+(mpResult?'<div class="row t"><span>Total</span><span>'+fmt(mpResult.total)+'</span></div>':'')+(!mpPending?'<p>Para consultar el resultado de esta compra, volvé desde el mismo navegador donde iniciaste el pago o contactá al negocio.</p>':''),
    (mpPending?'<button class="cta" data-mp-refresh>Verificar pago</button>':'')+((s==='rejected'||s==='pending')&&mpResult.checkoutUrl?'<button class="cta ghost" data-mp-retry>Volver a Mercado Pago</button>':'')+'<button class="cta ghost" data-close>Volver al menú</button>');
}
function mpRefresh(paymentId){
  if(!mpPending||!mpPending.id||mpBusy)return Promise.resolve();mpBusy=true;
  return mpCall('status',{id:mpPending.id,proof:mpPending.proof,paymentId:paymentId||mpPaymentId||undefined}).then(function(c){mpResult=c;if(['paid','overpaid'].includes(c.paymentStatus)){cart={};render();}if(step==='mp')sheet();
    clearTimeout(mpTimer);if(['pending','partial'].includes(c.paymentStatus)&&mpPolls++<12)mpTimer=setTimeout(function(){mpRefresh();},10000);
  }).catch(function(e){if(step==='mp'){$('sheet').querySelector('[role=status]').textContent=e.message||'Todavía no pudimos verificar el pago. Podés reintentar en unos segundos.';}}).finally(function(){mpBusy=false;});
}
function mpReturn(){
  if(!sb()||!q.get('mp_checkout'))return;
  try{var p=JSON.parse(sessionStorage.getItem(mpSessionKey())||'null');if(p&&p.id===q.get('mp_checkout')&&Date.now()-p.createdAt<86400000){mpPending=p;cart=p.cart||{};render();}}catch(e){}
  mpPaymentId=q.get('payment_id')||q.get('collection_id');step='mp';sheet();showSheet();mpRefresh(mpPaymentId);
}
document.addEventListener('click',function(e){if(e.target.closest('[data-mp-refresh]'))mpRefresh();if(e.target.closest('[data-mp-retry]')&&mpResult&&mpResult.checkoutUrl)mpGo(mpResult.checkoutUrl);});

// ── pantalla ──
var activeCat='all';
function applyTheme(){var t=MENU.theme||{},r=document.documentElement;if(t.primary)r.style.setProperty('--primary',t.primary);if(t.accent)r.style.setProperty('--accent',t.accent);r.style.setProperty('--on-primary',contrastText(t.primary||'#235328'));r.style.setProperty('--on-accent',contrastText(t.accent||'#F28C00'));}
function render(){
  var c=MENU.config||{},seo=buildSeo(MENU);document.title=(ORDER_PAGE?'Pedir online | ':'')+seo.title;
  var fallback=$('search-content');if(fallback)fallback.hidden=true;
  var description=document.querySelector('meta[name="description"]');if(description)description.content=seo.description;
  var schema=$('restaurant-schema');if(schema)schema.textContent=JSON.stringify(seo.schema);
  $('h-title').textContent=c.title||MENU.store.name||'Menú';if((BRAND||(MENU.site&&MENU.site.logo))&&!$('h-mark')){var hm=document.createElement('div');hm.id='h-mark';hm.innerHTML=brandMark(MENU.store.name||'Menú');$('h-title').parentNode.insertBefore(hm,$('h-title'));}$('h-sub').textContent=c.subtitle||'';
  $('foot').textContent=[MENU.store.name,MENU.store.address].filter(Boolean).join(' · ');
  if(c.enabled===false){$('grid').innerHTML='';$('cats').innerHTML='';$('msg').innerHTML='<div class="empty"><b>Menú no disponible por ahora</b><br>Volvé a intentar más tarde.</div>';return;}
  var cats=catList();
  $('cats').innerHTML=['all'].concat(cats).map(function(k){return '<button class="cat '+(k===activeCat?'on':'')+'" data-cat="'+esc(k)+'">'+(k==='all'?'Todo':esc(k))+'</button>'}).join('');
  site();
  var list=MENU.products.filter(function(p){return activeCat==='all'||p.category===activeCat});
  $('grid').innerHTML=list.length?list.map(card).join(''):'<div class="empty">Todavía no hay productos para mostrar.</div>';
  bar();
}
function catList(){var c=MENU.config||{};return c.categories&&c.categories.length?c.categories:Array.from(new Set(MENU.products.map(function(p){return p.category}).filter(Boolean)));}
function separateStore(){return !!(MENU.site&&MENU.site.enabled&&MENU.site.orderPage&&!ORDER_PAGE&&!PREVIEW);}
function orderHref(category){return PREVIEW?'#pedido'+(category?'/'+encodeURIComponent(category):''):storefrontHref(MENU,document.baseURI,location.search,category);}
function waIcon(){return "<svg class=\"wa-icon\" width=\"22\" height=\"22\" fill=\"currentColor\" aria-hidden=\"true\" focusable=\"false\" xmlns=\"http://www.w3.org/2000/svg\" viewBox=\"0 0 448 512\"><!--! Font Awesome Free 6.7.2 by @fontawesome - https://fontawesome.com License - https://fontawesome.com/license/free (Icons: CC BY 4.0, Fonts: SIL OFL 1.1, Code: MIT License) Copyright 2024 Fonticons, Inc. --><path d=\"M380.9 97.1C339 55.1 283.2 32 223.9 32c-122.4 0-222 99.6-222 222 0 39.1 10.2 77.3 29.6 111L0 480l117.7-30.9c32.4 17.7 68.9 27 106.1 27h.1c122.3 0 224.1-99.6 224.1-222 0-59.3-25.2-115-67.1-157zm-157 341.6c-33.2 0-65.7-8.9-94-25.7l-6.7-4-69.8 18.3L72 359.2l-4.4-7c-18.5-29.4-28.2-63.3-28.2-98.2 0-101.7 82.8-184.5 184.6-184.5 49.3 0 95.6 19.2 130.4 54.1 34.8 34.9 56.2 81.2 56.1 130.5 0 101.8-84.9 184.6-186.6 184.6zm101.2-138.2c-5.5-2.8-32.8-16.2-37.9-18-5.1-1.9-8.8-2.8-12.5 2.8-3.7 5.6-14.3 18-17.6 21.8-3.2 3.7-6.5 4.2-12 1.4-32.6-16.3-54-29.1-75.5-66-5.7-9.8 5.7-9.1 16.3-30.3 1.8-3.7.9-6.9-.5-9.7-1.4-2.8-12.5-30.1-17.1-41.2-4.5-10.8-9.1-9.3-12.5-9.5-3.2-.2-6.9-.2-10.6-.2-3.7 0-9.7 1.4-14.8 6.9-5.1 5.6-19.4 19-19.4 46.3 0 27.3 19.9 53.7 22.6 57.4 2.8 3.7 39.1 59.7 94.8 83.8 35.2 15.2 49 16.5 66.6 13.9 10.7-1.6 32.8-13.4 37.4-26.4 4.6-13 4.6-24.1 3.2-26.4-1.3-2.5-5-3.9-10.5-6.6z\"/></svg>";}
function waHref(msg){var n=String((MENU.store&&MENU.store.whatsapp)||'').replace(/\D/g,'');return n?'https://wa.me/'+n+(msg?'?text='+encodeURIComponent(msg):''):'';}
function paras(t){return String(t||'').split(/\n{2,}/).map(function(x){return x.trim()}).filter(Boolean).map(function(x){return '<p>'+esc(x).replace(/\n/g,'<br>')+'</p>'}).join('');}
var NAVLBL={como:'Cómo funciona',historia:'Nosotros',resenas:'Reseñas',catering:'Catering',faq:'Preguntas',contacto:'Contacto'};
var MOD={
  hero:function(S,m){var f=m.hero,c=MENU.config||{},name=MENU.store.name||c.title||'Menú',img=S.images&&S.images.hero;
    return '<section class="hero'+(img?' img':'')+'" id="s-hero"'+(img?' style="background-image:url(\''+esc(img)+'\')"':'')+'>'+'<div class="hero-brand"'+(/^#[0-9a-f]{6}$/i.test(f.logoColor||'')?' style="color:'+f.logoColor+'"':'')+'>'+(brandMark(name,'hero')||'<span class="tag">'+esc(name)+'</span>')+'</div><h1>'+esc(f.title||c.title||name)+'</h1>'+((f.subtitle||c.subtitle)?'<p>'+esc(f.subtitle||c.subtitle)+'</p>':'')+
      '<div class="btns"><a class="btn1" href="'+esc(orderHref())+'">'+esc(f.cta)+' →</a>'+(waHref()?'<a class="btn2" target="_blank" rel="noopener" href="'+esc(waHref())+'">' +waIcon()+'WhatsApp</a>':'')+'</div>'+
      (f.highlights.length?'<div class="hl">'+f.highlights.map(function(x){return '<div>'+(x.icon?'<i>'+esc(x.icon)+'</i>':'')+'<b>'+esc(x.title)+'</b>'+(x.text?'<span>'+esc(x.text)+'</span>':'')+'</div>'}).join('')+'</div>':'')+'</section>';},
  favoritos:function(S,m){var favs=MENU.products.filter(function(p){return p.star}).slice(0,6);if(!favs.length)return '';
    return '<section class="sec fav" id="s-fav"><span class="eyebrow">Del menú</span><h2>'+esc(m.favoritos.title)+'</h2>'+(m.favoritos.text?'<p class="lead">'+esc(m.favoritos.text)+'</p>':'')+'<div class="grid">'+favs.map(card).join('')+'</div><a class="more" href="'+esc(orderHref())+'">Explorar todo el menú →</a></section>';},
  menu:function(S){
    var tiles=catList().map(function(k){var ps=MENU.products.filter(function(p){return p.category===k});if(!ps.length)return '';var im=ps.filter(function(p){return p.image})[0];var ci=(MENU.config.categoryImages||{})[k];var src=ci||(im&&im.image)||'';var fb=ci&&im?im.image:'';
      return '<a class="ctile" href="'+esc(orderHref(k))+'"><span class="ct-ph">'+(src&&MENU.config.showImages!==false?'<img loading="lazy" alt="" src="'+esc(src)+'" onerror="var f=this.getAttribute(\'data-fb\');if(f){this.removeAttribute(\'data-fb\');this.src=f}else{this.parentNode.textContent=this.getAttribute(\'data-i\')}" data-fb="'+esc(fb)+'" data-i="'+esc(k.charAt(0).toUpperCase())+'">':esc(k.charAt(0).toUpperCase()))+'</span><b>'+esc(k)+'</b><small>'+ps.length+(ps.length===1?' producto':' productos')+'</small></a>'}).join('');
    return '<section class="sec" id="s-menuhd"><span class="eyebrow">Pedí online</span><h2 style="font-family:var(--serif);font-weight:400;font-size:clamp(28px,5vw,42px);margin:0;line-height:1.1">'+esc(S.menuTitle)+'</h2>'+(tiles?'<div class="ctiles">'+tiles+'</div>':'')+'<a class="pedir-cta" href="'+esc(orderHref())+'">Pedir online · ver toda la carta →</a></section>';},
  como:function(S,m){var f=m.como;if(!f.steps.length)return '';return '<section class="sec alt" id="s-how"><div class="in"><span class="eyebrow">Paso a paso</span><h2>'+esc(f.title)+'</h2>'+(f.lead?'<p class="lead">'+esc(f.lead)+'</p>':'')+'<div class="steps">'+f.steps.map(function(x,i){return '<div class="step"><em>'+(i+1)+'</em><b>'+esc(x.title)+'</b><div class="desc">'+esc(x.text)+'</div></div>'}).join('')+'</div></div></section>';},
  historia:function(S,m){var f=m.historia,img=S.images&&S.images.historia;if(!f.text&&!f.title)return '';
    var badge=f.badgeWord?'<div class="badge"><small>'+esc(f.badgeMeaning?'¿Qué significa?':'Destacado')+'</small><div class="w">'+esc(f.badgeWord)+'</div>'+(f.badgeMeaning?'<div class="m">'+esc(f.badgeMeaning)+'</div>':'')+(f.badgeQuote?'<div class="q">'+esc(f.badgeQuote)+'</div>':'')+'</div>':'';
    return '<section class="sec about" id="s-about"><div class="'+(img?'two':'')+'"><div><span class="eyebrow">'+esc(f.eyebrow||'Nuestra historia')+'</span><h2 style="font-family:var(--serif);font-weight:400;font-size:clamp(28px,5vw,42px);line-height:1.1;margin:0 0 16px">'+esc(f.title||'Quiénes somos')+'</h2>'+paras(f.text)+badge+'</div>'+(img?'<div class="pic" role="img" aria-label="Foto de '+esc(MENU.store.name||'nuestro local')+'" style="background-image:url(\''+esc(img)+'\')"></div>':'')+'</div></section>';},
  banda:function(S,m){var t=m.banda.text;if(!t)return '';var run=(' '+t+' · ').repeat(8);return '<div class="band" aria-hidden="true"><div>'+esc(run)+'</div></div>';},
  resenas:function(S,m){var f=m.resenas,link=reviewUrl(f.reviewUrl);if(!f.items.length&&!link)return '';var invite=link?'<div class="review-invite"><div><h3>'+esc(f.reviewTitle||'¿Ya probaste nuestra comida?')+'</h3><p>'+esc(f.reviewText||'Contanos cómo estuvo tu experiencia.')+'</p></div><a class="google-review-button" href="'+esc(link)+'" target="_blank" rel="noopener noreferrer"><img src="https://www.gstatic.com/images/branding/product/1x/googleg_48dp.png" alt="" width="24" height="24">Dejar una reseña en Google<span class="sr-only"> (se abre en otra pestaña)</span></a></div>':'';return '<section class="sec alt" id="s-reviews"><div class="in"><span class="eyebrow">Opiniones</span><h2>'+esc(f.title)+'</h2>'+(f.lead?'<p class="lead">'+esc(f.lead)+'</p>':'')+'<div class="revs">'+f.items.map(function(x){return '<div class="rev"><div class="st" aria-label="5 estrellas">★★★★★</div>“'+esc(x.text)+'”'+((x.author||x.source)?'<small>'+esc([x.author,x.source].filter(Boolean).join(' · '))+'</small>':'')+'</div>'}).join('')+'</div>'+invite+'</div></section>';},
  catering:function(S,m){var f=m.catering,wa=waHref('Hola, quiero consultar por catering');if(!f.text&&!f.info.length)return '';
    return '<section class="sec dark" id="s-catering"><div class="in"><div class="two"><div><span class="eyebrow">'+esc(f.eyebrow||'Catering y eventos')+'</span><h2 style="font-family:var(--serif);font-weight:400;font-size:clamp(28px,5vw,42px);line-height:1.1;margin:0 0 14px">'+esc(f.title)+'</h2>'+paras(f.text).replace(/<p>/g,'<p style="line-height:1.65;margin:0 0 12px;opacity:.9">')+(wa?'<a class="btn1" style="margin-top:8px" target="_blank" rel="noopener" href="'+esc(wa)+'">'+esc(f.cta)+'</a>':'')+'</div>'+(f.info.length?'<div class="cat-info">'+f.info.map(function(i){return '<div><b>'+esc(i.label)+'</b>'+esc(i.value)+'</div>'}).join('')+'</div>':'')+'</div></div></section>';},
  delivery:function(S,m){var f=m.delivery,D=MENU.delivery||{},zones=(D.zones||[]).map(function(z){return z.name}).filter(Boolean);
    if(!(f.hours||zones.length||D.freeShippingMin||D.deliveryMinOrder||MENU.store.address))return '';
    var a='<div><h3>🛵 '+esc(f.title)+'</h3>'+(f.hours?'<div>'+esc(f.hours).replace(/\n/g,'<br>')+'</div>':'')+(D.deliveryMinOrder?'<div>Pedido mínimo: <b>'+fmt(D.deliveryMinOrder)+'</b></div>':'')+(D.freeShippingMin?'<div>Envío gratis desde <b>'+fmt(D.freeShippingMin)+'</b></div>':'')+(f.extra?'<div>'+esc(f.extra)+'</div>':'')+'</div>';
    var b=MENU.store.address?'<div><h3>🏠 Retiro en el local</h3><div>'+esc(MENU.store.address)+'</div></div>':'';
    return '<section class="sec" id="s-delivery"><div class="info">'+a+b+'</div></section>';},
  faq:function(S,m){var f=m.faq;if(!f.items.length)return '';return '<section class="sec faq" id="s-faq"><span class="eyebrow">Ayuda</span><h2>'+esc(f.title)+'</h2>'+f.items.map(function(x){return '<details><summary>'+esc(x.q)+'</summary><p>'+esc(x.a)+'</p></details>'}).join('')+'</section>';},
  contacto:function(S,m){var f=m.contacto,wa=waHref(),name=MENU.store.name||'',hrs=(S.delivery&&S.delivery.hours)||'',credit=f.creditText||'Hecho con Sahten',creditLink=publicWebUrl(f.creditUrl),pg=sitePageList(MENU).map(function(p){return '<a href="'+esc(p.slug)+'/">'+esc(p.label)+'</a>'}).join('<br>');
    return '<footer class="sfoot" id="s-contact"><div class="cols"><div><b>'+esc(name)+'</b>'+(f.note?'<div>'+esc(f.note)+'</div>':'')+'</div>'+(MENU.store.address?'<div><h4>Dónde</h4>'+esc(MENU.store.address)+'</div>':'')+(hrs?'<div><h4>Horarios</h4>'+esc(hrs).replace(/\n/g,'<br>')+'</div>':'')+(pg?'<div><h4>Más información</h4>'+pg+'</div>':'')+((wa||f.instagram)?'<div><h4>Escribinos</h4>'+(wa?'<a href="'+esc(wa)+'" target="_blank" rel="noopener">' +waIcon()+'WhatsApp</a>':'')+(f.instagram?(wa?'<br>':'')+'<a href="https://instagram.com/'+esc(f.instagram)+'" target="_blank" rel="noopener">@'+esc(f.instagram)+'</a>':'')+'</div>':'')+'</div><div class="by">'+(creditLink?'<a href="'+esc(creditLink)+'" target="_blank" rel="noopener noreferrer">'+esc(credit)+'</a>':esc(credit))+'</div></footer>';}
};
var navResizeObserver=null;
function site(){
  if(navResizeObserver){navResizeObserver.disconnect();navResizeObserver=null;}
  var S=MENU.site,c=MENU.config||{},on=!!(S&&S.enabled&&c.enabled!==false),top=$('s-top'),rest=$('s-rest');
  document.body.classList.toggle('has-site',on);
  if(ORDER_PAGE){$('oback').querySelector('a').href=new URL('./',document.baseURI).href;}
  if(!on){$('s-nav').innerHTML='';top.innerHTML='';rest.innerHTML='';var fab0=$('fab');if(fab0)fab0.remove();return;}
  var name=MENU.store.name||c.title||'Menú',wa=waHref(),order=S.order||['hero','favoritos','menu'],before='',after='',seen=false,links=[['#pedido','Menú']],hasContact=false;
  order.forEach(function(id){
    if(id==='menu'){seen=true;before+=MOD.menu(S);return;}
    var html=MOD[id]?MOD[id](S,S):'';if(!html)return;
    if(NAVLBL[id])links.push(['#'+({como:'s-how',historia:'s-about',resenas:'s-reviews',catering:'s-catering',faq:'s-faq',contacto:'s-contact'})[id],NAVLBL[id]]);
    if(id==='contacto')hasContact=true;
    if(seen)after+=html;else before+=html;
  });
  links.sort(function(a,b){return order.indexOf(idOf(a[0]))-order.indexOf(idOf(b[0]));});
  var home=new URL('./',document.baseURI).href;
  var navLinks=(ORDER_PAGE?'<a href="'+esc(home)+'">Inicio</a>':'')+links.map(function(l){var menu=l[0]==='#pedido',href=menu?orderHref():(ORDER_PAGE?home+l[0]:l[0]);return '<a href="'+esc(href)+'"'+(ORDER_PAGE&&menu?' aria-current="page"':'')+'>'+l[1]+'</a>'}).join('');
  var waLink=wa?'<a class="wa" href="'+esc(wa)+'" target="_blank" rel="noopener">' +waIcon()+'WhatsApp</a>':'';
  $('s-nav').innerHTML='<nav class="snav" id="snav" aria-label="Secciones"><a class="nav-brand" href="'+esc(ORDER_PAGE?home:'#')+'" aria-label="'+esc(name)+' · Inicio">'+(brandMark(name)||'<b>'+esc(name)+'</b>')+'</a><div class="snav-links">'+navLinks+'</div><details class="snav-menu"><summary aria-label="Desplegar secciones del sitio">Secciones</summary><div>'+navLinks+(wa?'<a href="'+esc(wa)+'" target="_blank" rel="noopener">' +waIcon()+'WhatsApp</a>':'')+'</div></details>'+waLink+(separateStore()?'<a class="pedido" href="'+esc(orderHref())+'">Pedir online →</a>':'<button class="pedido" onclick="openCart()">Mi pedido ('+count()+')</button>')+'</nav>';

  top.innerHTML=ORDER_PAGE?'':before;rest.innerHTML=ORDER_PAGE?'':after;$('foot').textContent=hasContact?'':[MENU.store.name,MENU.store.address].filter(Boolean).join(' · ');
  var f=$('fab');if(wa&&!f){f=document.createElement('a');f.id='fab';f.className='fab';f.target='_blank';f.rel='noopener';f.setAttribute('aria-label','Escribinos por WhatsApp');f.innerHTML=waIcon();document.body.appendChild(f);}if(f)f.href=wa;
  var nv=$('snav');if(nv){var setH=function(){document.documentElement.style.setProperty('--navh',nv.offsetHeight+'px');};setH();if(window.ResizeObserver){navResizeObserver=new ResizeObserver(setH);navResizeObserver.observe(nv);}}
}
function idOf(h){return ({'#pedido':'menu','#s-how':'como','#s-about':'historia','#s-reviews':'resenas','#s-catering':'catering','#s-faq':'faq','#s-contact':'contacto'})[h]||'';}
function card(p){
  var n=cart[p.id]||0, showP=MENU.config.showPrices!==false;
  var img=p.image&&MENU.config.showImages!==false?'<img loading="lazy" decoding="async" src="'+esc(p.image)+'" alt="'+esc(p.name)+'" onerror="this.parentNode.textContent=this.getAttribute(\'data-i\')" data-i="'+esc((p.name||'?').charAt(0).toUpperCase())+'">':esc((p.name||'?').charAt(0).toUpperCase());
  return '<div class="card"><div class="ph">'+img+'</div><div class="body">'+(p.category?'<div class="cat-l">'+esc(p.category)+'</div>':'')+'<div class="name">'+esc(p.name)+'</div>'+(p.description?'<div class="desc">'+esc(p.description)+'</div>':'')+(showP?'<div class="price">'+fmt(p.price)+'</div>':'')+
   (separateStore()?'<a class="add" href="'+esc(orderHref(p.category))+'">Ver en la tienda →</a>':n?'<div class="qty"><button data-dec="'+esc(p.id)+'" aria-label="Quitar">−</button><b>'+n+'</b><button data-inc="'+esc(p.id)+'" aria-label="Agregar">+</button></div>':'<button class="add" data-inc="'+esc(p.id)+'">Agregar</button>')+'</div></div>';
}
function lines(){return MENU.products.filter(function(p){return cart[p.id]}).map(function(p){return {id:p.id,name:p.name,qty:cart[p.id],unitPrice:p.price,lineTotal:p.price*cart[p.id],priceRevision:p.priceRevision||null}});}
function subtotal(){return lines().reduce(function(s,l){return s+l.lineTotal},0);}
function count(){return lines().reduce(function(s,l){return s+l.qty},0);}
function bar(){var n=count();$('bar').classList.toggle('on',n>0);$('bar-n').textContent=n+(n===1?' producto':' productos');$('bar-t').textContent=fmt(subtotal());}
function change(id,d){cart[id]=Math.max(0,(cart[id]||0)+d);if(!cart[id])delete cart[id];if(geo)ship=shippingFor(MENU.delivery,geo.lat,geo.lng,subtotal());render();if($('ov').classList.contains('on'))sheet();}

// ── carrito / checkout ──
var sheetReturnFocus=null, sheetBackground=[];
function showSheet(){
  if(!$('ov').classList.contains('on')){
    sheetReturnFocus=document.activeElement;
    sheetBackground=Array.from(document.body.children).filter(function(el){return el.id!=='ov'&&el.tagName!=='SCRIPT'}).map(function(el){return [el,el.inert]});
    sheetBackground.forEach(function(x){x[0].inert=true});
  }
  document.querySelectorAll('.snav-menu[open]').forEach(function(el){el.removeAttribute('open')});
  $('ov').classList.add('on');document.body.classList.add('modal-open');$('sheet').focus({preventScroll:true});
}
function openCart(){step='cart';sheet();showSheet();}
function closeSheet(){
  $('ov').classList.remove('on');document.body.classList.remove('modal-open');
  sheetBackground.forEach(function(x){x[0].inert=!!x[1]});sheetBackground=[];
  var back=sheetReturnFocus&&sheetReturnFocus.isConnected?sheetReturnFocus:document.querySelector('.bar.on button,.snav .pedido');
  if(back)back.focus({preventScroll:true});
}
function setSheetContent(body,footer){
  var s=$('sheet'),active=document.activeElement,id=active&&active.id,old=s.querySelector('.sheet-body'),scroll=old?old.scrollTop:0;
  s.innerHTML='<div class="sheet-head"><h2 id="sheet-title">Tu pedido</h2><button class="sheet-close" data-close aria-label="Cerrar pedido">×</button></div><div class="sheet-body">'+body+'</div><div class="sheet-footer">'+(footer||'')+'</div>';
  s.querySelector('.sheet-body').scrollTop=scroll;
  if(s.contains(active)||active===s||$('ov').classList.contains('on')){var next=id&&$(id);(next||s).focus({preventScroll:true});}
}
function sendStatus(){
  if(sending)return pay==='mercadopago'?'Preparando el pago…':'Enviando pedido…';
  if(!payMethods().length)return 'La tienda todavía no habilitó un medio de pago.';
  if(!form.name.trim())return 'Completá tu nombre para enviar el pedido.';
  if(!form.phone.trim())return 'Completá tu teléfono para enviar el pedido.';
  if(type==='delivery'&&!(geo&&ship&&ship.ok))return 'Elegí una dirección dentro de la zona de entrega o seleccioná retiro.';
  return 'Revisá el total y enviá tu pedido.';
}
function payMethods(){var m=(MENU.payments&&MENU.payments.methods)||{efectivo:true};return Object.keys(m).filter(function(k){return m[k]&&(k!=='mercadopago'||mpAvailable)});}
function total(){return subtotal()+(type==='delivery'&&ship&&ship.ok?ship.cost:0);}
function shipNote(){
  if(type!=='delivery')return '';
  if(!geo)return '<div class="note">Escribí tu dirección y elegí una de las sugerencias para calcular el envío.</div>';
  if(ship.out)return '<div class="note err">Tu dirección está fuera de la zona de entrega ('+ship.distKm.toFixed(1)+' km). Podés retirar en el local.</div>';
  if(ship.belowMin)return '<div class="note err">El pedido mínimo para delivery es '+fmt(ship.minOrder)+'.</div>';
  return '<div class="note ok">Envío '+(ship.free?'<b>gratis</b>':'<b>'+fmt(ship.cost)+'</b>')+' · '+esc(ship.zone.name)+'</div>';
}
function sheet(){
  var s=$('sheet'),ls=lines();
  if(step==='mp'){mpSheet();return;}
  if(step==='done'){setSheetContent(done());return;}
  if(!ls.length){setSheetContent('<div class="empty">El carrito está vacío.</div>','<button class="cta ghost" data-close>Seguir viendo el menú</button>');return;}
  if(payMethods().indexOf(pay)<0)pay=payMethods()[0]||'';
  var labels=PAY_LABELS;
  var canSend=!sending&&payMethods().indexOf(pay)>=0&&form.name.trim()&&form.phone.trim()&&(type==='pickup'||(geo&&ship&&ship.ok));
  var body=ls.map(function(l){return '<div class="row"><span>'+esc(l.name)+' ×'+l.qty+'</span><span>'+fmt(l.lineTotal)+'</span></div>'}).join('')+
   '<div class="row"><span>Subtotal</span><span>'+fmt(subtotal())+'</span></div>'+(type==='delivery'&&ship&&ship.ok?'<div class="row"><span>Envío</span><span>'+(ship.cost?fmt(ship.cost):'Gratis')+'</span></div>':'')+'<div class="row t"><span>Total</span><span>'+fmt(total())+'</span></div>'+
   '<div class="seg"><button data-type="delivery" class="'+(type==='delivery'?'on':'')+'">🛵 Delivery</button><button data-type="pickup" class="'+(type==='pickup'?'on':'')+'">🏠 Retiro en local</button></div>'+
   (MENU.config.deliveryNote&&type==='delivery'?'<div class="note">'+esc(MENU.config.deliveryNote)+'</div>':'')+
   '<label for="f-name">Nombre</label><input id="f-name" autocomplete="name" value="'+esc(form.name)+'"><label for="f-phone">Teléfono</label><input id="f-phone" type="tel" autocomplete="tel" value="'+esc(form.phone)+'">'+
   (type==='delivery'?'<label for="f-addr">Dirección de entrega</label><input id="f-addr" autocomplete="street-address" placeholder="Calle y número, localidad" value="'+esc(form.address)+'"><div id="sugs"></div>'+shipNote():'<div class="note">Retiro: '+esc(MENU.store.address||'en el local')+'</div>')+
   '<label for="f-pay">Forma de pago</label><select id="f-pay">'+payMethods().map(function(k){return '<option value="'+k+'"'+(k===pay?' selected':'')+'>'+(labels[k]||k)+'</option>'}).join('')+'</select>'+
   '<label for="f-notes">Notas (opcional)</label><textarea id="f-notes" rows="2">'+esc(form.notes)+'</textarea>'+
   '';
  var footer='<div class="row t"><span>Total</span><span>'+fmt(total())+'</span></div><div id="send-status" class="sheet-status" role="status">'+sendStatus()+'</div><div id="err" role="alert"></div><button class="cta" id="send"'+(canSend?'':' disabled')+' aria-describedby="send-status">'+(pay==='mercadopago'?'Ir a Mercado Pago':sb()?'Enviar pedido':'Pedir por WhatsApp')+' · '+fmt(total())+'</button><button class="cta ghost" data-close>Seguir viendo el menú</button>';
  setSheetContent(body,footer);
  var bind=function(id,key){var el=$(id);if(el)el.addEventListener('input',function(){form[key]=el.value;refreshSend();});};
  bind('f-name','name');bind('f-phone','phone');bind('f-notes','notes');
  if($('f-pay'))$('f-pay').addEventListener('change',function(){pay=this.value;sheet();});
  if($('f-addr'))$('f-addr').addEventListener('input',function(){form.address=this.value;geo=null;ship=null;suggest(this.value);refreshSend();});
  renderSugs();
}
function refreshSend(){var b=$('send');if(!b)return;b.disabled=sending||payMethods().indexOf(pay)<0||!(form.name.trim()&&form.phone.trim()&&(type==='pickup'||(geo&&ship&&ship.ok)));var status=$('send-status');if(status)status.textContent=sendStatus();}
function suggest(v){clearTimeout(sugTimer);sugs=[];renderSugs();if(!v||v.length<5)return;sugTimer=setTimeout(function(){
  var near=MENU.delivery&&MENU.delivery.lat!=null?'&viewbox='+[MENU.delivery.lng-0.4,MENU.delivery.lat+0.4,MENU.delivery.lng+0.4,MENU.delivery.lat-0.4].join(',')+'&bounded=0':'';
  fetch('https://nominatim.openstreetmap.org/search?format=json&limit=5&accept-language=es&addressdetails=1&q='+encodeURIComponent(v)+near).then(function(r){return r.json()}).then(function(rows){
    sugs=(rows||[]).map(function(d){return {label:d.display_name.split(',').slice(0,3).join(','),lat:+d.lat,lng:+d.lon};});renderSugs();}).catch(function(){sugs=[];var e=$('err');if(e)e.innerHTML='<div class="note err">No pudimos buscar la dirección (sin conexión).</div>';});},500);}
function renderSugs(){var el=$('sugs');if(!el)return;el.innerHTML=sugs.length?'<div class="sug">'+sugs.map(function(s,i){return '<button type="button" data-sug="'+i+'">'+esc(s.label)+'</button>'}).join('')+'</div>':'';}
function pickSug(i){var s=sugs[i];if(!s)return;form.address=s.label;geo={lat:s.lat,lng:s.lng};sugs=[];ship=shippingFor(MENU.delivery,s.lat,s.lng,subtotal());sheet();}

function buildOrder(){
  var ls=lines(),sub=subtotal(),sh=type==='delivery'&&ship&&ship.ok?ship.cost:0;
  return {id:'web_'+Date.now().toString(36)+Math.random().toString(36).slice(2,6),num:Math.floor(Math.random()*9000)+1000,createdAt:new Date().toISOString(),source:type,status:'pendiente',
    customerName:form.name.trim(),customerPhone:form.phone.trim(),customerEmail:form.email.trim(),address:type==='delivery'?form.address:'Retiro en local',zoneName:type==='delivery'&&ship&&ship.zone?ship.zone.name:'',
    lat:geo?geo.lat:null,lng:geo?geo.lng:null,paymentMethod:pay,items:ls,subtotal:sub,discount:0,shipping:sh,total:sub+sh,notes:form.notes.trim()};
}
function waLink(o){return waUrl(MENU.store.whatsapp,o,cur());}
function send(){
  if(sending)return; var o=buildOrder(); lastOrder=o; sending=true; refreshSend();
  if(!sb()){ sending=false; var w=window.open(waLink(o),'_blank'); finish(o,false); return; }
  if(pay==='mercadopago'){mpStart(o);return;}
  var s=sb();
  fetch(s.url+'/rest/v1/orders',{method:'POST',headers:sbHeaders({Prefer:'return=minimal'}),body:JSON.stringify({store_id:s.storeId,payload:o})})
   .then(function(r){if(!r.ok)throw new Error('HTTP '+r.status);sending=false;finish(o,true);})
   .catch(function(){sending=false;step='cart';sheet();var e=$('err');if(e)e.innerHTML='<div class="note err"><b>No pudimos enviar tu pedido.</b> Revisá tu conexión y reintentá'+(MENU.store.whatsapp?', o pedilo por WhatsApp.':'.')+(MENU.store.whatsapp?'<br><a href="'+esc(waLink(o))+'" target="_blank" rel="noopener">Pedir por WhatsApp</a>':'')+'</div>';});
}
function finish(o,sent){cart={};step='done';render();sheet();showSheet();}
function done(){
  var o=lastOrder,bank=(MENU.payments&&MENU.payments.bank)||{},sent=!!sb();
  var bankHtml=o.paymentMethod==='transferencia'&&(bank.alias||bank.cbu||bank.bankName)?'<div class="note"><b>Datos para la transferencia</b><br>'+['bankName','accountHolder','cbu','alias'].filter(function(k){return bank[k]}).map(function(k){return esc(bank[k])}).join('<br>')+'</div>':'';
  return '<h2>¡Gracias, '+esc(o.customerName)+'!</h2><div class="note ok">'+(sent?'Recibimos tu pedido <b>#'+String(o.num).padStart(4,'0')+'</b>. Te vamos a avisar por teléfono.':'Se abrió WhatsApp con tu pedido <b>#'+String(o.num).padStart(4,'0')+'</b>. Enviá el mensaje para confirmarlo.')+'</div>'+bankHtml+
   '<div class="row t"><span>Total</span><span>'+fmt(o.total)+'</span></div>'+(MENU.store.whatsapp?'<a class="cta wa" style="display:block;text-align:center;text-decoration:none" target="_blank" rel="noopener" href="'+esc(waLink(o))+'">'+waIcon()+(sent?'Avisar por WhatsApp':'Abrir WhatsApp de nuevo')+'</a>':'')+'<button class="cta ghost" data-close>Volver al menú</button>';
}

// ── vistas: el inicio muestra un resumen y «Pedir online» abre la carta completa (#pedido o #pedido/Categoría) ──
function decodeCategory(value){try{return decodeURIComponent(value);}catch(e){return '';}}
function route(){
  if(!MENU)return;
  var h=location.hash||'',m=/^#(?:pedido|menu)(?:\/(.*))?$/.exec(h),site=document.body.classList.contains('has-site'),order=ORDER_PAGE||(!!m&&site);
  if(separateStore()&&(m||q.get('mp_checkout'))){location.replace(orderHref(m&&m[1]?decodeCategory(m[1]):''));return;}
  if(order){var k='all';if(m&&m[1]){try{k=decodeURIComponent(m[1]);}catch(e){}}if(k!=='all'&&catList().indexOf(k)<0)k='all';activeCat=k;}
  document.body.classList.toggle('view-order',order);
  render();
  if(!site)return;
  if(order){window.scrollTo({top:0,behavior:'instant'});var hd=$('oback-h');if(hd){hd.setAttribute('tabindex','-1');try{hd.focus({preventScroll:true});}catch(e){}}}
  else{var el=h.length>1?document.getElementById(decodeCategory(h.slice(1))):null;if(el&&el.scrollIntoView)el.scrollIntoView({behavior:'instant'});else window.scrollTo({top:0,behavior:'instant'});}
}
window.addEventListener('hashchange',route);

function visualArea(){var v=window.visualViewport;document.documentElement.style.setProperty('--visual-height',(v?v.height:window.innerHeight)+'px');document.documentElement.style.setProperty('--visual-top',(v?v.offsetTop:0)+'px');}
window.addEventListener('resize',visualArea);if(window.visualViewport){window.visualViewport.addEventListener('resize',visualArea);window.visualViewport.addEventListener('scroll',visualArea);}visualArea();
document.addEventListener('keydown',function(e){
  if(!$('ov').classList.contains('on')){
    if(e.key==='Escape')document.querySelectorAll('.snav-menu[open]').forEach(function(el){el.removeAttribute('open');el.querySelector('summary').focus()});
    return;
  }
  if(e.key==='Escape'){e.preventDefault();closeSheet();return;}
  if(e.key!=='Tab')return;
  var s=$('sheet'),all=Array.from(s.querySelectorAll('a[href],button:not([disabled]),input,select,textarea,[tabindex="0"]')).filter(function(el){return el.getClientRects().length});
  var first=all[0],last=all[all.length-1];
  if(!first){e.preventDefault();s.focus();return;}
  if(!s.contains(document.activeElement)||document.activeElement===s){e.preventDefault();(e.shiftKey?last:first).focus();}
  else if(e.shiftKey&&document.activeElement===first){e.preventDefault();last.focus();}
  else if(!e.shiftKey&&document.activeElement===last){e.preventDefault();first.focus();}
});
document.addEventListener('click',function(e){document.querySelectorAll('.snav-menu[open]').forEach(function(el){if(!el.contains(e.target)||e.target.closest('a'))el.removeAttribute('open')});});
document.addEventListener('click',function(e){
  var t=e.target.closest('[data-cat],[data-inc],[data-dec],[data-type],[data-sug],[data-close],#send');if(!t)return;
  if(t.dataset.cat!==undefined){activeCat=t.dataset.cat;render();if(document.body.classList.contains('view-order')){try{history.replaceState(null,'','#pedido'+(activeCat==='all'?'':'/'+encodeURIComponent(activeCat)));}catch(err){/* vista previa */}}}
  else if(t.dataset.inc!==undefined)change(t.dataset.inc,1);
  else if(t.dataset.dec!==undefined)change(t.dataset.dec,-1);
  else if(t.dataset.type!==undefined){type=t.dataset.type;if(type==='delivery'&&geo)ship=shippingFor(MENU.delivery,geo.lat,geo.lng,subtotal());sheet();}
  else if(t.dataset.sug!==undefined)pickSug(+t.dataset.sug);
  else if(t.hasAttribute('data-close'))closeSheet();
  else if(t.id==='send')send();
});
window.openCart=openCart;window.__menu=function(){return MENU;};
load().then(function(){applyTheme();render();route();mpConfig().then(function(){mpReturn();});}).catch(function(e){$('msg').innerHTML='<div class="empty"><b>No pudimos cargar el menú.</b><br>'+esc(e.message)+'<br><small>Si abriste el archivo directo desde tu computadora, probá desde el sitio publicado.</small></div>';});
})();
