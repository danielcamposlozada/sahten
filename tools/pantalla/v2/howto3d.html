<script type="module">
import * as THREE from 'three';
import { RoundedBoxGeometry } from 'three/addons/geometries/RoundedBoxGeometry.js';

const C={green:'#235328',deep:'#183d23',darker:'#112d1b',cream:'#FFF4D6',orange:'#EF8E23'};
const E={out:t=>1-Math.pow(1-t,4),inout:t=>t<.5?8*t**4:1-Math.pow(-2*t+2,4)/2,back:t=>{const c=1.70158*1.3,c3=c+1;return 1+c3*Math.pow(t-1,3)+c*Math.pow(t-1,2)}};

const $=id=>document.getElementById(id);
const VW=390,VH=800;                  // viewport capturado (CSS px)
const SW=3.6,SH=SW*VH/VW;             // pantalla 3D (unidades)
const BW=SW+.3,BH=SH+.34,BD=.4;      // cuerpo

let STEP=[{n:'01',t:'Elegí tus platos',a:3.6,b:8.6},{n:'02',t:'Revisá tu pedido',a:8.6,b:11.4},{n:'03',t:'Elegí entrega y pago',a:11.4,b:17.4}];
let TAPLIST=[[5.45,'03-antes-agregar','shawarma_carne'],[7.15,'05-antes-agregar-2','hummus'],[9.45,'07-antes-carrito'],[12.25,'09-antes-continuar'],[13.95,'11-antes-retiro'],[15.45,'13-antes-efectivo']];
let PLAN=[[0.0,'01-carta'],[3.9,'02-lista'],[4.7,'03-antes-agregar'],[5.6,'04-agregado'],[6.5,'05-antes-agregar-2'],[7.3,'06-agregado-2'],[8.8,'07-antes-carrito'],[9.6,'08-carrito'],[11.6,'09-antes-continuar'],[12.4,'10-entrega-pago'],[13.4,'11-antes-retiro'],[14.1,'12-retiro'],[15.0,'13-antes-efectivo'],[15.6,'14-efectivo']];

function patternSVG(color,op){const h=75,s=54;return `<svg width="100%" height="100%" xmlns="http://www.w3.org/2000/svg"><defs><pattern id="pp" width="150" height="150" patternUnits="userSpaceOnUse"><g fill="none" stroke="${color}" stroke-width="3" opacity="${op}"><rect x="${h-s}" y="${h-s}" width="${2*s}" height="${2*s}"/><rect x="${h-s}" y="${h-s}" width="${2*s}" height="${2*s}" transform="rotate(45 ${h} ${h})"/><circle cx="${h}" cy="${h}" r="23"/></g></pattern><radialGradient id="mg" cx="50%" cy="50%" r="62%"><stop offset="55%" stop-color="#000"/><stop offset="100%" stop-color="#fff"/></radialGradient><mask id="mm"><rect width="100%" height="100%" fill="url(#mg)"/></mask></defs><rect width="100%" height="100%" fill="url(#pp)" mask="url(#mm)"/></svg>`;}
function toonGrad(){const d=new Uint8Array([110,110,110,255,185,185,185,255,255,255,255,255]);const t=new THREE.DataTexture(d,3,1,THREE.RGBAFormat);t.minFilter=t.magFilter=THREE.NearestFilter;t.needsUpdate=true;return t;}

function roundRect(w,h,r){const s=new THREE.Shape(),x=-w/2,y=-h/2;s.moveTo(x+r,y);s.lineTo(x+w-r,y);s.quadraticCurveTo(x+w,y,x+w,y+r);s.lineTo(x+w,y+h-r);s.quadraticCurveTo(x+w,y+h,x+w-r,y+h);s.lineTo(x+r,y+h);s.quadraticCurveTo(x,y+h,x,y+h-r);s.lineTo(x,y+r);s.quadraticCurveTo(x,y,x+r,y);return s;}

// Celular: esquinas concéntricas (cuerpo → vidrio → pantalla), canto claro tipo marco, botones integrados.
const R_BODY=.52,GAP_GLASS=.05,GAP_SCREEN=.12;
function buildPhone(){
  const grad=toonGrad(),toon=c=>new THREE.MeshToonMaterial({color:c,gradientMap:grad});
  const g=new THREE.Group();
  // cuerpo: canto verde claro (marco) y tapa trasera más oscura
  const bev=.05,bodyGeo=new THREE.ExtrudeGeometry(roundRect(BW-2*bev,BH-2*bev,R_BODY-bev),{depth:BD-2*bev,bevelEnabled:true,bevelThickness:bev,bevelSize:bev,bevelSegments:5,curveSegments:24});
  bodyGeo.translate(0,0,-(BD-2*bev)/2);
  const body=new THREE.Mesh(bodyGeo,toon(0x3a8446));g.add(body);
  const back=new THREE.Mesh(flatShape(BW-.1,BH-.1,R_BODY-.05),toon(0x1d4a26));back.position.z=-BD/2-.001;back.rotation.y=Math.PI;g.add(back);

  const gw=BW-2*GAP_GLASS,gh=BH-2*GAP_GLASS,gr=R_BODY-GAP_GLASS;
  const glass=new THREE.Mesh(flatShape(gw,gh,gr),new THREE.MeshBasicMaterial({color:0x0a140d}));glass.position.z=BD/2+.002;g.add(glass);
  // pantalla (textura viva) concéntrica

  const cv=document.createElement('canvas');cv.width=VW*2;cv.height=VH*2;sctx=cv.getContext('2d');
  screenTex=new THREE.CanvasTexture(cv);screenTex.colorSpace=THREE.SRGBColorSpace;screenTex.anisotropy=8;
  const scr=new THREE.Mesh(flatShape(sw,sh,sr),new THREE.MeshBasicMaterial({map:screenTex}));scr.position.z=BD/2+.004;g.add(scr);

  const gloss=new THREE.Mesh(flatShape(gw,gh,gr),new THREE.MeshBasicMaterial({map:glossTexture(),transparent:true,opacity:.07,depthWrite:false}));gloss.position.z=BD/2+.006;g.add(gloss);

  const island=new THREE.Mesh(flatShape(.92,.26,.13),new THREE.MeshBasicMaterial({color:0x050b07}));island.position.set(0,sh/2-.19,BD/2+.005);g.add(island);

  const btn=(x,y,h)=>{const b=new THREE.Mesh(new RoundedBoxGeometry(.05,h,.13,4,.024),toon(0x2f7039));b.position.set(x,y,0);g.add(b);};

}
const SB=64; // barra de estado (px a 2×)
// PLAN: [inicio, 'nombre'] o [inicio, 'seq:nombre', duración]. Las secuencias (scroll, tipeo) se reproducen
// cuadro a cuadro; entre entradas hay un fundido limpio de 0,4 s (sin desplazamientos).

// Pantalla (x,y en px CSS del celular) → punto 3D local → píxel de la página
function screenToLocal(x,y){y=y+SB/2;return new THREE.Vector3((x/VW-.5)*SW,(.5-y/VH)*SH,BD/2+.03);}
function project(local){const v=local.clone();phone.localToWorld(v);v.project(camera);return {x:(v.x+1)/2*1080,y:(1-v.y)/2*1920};}

// Cámara fluida: Catmull-Rom sobre claves {t, zoom, fx, fy, ry, rx, py}
function camKeys(){

  k.push({t:0,zoom:.92,fx:0,fy:0,ry:-.75,rx:.3,py:-10});
  k.push({t:Math.min(1.2,SC.rise[0]-.9),zoom:.92,fx:0,fy:0,ry:-.6,rx:.22,py:-8});
  const [r0,r1]=SC.rise;

  k.push({t:r0,zoom:.97,fx:0,fy:0,ry:-.3,rx:.1,py:-2.9});
  k.push({t:r1,...N});
  for(const tp of (SC.calm?[]:TAPS)){const p=screenToLocal(tp.s.tap.x,tp.s.tap.y);

  k.push({t:X,...N,zoom:1.05});
  k.push({t:X+.7,zoom:.95,fx:0,fy:0,ry:.1,rx:.05,py:2.5});
  k.push({t:X+1.3,zoom:.9,fx:0,fy:0,ry:.25,rx:.05,py:9});

window.build=async(assets,data)=>{

  scene.add(new THREE.AmbientLight(0xffffff,1.3));const sun=new THREE.DirectionalLight(0xfff1dc,1.9);sun.position.set(-3,4,6);scene.add(sun);

  const txt=$('txt');
  const H=SC.hook;txt.innerHTML=`<div id="hook"><div class="kicker" style="color:${C.cream};margin-bottom:28px">${H.kicker}</div><span class="mask"><span class="heavy" id="h1" style="${H.size?'font-size:'+H.size+'px':''}">${H.l1}</span></span><span class="mask"><span class="heavy" id="h1b" style="${H.size?'font-size:'+H.size+'px':''}">${H.l1b}</span></span><span class="mask"><span class="ital" id="h2" style="color:${C.cream};font-size:120px">${H.ital}</span></span></div>`+
    '';

  $('cta').innerHTML=`<div style="position:absolute;inset:0;background:${C.green}"></div><div style="position:absolute;left:90px;right:90px;top:230px;color:${C.cream}"><div class="kicker" style="color:${C.orange};margin-bottom:26px">Tu pedido en minutos</div><div class="heavy" style="font-size:170px">Escaneá</div><div class="ital" style="font-size:140px;color:${C.orange}">y pedí online</div></div><div id="qrbox" style="position:absolute;left:220px;top:820px;width:640px;height:640px;background:${C.cream};padding:40px;box-sizing:content-box;clip-path:polygon(0 0,100% 0,100% calc(100% - 80px),calc(100% - 80px) 100%,0 100%)">${assets.qr}</div><div style="position:absolute;left:0;right:0;top:1600px;text-align:center;font:900 86px DM;letter-spacing:-.04em;color:${C.cream}">sahten.online</div>`;

window.frame=t=>{
  // cámara y celular
  const c=camAt(t);
  phone.rotation.set(c.rx,c.ry+(SC.calm?Math.sin(t*.3)*.012:Math.sin(t*.7)*.025),0);phone.position.set(0,c.py,0);
  const D=(SC.safe?30:25)/c.zoom,cy=c.fy+(SC.safe?.35:.62);camera.position.set(c.fx,cy,D);camera.lookAt(c.fx,cy,0);

  const tap=$('tap');let tv=-1,tp=null;for(const k of TAPS){const d=t-(k.t-.35);if(d>-.05&&d<.7){tv=d;tp=k;}}

    const from=project(screenToLocal(k.s.tap.x,k.s.tap.y-140));const x=lerp(from.x,bag.x,E.inout(u)),y=lerp(from.y,bag.y,E.inout(u))-Math.sin(u*Math.PI)*220;

  // textos
  const HA=SC.hook.a,HB=SC.hook.b;const hIn=E.out(seg(t,HA,HA+.8)),hOut=seg(t,HB-.4,HB);
  $('h1').style.transform=`translateY(${(1-hIn)*110}%)`;$('h1b').style.transform=`translateY(${(1-E.out(seg(t,HA+.08,HA+.88)))*110}%)`;$('h2').style.transform=`translateY(${(1-E.out(seg(t,HA+.15,HA+.95)))*110}%)`;$('hook').style.opacity=String(1-hOut);
  STEP.forEach((s,i)=>{const u=E.out(seg(t,s.a+.05,s.a+.6)),o=1-seg(t,s.b-.25,s.b);const v=t>=s.a&&t<s.b?u*o:0;const st=$('st'+i);st.style.opacity=String(v);st.style.transform=`translateY(${(1-u)*40}px)`;});
  SC.subs.forEach((x,i)=>{const u=E.out(seg(t,x.a,x.a+.45)),o=1-seg(t,x.b-.25,x.b);const el=$('sub'+i);el.style.opacity=String(t>=x.a&&t<x.b?u*o:0);el.style.transform=`translateY(${(1-u)*24}px)`;});
  if(SC.listo){const L=SC.listo,u=E.back(seg(t,L.a,L.a+.5)),o=1-seg(t,L.b-.3,L.b);const el=$('listo');el.style.opacity=String(t>=L.a&&t<L.b?Math.min(1,u)*o:0);el.style.transform=`scale(${.7+.3*Math.min(1.05,u)})`;}
  const X=SC.exitAt;const ct=E.inout(seg(t,X+.8,X+1.35));$('cta').style.transform=`translateY(${(1-ct)*1920}px)`;
  const qb=$('qrbox');if(qb)qb.style.transform=`scale(${.6+.4*E.back(seg(t,X+1.3,X+1.9))})`;
  const bOut=SC.bumper?E.inout(seg(t,.35,.9)):1,bIn=SC.bumper?E.inout(seg(t,T_TOTAL-.9,T_TOTAL-.35)):0;
  $('bump').style.transform=`translateY(${t<T_TOTAL/2?-bOut*1920:(1-bIn)*1920}px)`;
  $('pattern').style.transform=`translate(${-t*3}px,${-t*5}px)`;
  return true;
};
window.ready=async()=>{await document.fonts.ready;await Promise.all([...document.images].map(i=>i.decode().catch(()=>null)));return true;};
window.__loaded=true;
</script>
